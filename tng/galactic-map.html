<!doctype html>
<html><head><meta charset="utf-8"><title>Galactic Cartography</title>
<link rel="stylesheet" href="../lcars.css">
<style>
  .nm { text-shadow: 0 0 6px #07061a, 0 0 6px #07061a, 0 0 12px #07061a; }   /* names stand off the chart behind them */
  .fade { transition: opacity .45s ease; }
  .out:not(.boot) { opacity: .2; }
  .route { background: linear-gradient(to right, rgba(255,204,102,.95), rgba(255,204,102,.75)); transform-origin: 0 50%; border-radius: 2px; }
  .tip { border-radius: 50%; background: radial-gradient(closest-side, #fff 0%, #ffe6a8 40%, rgba(255,204,102,0)); }
  .ripple { border-radius: 50%; border: 4px solid var(--butter); }
  .sweep { border-radius: 50%;
           background: conic-gradient(from 0deg, rgba(199,160,216,0) 0deg, rgba(199,160,216,0) 285deg, rgba(199,160,216,.07) 330deg, rgba(199,160,216,.24) 360deg); }
  .sweep i { position: absolute; display: block; width: 3px; border-radius: 2px;
             background: linear-gradient(to top, rgba(232,220,255,.85), rgba(232,220,255,.15)); }
  .band { background: rgba(199,160,216,.16); border-radius: 0 28px 28px 0; }
</style></head>
<body><script src="../lcars.js"></script><script>
"use strict";
const L = LCARS;
L.ready(() => {

// ---------------- the frame: sidebar left, title top right ----------------
const BAR = 64;
L.title({ x: 3700, y: 40, h: BAR, c: "lilac", txt: "Galactic Cartography  •  Alpha and Beta Quadrants" });
// (L.title measures with a canvas, which sets this line ~11px wider than the page draws it; use the page's own width)
const titleLeft = 3700 - document.querySelector("[data-title]").offsetWidth;
L.box({ x: 3724, y: 40, w: 92, h: BAR, c: "violet", r: "r" });
L.elbow({ corner: "tl", x: 40, y: 40, w: 1360, h: 250, bw: 240, bh: BAR, R: 150, r: 60, c: "violet" });
L.rect({ x: 1400 + L.GAP, y: 40, w: 300, h: BAR, c: "gold" });
L.rect({ x: 1724 + L.GAP, y: 40, w: titleLeft - L.GAP - (1724 + L.GAP), h: BAR, c: "plum" });
[[298, 140, "lilac", "Carto 01"], [446, 70, "gold", "Grid"], [524, 420, "violet", "Galaxy"], [952, 70, "butter", "47"],
 [1030, 300, "plum", "Powers"], [1338, 70, "gold", "Range"], [1416, 216, "lilac", "Survey"]]
  .forEach(([y, h, c, label]) => L.box({ x: 40, y, w: 240, h, c, label }));
L.elbow({ corner: "bl", x: 40, y: 1640, w: 1500, h: 480, bw: 240, bh: BAR, R: 150, r: 60, c: "lilac" });
L.text({ x: 258, base: 1712, s: 40, c: "#000", txt: "Cartography", align: "r", on: true });
[[1540 + L.GAP, 600, "plum"], [2164 + L.GAP, 900, "gold"], [3088 + L.GAP, 3700 - (3088 + L.GAP), "violet"]]
  .forEach(([x, w, c]) => L.rect({ x, y: 2056, w, h: BAR, c }));
L.box({ x: 3724, y: 2056, w: 92, h: BAR, c: "lilac", r: "r" });

const header = (x, y, w, label, c1, c2, h = 56, fs = 32) => {
  const lw = Math.round((L.textWidth(label, fs) + 64) / 10) * 10;
  L.box({ x, y, w: lw, h, c: c1, label, fs, r: "l" });
  L.rect({ x: x + lw + L.GAP, y, w: w - lw - L.GAP, h, c: c2 });
};
const cls = (e, ...c) => (e.classList.add(...c), e);
// write only what changed: an unchanged reading costs nothing
const put = (e, txt) => { if (e.textContent !== txt) e.textContent = txt; };
const css = (e, k, v) => { if (e.style[k] !== v) e.style[k] = v; };
const fmt = (n, d = 0) => n.toLocaleString("en", { minimumFractionDigits: d, maximumFractionDigits: d });
// a seeded random: the same galaxy every time
const rng = (seed) => () => {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const gauss = (r) => (r() + r() + r() + r() - 2) / 0.577;
const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
// a soft territory outline, as an SVG path (also used on the canvases through Path2D)
const blob = (cx, cy, rx, ry, seed) => {
  const r = rng(seed), p = [r() * 6.28, r() * 6.28, r() * 6.28], a = [0.06 + 0.05 * r(), 0.04 + 0.04 * r(), 0.02 + 0.02 * r()];
  let d = "";
  for (let k = 0; k < 96; k++) {
    const th = (2 * Math.PI * k) / 96, f = 1 + a[0] * Math.sin(2 * th + p[0]) + a[1] * Math.sin(3 * th + p[1]) + a[2] * Math.sin(5 * th + p[2]);
    d += (k ? "L" : "M") + (cx + rx * f * Math.cos(th)).toFixed(1) + "," + (cy + ry * f * Math.sin(th)).toFixed(1);
  }
  return d + "Z";
};
// a layer holding one SVG drawing, for things that brighten and fade
const svgLayer = (x, y, w, h) => {
  const e = L.layer({ x, y, w, h });
  const s = L.svg("svg", { width: w, height: h, viewBox: `${x} ${y} ${w} ${h}` }, e);
  s.style.overflow = "visible";
  e.style.opacity = 0;
  return [e, s];
};

// ---------------- the powers ----------------
// Chart coordinates in light-years from Sol: +x towards the Beta Quadrant, +y towards the galactic core.
const POWERS = [
  { short: "Federation", name: "United Federation of Planets", cap: "Earth", gov: "Federation Council", founded: "2161",
    species: "Human  ·  Vulcan  ·  Andorian  ·  Tellarite", borders: "Klingon  ·  Romulan  ·  Cardassian", rel: "Member",
    relLong: "Founding world  ·  Sector 001", quads: ["Alpha", "Beta"], c: "#5c9dff",
    at: [0, 0], terr: [-12, -8, 104, 100, 11], label: [-30, -62], capSide: "r", route: "Origin  ·  Sector 001", mark: 0 },
  { short: "Klingon Empire", name: "Klingon Empire", cap: "Qo'noS", gov: "High Council  ·  Chancellor", founded: "c. 9th century  ·  Kahless",
    species: "Klingon", borders: "Federation  ·  Romulan", rel: "Allied", relLong: "Allied  ·  Khitomer Accords", quads: ["Beta"], c: "#e0533f",
    at: [68, 89], terr: [118, 182, 118, 122, 23], label: [138, 238], capSide: "r", route: "Open  ·  Khitomer Accords", mark: 4 },
  { short: "Romulan Empire", name: "Romulan Star Empire", cap: "Romulus", gov: "Senate  ·  Praetor", founded: "c. 4th century  ·  Sundering",
    species: "Romulan  ·  Reman", borders: "Federation  ·  Klingon", rel: "Hostile", relLong: "Treaty of Algeron  ·  Neutral Zone", quads: ["Beta"], c: "#6fc48c",
    at: [196, 30], terr: [252, 8, 108, 118, 37], label: [262, -78], capSide: "r", route: "Restricted  ·  Neutral Zone", mark: 2 },
  { short: "Cardassian Union", name: "Cardassian Union", cap: "Cardassia Prime", gov: "Detapa Council  ·  Central Command", founded: "Unknown",
    species: "Cardassian", borders: "Federation  ·  Bajor  ·  Breen", rel: "Treaty", relLong: "Treaty of 2370  ·  Demilitarized Zone", quads: ["Alpha"], c: "#d6a032",
    at: [-165, -130], terr: [-208, -176, 96, 92, 41], label: [-212, -262], capSide: "l", route: "Via Demilitarized Zone", mark: 7 },
  { short: "Ferengi Alliance", name: "Ferengi Alliance", cap: "Ferenginar", gov: "Grand Nagus  ·  Commerce Authority", founded: "Antiquity  ·  Gint",
    species: "Ferengi", borders: "Federation", rel: "Trade", relLong: "Trade  ·  First contact 2364", quads: ["Alpha"], c: "#ff9c1a",
    at: [-250, 120], terr: [-262, 128, 92, 86, 53], label: [-262, 238], capSide: "r", route: "Open  ·  Trade routes", mark: 9 },
  { short: "Tholian Assembly", name: "Tholian Assembly", cap: "Tholia", gov: "The Assembly", founded: "Unknown",
    species: "Tholian", borders: "Federation  ·  Klingon", rel: "Wary", relLong: "Wary  ·  Territorial disputes", quads: ["Alpha"], c: "#f4b6e6",
    at: [-55, 315], terr: [-62, 318, 74, 62, 67], label: [-218, 322], capSide: "r", route: "Restricted  ·  Tholian space", mark: 11 },
  { short: "Breen Confederacy", name: "Breen Confederacy", cap: "Breen", gov: "The Confederacy", founded: "Unknown",
    species: "Breen", borders: "Cardassian  ·  Federation", rel: "Neutral", relLong: "Unaligned  ·  Privateers", quads: ["Alpha"], c: "#8fd3ff",
    at: [0, -310], terr: [-8, -318, 92, 70, 79], label: [-118, -322], capSide: "r", route: "Not advised  ·  Unaligned", mark: 3 },
  { short: "The Dominion", name: "The Dominion", cap: "Founders' Homeworld", gov: "The Founders  ·  Great Link", founded: "c. 4th century",
    species: "Changeling  ·  Vorta  ·  Jem'Hadar", borders: "Gamma Quadrant", rel: "Wary", relLong: "First contact 2370", quads: ["Gamma"], c: "#b48cf0",
    gamma: true, route: "Via the Bajoran wormhole", mark: 1 },
  { short: "Borg Collective", name: "Borg Collective", cap: "Unimatrix 01", gov: "The Collective", founded: "Unknown",
    species: "Borg  ·  Assimilated", borders: "Delta Quadrant", rel: "Hostile", relLong: "Hostile  ·  Wolf 359, 2367", quads: ["Delta"], c: "#7fd0b8",
    delta: true, route: "Not advised  ·  Borg space", mark: 6 },
];
const BAJOR = [-120, -95];
const REL_C = { Member: "sky", Allied: "ice", Hostile: "mars", Treaty: "peach", Trade: "butter", Wary: "orange", Neutral: "lilac" };

// ---------------- status line ----------------
const stateTxt = L.text({ x: 330, cap: 150, s: 100, c: "butter", txt: "" });
const stateSub = L.text({ x: 1470, base: 222, s: 38, c: "lilac", txt: "" });          // on the chart column's line
const pill = L.box({ x: 3416, y: 150, w: 400, h: 72, c: "lilac", label: "", r: "lr", fs: 36 });
pill.style.willChange = "opacity";

// =============================================================================================
// ---------------- the galaxy, face on: four quadrants ----------------
// =============================================================================================
header(330, 280, 1080, "Milky Way  ·  Galactic Plane", "lilac", "violet");
const AX0 = 330, AY0 = 360, AW = 1080, AH = 1200;
const GX = 870, GY = 960, GR = 470, LYG = 50000 / GR;              // 50,000 light-years to the rim
const SOL = [GX, GY + 0.52 * GR];                                   // 26,000 ly out, on the Alpha / Beta line
const IDRAN = [626, 786], FOUNDERS = [560, 712], UNIMATRIX = [1124, 742];
const DOMB = [574, 728, 84, 70, 101], BORGB = [1112, 758, 112, 94, 131];
L.rect({ x: AX0, y: AY0, w: AW, h: AH, c: "#07061a", panel: true });
const gal = L.canvas({ x: AX0, y: AY0, w: AW, h: AH, panel: true });
const WORM = `M${SOL[0] - 26},${SOL[1] - 8} Q620,1120 ${IDRAN[0]},${IDRAN[1]}`;
{
  const r = rng(90210), dots = [];
  const ARM = ["#c7a0d8", "#e8dcff", "#9c84e0", "#8fd3ff", "#f2f2ff", "#b8a8e8"];
  const K = 0.34, R0 = 0.15 * GR, SMAX = Math.log(GR / R0) / K;
  [[-0.5, 3600], [Math.PI - 0.5, 3600], [Math.PI / 2 - 0.5, 1600], [1.5 * Math.PI - 0.5, 1600]].forEach(([th0, n]) => {
    for (let i = 0; i < n; i++) {
      const s = Math.pow(r(), 0.85) * SMAX * 1.04, rad = R0 * Math.exp(K * s), th = th0 - s;
      const sp = 0.012 * GR + 0.04 * rad;
      const x = GX + rad * Math.cos(th) + gauss(r) * sp * 0.6, y = GY + rad * Math.sin(th) + gauss(r) * sp * 0.6;
      const fall = 1 - 0.55 * (rad / GR);
      dots.push([x, y, 0.8 + r() ** 3 * 2.0, ARM[Math.floor(r() * ARM.length)], (0.18 + 0.6 * r()) * fall]);
      if (n > 2000 && r() < 0.03) dots.push([x, y, 2.2 + r() * 1.6, "#f4b6e6", 0.55 * fall]);   // star-forming knots
    }
  });
  for (let i = 0; i < 2400; i++) {                                    // the disc between the arms
    const rad = Math.min(GR * 1.02, -Math.log(1 - r() * 0.985) * 0.3 * GR), th = r() * 2 * Math.PI;
    dots.push([GX + rad * Math.cos(th), GY + rad * Math.sin(th), 0.7 + r() ** 4 * 1.6, ARM[Math.floor(r() * 3)], 0.06 + 0.22 * r()]);
  }
  for (let i = 0; i < 1100; i++) {                                    // the bar
    const u = gauss(r) * 0.11 * GR, v = gauss(r) * 0.035 * GR, a = -0.5;
    dots.push([GX + u * Math.cos(a) - v * Math.sin(a), GY + u * Math.sin(a) + v * Math.cos(a), 0.8 + r() ** 3 * 1.6, "#ffe6a8", 0.25 + 0.5 * r()]);
  }
  const bg = Array.from({ length: 700 }, () => [AX0 + r() * AW, AY0 + r() * AH, 0.7 + r() ** 4 * 1.4, ARM[Math.floor(r() * 3)], 0.15 + 0.3 * r()]);
  gal.onResize = () => {
    const g = gal.g;
    g.clearRect(0, 0, AW, AH);
    g.save(); g.translate(-AX0, -AY0);
    for (const [x, y, rr, c, a] of bg) { if (Math.hypot(x - GX, y - GY) < GR * 1.05) continue; g.globalAlpha = a; g.fillStyle = c; g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill(); }
    // a faint glow under the disc
    let n = g.createRadialGradient(GX, GY, 0, GX, GY, GR * 1.05);
    n.addColorStop(0, "rgba(156,111,180,.22)"); n.addColorStop(0.5, "rgba(107,86,216,.08)"); n.addColorStop(1, "rgba(107,86,216,0)");
    g.globalAlpha = 1; g.fillStyle = n; g.fillRect(GX - GR * 1.1, GY - GR * 1.1, GR * 2.2, GR * 2.2);
    for (const [x, y, rr, c, a] of dots) { g.globalAlpha = a; g.fillStyle = c; g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    n = g.createRadialGradient(GX, GY, 0, GX, GY, 0.34 * GR);           // the core
    n.addColorStop(0, "rgba(255,244,214,.95)"); n.addColorStop(0.1, "rgba(255,214,140,.7)"); n.addColorStop(0.35, "rgba(214,160,50,.2)"); n.addColorStop(1, "rgba(214,160,50,0)");
    g.fillStyle = n; g.beginPath(); g.arc(GX, GY, 0.34 * GR, 0, 7); g.fill();
    // the rim, ticked every 10 degrees, and the quadrant lines through the core
    g.strokeStyle = "rgba(199,160,216,.55)"; g.lineWidth = 2.5;
    g.beginPath(); g.arc(GX, GY, GR + 14, 0, 7); g.stroke();
    for (let d = 0; d < 360; d += 10) {
      const a = (d * Math.PI) / 180, l = d % 90 === 0 ? 0 : d % 30 === 0 ? 22 : 12;
      if (!l) continue;
      g.beginPath(); g.moveTo(GX + (GR + 14) * Math.cos(a), GY + (GR + 14) * Math.sin(a)); g.lineTo(GX + (GR + 14 + l) * Math.cos(a), GY + (GR + 14 + l) * Math.sin(a)); g.stroke();
    }
    g.strokeStyle = "rgba(255,204,102,.6)"; g.lineWidth = 3; g.setLineDash([18, 12]);
    g.beginPath(); g.moveTo(GX, AY0 + 40); g.lineTo(GX, AY0 + AH - 40); g.moveTo(AX0 + 40, GY); g.lineTo(AX0 + AW - 40, GY); g.stroke();
    g.setLineDash([]);
    // Dominion and Borg space
    for (const [b, c] of [[DOMB, "#b48cf0"], [BORGB, "#7fd0b8"]]) {
      const p = new Path2D(blob(...b));
      g.fillStyle = rgba(c, 0.16); g.fill(p);
      g.strokeStyle = rgba(c, 0.75); g.lineWidth = 4; g.lineCap = "round"; g.setLineDash([1, 10]); g.stroke(p); g.setLineDash([]);
    }
    // the Bajoran wormhole, Bajor to the Idran system
    g.strokeStyle = "rgba(255,204,102,.45)"; g.lineWidth = 3; g.setLineDash([10, 10]); g.stroke(new Path2D(WORM)); g.setLineDash([]);
    for (const [x, y] of [IDRAN]) { g.strokeStyle = "rgba(255,204,102,.85)"; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 9, 0, 7); g.stroke(); }
    for (const [x, y] of [FOUNDERS, UNIMATRIX]) { g.fillStyle = "#f2f2ff"; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill(); }
    // Sol, and the part of the galaxy the chart beside it shows
    g.strokeStyle = "rgba(255,204,102,.95)"; g.lineWidth = 3;
    g.strokeRect(SOL[0] - 26, SOL[1] - 26, 52, 52);
    g.fillStyle = "#ffcc66"; g.beginPath(); g.arc(SOL[0], SOL[1], 7, 0, 7); g.fill();
    g.restore();
  };
}
// the quadrants light as the powers in them are charted
const QUADS = { Gamma: [0, 0], Delta: [1, 0], Alpha: [0, 1], Beta: [1, 1] };
const quadTint = {};
for (const [q, [i, j]] of Object.entries(QUADS)) {
  const e = L.layer({ x: GX - GR + i * GR, y: GY - GR + j * GR, w: GR, h: GR });
  e.style.background = `radial-gradient(circle at ${i ? 0 : 100}% ${j ? 0 : 100}%, rgba(199,160,216,.05), rgba(199,160,216,.16) 98%, rgba(199,160,216,0) 100%)`;
  e.style.borderRadius = [!i && !j, i && !j, i && j, !i && j].map((b) => (b ? GR + "px" : "0")).join(" ");
  e.style.opacity = 0;
  quadTint[q] = { e, v: 0, goal: 0, shown: -1 };
}
// the galaxy turns: a slow sweep, clockwise, as the disc rotates seen from the north
const sweep = L.layer({ x: GX - GR, y: GY - GR, w: 2 * GR, h: 2 * GR, cls: "sweep" });
L.el("i", "", sweep, { left: GR - 1.5 + "px", top: "0px", height: GR + "px" });
// Dominion, Borg, the wormhole: brightened when theirs is the power being charted
const [domHi, domSvg] = svgLayer(DOMB[0] - DOMB[2] * 1.2, DOMB[1] - DOMB[3] * 1.2, DOMB[2] * 2.4, DOMB[3] * 2.4);
L.svg("path", { d: blob(...DOMB), fill: rgba("#b48cf0", 0.34), stroke: "#b48cf0", "stroke-width": 4 }, domSvg);
const [borgHi, borgSvg] = svgLayer(BORGB[0] - BORGB[2] * 1.2, BORGB[1] - BORGB[3] * 1.2, BORGB[2] * 2.4, BORGB[3] * 2.4);
L.svg("path", { d: blob(...BORGB), fill: rgba("#7fd0b8", 0.3), stroke: "#7fd0b8", "stroke-width": 4 }, borgSvg);
const [wormHi, wormSvg] = svgLayer(580, 780, SOL[0] - 570, SOL[1] - 770);
L.svg("path", { d: WORM, fill: "none", stroke: "#ffcc66", "stroke-width": 5, "stroke-linecap": "round" }, wormSvg);
const gRoute = L.layer({ x: 0, y: 0, w: 100, h: 4, cls: "route" }), gTip = L.layer({ x: 0, y: 0, w: 36, h: 36, cls: "tip" });
const gRipple = L.layer({ x: 0, y: 0, w: 100, h: 100, cls: "ripple" });
[gRoute, gTip, gRipple].forEach((e) => (e.style.opacity = 0));
// names
const quadLab = {
  Gamma: L.text({ x: AX0 + 40, base: AY0 + 72, s: 40, c: "lilac", txt: "Gamma Quadrant" }),
  Delta: L.text({ x: AX0 + AW - 40, base: AY0 + 72, s: 40, c: "lilac", txt: "Delta Quadrant", align: "r" }),
  Alpha: L.text({ x: AX0 + 40, base: AY0 + AH - 40, s: 40, c: "lilac", txt: "Alpha Quadrant" }),
  Beta: L.text({ x: AX0 + AW - 40, base: AY0 + AH - 40, s: 40, c: "lilac", txt: "Beta Quadrant", align: "r" }),
};
L.text({ x: GX + 30, base: GY - 26, s: 36, c: "butter", txt: "Galactic Core", cls: "nm" });
L.text({ x: SOL[0] + 44, base: SOL[1] + 13, s: 36, c: "butter", txt: "Sol  ·  Sector 001", cls: "nm" });
const domLab = L.text({ x: DOMB[0], base: DOMB[1] + DOMB[3] + 58, s: 36, c: "lilac", txt: "Dominion", align: "c", w: 300, cls: "nm" });
const borgLab = L.text({ x: BORGB[0], base: BORGB[1] - BORGB[3] - 26, s: 36, c: "lilac", txt: "Borg Collective", align: "c", w: 360, cls: "nm" });
L.text({ x: 640, base: 1092, s: 36, c: "butter", txt: "Bajoran Wormhole", align: "r", cls: "nm" });

// =============================================================================================
// ---------------- explored space: the Alpha / Beta border, Sol at the centre ----------------
// =============================================================================================
header(1470, 280, 1360, "Explored Space  ·  Alpha / Beta Border", "gold", "plum");
const BX0 = 1470, BY0 = 360, BW = 1360, BH = 1200;
const S = 1.32, SX = 2143, SY = 975;                                // px per light-year; Sol on the chart
const P = ([x, y]) => [SX + x * S, SY - y * S];
const lyTo = (a) => Math.hypot(a[0], a[1]);
L.rect({ x: BX0, y: BY0, w: BW, h: BH, c: "#07061a", panel: true });
const chart = L.canvas({ x: BX0, y: BY0, w: BW, h: BH, panel: true });
const NZ = [[100, -78], [132, 104]];                                // the Romulan Neutral Zone, a band of space
for (const p of POWERS) {
  if (!p.terr) continue;
  const [x, y, rx, ry, seed] = p.terr, [cx, cy] = P([x, y]);
  p.path = blob(cx, cy, rx * S, ry * S, seed);
  p.box = [cx - rx * S * 1.2, cy - ry * S * 1.2, rx * S * 2.4, ry * S * 2.4];
}
{
  const r = rng(31337);
  const DUST = ["#3a2c58", "#4a3a6e", "#5e4c86", "#8a7aaa", "#b8a8d8"];
  const dust = Array.from({ length: 1500 }, () => [BX0 + r() * BW, BY0 + r() * BH, r() ** 3 * 2.0 + 0.7, DUST[Math.floor(r() * DUST.length)]]);
  chart.onResize = () => {
    const g = chart.g;
    g.clearRect(0, 0, BW, BH);
    g.save(); g.translate(-BX0, -BY0);
    // the Orion Arm, a soft band across the chart
    for (const [x, y, rr, a] of [[1640, 1380, 520, 0.12], [2000, 1050, 560, 0.09], [2400, 720, 600, 0.11], [2760, 420, 420, 0.08]]) {
      const n = g.createRadialGradient(x, y, 0, x, y, rr);

  const p = act;
  put(stateSub, p.ly ? `${p.cap}  ·  ${p.quads[0]} Quadrant  ·  Plotting course  ·  ${distText(p, plotK)}` : `${p.cap}  ·  Sector 001  ·  Seat of the Federation Council`);
  if (swapAt < 0) put(plotVals[1], distText(p, p.ly ? plotK : 1));
  qRows.forEach((r, i) => {
    const s = i === 4 ? galaxy() : r.s;
    put(r.pct, s.pct.toFixed(2) + "%"); put(r.sys, fmt(s.sys)); put(r.sb, String(s.sb));
    css(r.name, "color", i === 4 ? "var(--gold)" : p.quads.includes(r.s.q) ? "var(--butter)" : "var(--white)");
  });
  TRAFFIC.forEach(([, f], i) => put(traffic[i].v, f()));
}, 0);
L.every(2500, () => {                                               // the survey goes on, slowly; traffic wanders
  ships = L.clamp(ships + L.irand(-5, 5), 2360, 2480);
  relay = L.clamp(relay + L.rand(-0.3, 0.3), 66, 76);
  if (Math.random() < 0.09) transits = Math.min(59, transits + 1);
  if (Math.random() < 0.2) { const s = L.pick(QSTAT); s.sys += 1; s.pct += 0.01 * (s.q === "Alpha" || s.q === "Beta" ? 1 : 0.2); }
}, 0.2);
});
