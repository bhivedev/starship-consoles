<!doctype html>
<html><head><meta charset="utf-8"><title>Standard Orbit</title>
<link rel="stylesheet" href="../lcars.css">
<style>
  /* swapped text dips and comes back; .boot (the start-up cascade) always wins */
  .sw { transition: opacity .45s ease; }
  .out:not(.boot) { opacity: .15; }
  .clip { position: absolute; overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; width: 100px; transform-origin: 0 0; will-change: transform; }
  .lab { position: absolute; left: 0; top: 0; line-height: 1; white-space: pre; will-change: transform; }
  .fade { position: absolute; pointer-events: none; }
</style></head>
<body><script src="../lcars.js"></script><script>
"use strict";
const L = LCARS;
L.ready(() => {

// ---------------- the frame: a bracket, title centred ----------------
L.frame({ type: "C", title: "Standard Orbit  •  Insertion", c: "olive", c2: "sky", accent: "sand", foot: "Helm",
  side: [[140, "sand", "Nav 07"], [70, "olive", "4535"], [420, "olive", "Insertion"], [70, "sky", "34"],
         [300, "sky", "Burns"], [70, "sand", "B1"], [216, "olive", "Helm"]],
  side2: [[140, "olive", "Plot 02"], [70, "sky", "1200"], [420, "sky", "Ground"], [70, "sand", "C3"],
          [300, "olive", "Survey"], [70, "sky", "07"], [216, "sand", "Log"]] });

const NS = "http://www.w3.org/2000/svg";
const TRACK = "#1f2410", DARK = "#0b0f1a";
const colr = (c) => (c.startsWith("#") ? c : `var(--${c})`);
const cls = (e, ...c) => (e.classList.add(...c), e);
const tf = (e, v) => { if (e._tf !== v) { e._tf = v; e.style.transform = v; } };
const op = (e, v) => { v = L.clamp(v).toFixed(2); if (e._op !== v) { e._op = v; e.style.opacity = v; } };
const bg = (e, c) => { if (e._bg !== c) { e._bg = c; e.style.background = colr(c); } };
const ink = (e, c) => { if (e._ink !== c) { e._ink = c; e.style.color = colr(c); } };
const swap = (els, f) => { els.forEach((e) => e.classList.add("out")); setTimeout(() => { f(); els.forEach((e) => e.classList.remove("out")); }, 460); };
const pad2 = (n) => String(n).padStart(2, "0");
const fmt = (n) => Math.round(n).toLocaleString("en");
const D = Math.PI / 180;

// ---------------- the grid ----------------
// Columns: parameters 220–1080, the plot 1140–2700, ground track 2760–3620. Rows on one 88 pitch:
// upper section baselines 408 + 88k, lower 1128 + 88k; bottom strip on 54.
const LX = 220, LR = 1080, MX = 1140, MR = 2700, RX = 2760, RR = 3620;
const U = (k) => 408 + 88 * k, LO = (k) => 1128 + 88 * k, STRIP = (i) => 1734 + i * 54;

// ---------------- the flight: one plan, everything is drawn from it ----------------
// Ship time runs sixty times fast: a ship minute every second. ts = ship seconds from 0540.
// Arrival on a hyperbola (periapsis 4,000 km); a retrograde insertion burn there captures the ship
// into a 1,200 × 4,000 km orbit; half an orbit later a second burn at periapsis circularizes it.
const GM = 295000, RP = 5840, ALT = 1200, RC = RP + ALT, RA = RP + 4000, VINF = 3.0, INC = 34;
const aH = -GM / VINF ** 2, eH = 1 + RA / -aH, nH = Math.sqrt(GM / (-aH) ** 3);
const aE = (RC + RA) / 2, eE = (RA - RC) / (RA + RC), nE = Math.sqrt(GM / aE ** 3), PE = (2 * Math.PI) / nE;
const nC = Math.sqrt(GM / RC ** 3), PC = (2 * Math.PI) / nC;
const T1 = 1500, T2 = T1 + PE / 2;                      // the two burns, at their middles
const B1 = [T1 - 180, T1 + 180], B2 = [T2 - 120, T2 + 120];
const PA = 120 * D;                                      // where the insertion burn happens, in the plot (0 = right, counter-clockwise)
const PHN = 200 * D;                                     // the ascending node, in the plot
const LAMN0 = 100, PROT = 26.3 * 3600, WP = 360 / PROT;  // node longitude at ts 0; the planet's day
const SITE = [-20, -100], SITE_R = 20;                   // the survey site, and the sensors' reach (degrees of arc)
const SHIP0 = 5 * 3600 + 40 * 60, SD0 = 45358.4, SD_PER_S = 1000 / (365.25 * 86400);
const TS = (t) => 60 * t;
const hhmm = (ts) => { const m = Math.floor((SHIP0 + ts) / 60); return pad2(Math.floor(m / 60) % 24) + pad2(((m % 60) + 60) % 60); };

const hyp = (ts) => {
  const M = nH * (ts - T1); let H = Math.asinh(M / eH);
  for (let i = 0; i < 40; i++) H -= (eH * Math.sinh(H) - H - M) / (eH * Math.cosh(H) - 1);
  return [-aH * (eH * Math.cosh(H) - 1), PA + 2 * Math.atan(Math.sqrt((eH + 1) / (eH - 1)) * Math.tanh(H / 2))];
};
const ell = (ts) => {
  const M = nE * (ts - T2); let E = M;
  for (let i = 0; i < 30; i++) E -= (E - eE * Math.sin(E) - M) / (1 - eE * Math.cos(E));
  return [aE * (1 - eE * Math.cos(E)), PA + Math.PI + 2 * Math.atan2(Math.sqrt(1 + eE) * Math.sin(E / 2), Math.sqrt(1 - eE) * Math.cos(E / 2))];
};
const circ = (ts) => [RC, PA + Math.PI + nC * (ts - T2)];
const xy = ([r, p]) => [r * Math.cos(p), r * Math.sin(p)];
const mixP = (a, b, w) => [L.mix(a[0], b[0], w), L.mix(a[1], b[1], w)];
// position in the orbital plane, km (y up)
const pos = (ts) => {
  if (ts < B1[0]) return xy(hyp(ts));
  if (ts < B1[1]) return mixP(xy(hyp(ts)), xy(ell(ts)), L.ease((ts - B1[0]) / (B1[1] - B1[0])));
  if (ts < B2[0]) return xy(ell(ts));
  if (ts < B2[1]) return mixP(xy(ell(ts)), xy(circ(ts)), L.ease((ts - B2[0]) / (B2[1] - B2[0])));
  return xy(circ(ts));
};
const vel = (ts) => { const a = pos(ts - 1), b = pos(ts + 1); return [(b[0] - a[0]) / 2, (b[1] - a[1]) / 2]; };
// the osculating orbit
const elements = (ts) => {
  const r = pos(ts), v = vel(ts), rr = Math.hypot(...r), vv = Math.hypot(...v);
  const en = (vv * vv) / 2 - GM / rr, a = -GM / (2 * en), h = Math.abs(r[0] * v[1] - r[1] * v[0]);
  const e = Math.sqrt(Math.max(0, 1 + (2 * en * h * h) / (GM * GM)));
  return { r: rr, v: vv, a, e, peri: a * (1 - e) - RP, apo: e < 1 ? a * (1 + e) - RP : null, per: e < 1 ? (2 * Math.PI * Math.sqrt(a ** 3 / GM)) / 60 : null };
};
// where on the planet the ship is overhead
const subPoint = (ts) => {
  const [x, y] = pos(ts), u = Math.atan2(y, x) - PHN, i = INC * D;
  const lat = Math.asin(Math.sin(i) * Math.sin(u)) / D;
  const lon = LAMN0 - WP * ts + Math.atan2(Math.cos(i) * Math.sin(u), Math.cos(u)) / D;
  return [lat, ((lon % 360) + 540) % 360 - 180];
};
// the primary is to the left of the plot, in the orbital plane
const USUN = Math.PI - PHN, DEC = Math.asin(Math.sin(INC * D) * Math.sin(USUN)) / D;
const LSUN0 = Math.atan2(Math.cos(INC * D) * Math.sin(USUN), Math.cos(USUN)) / D;
const sunLon = (ts) => LAMN0 - WP * ts + LSUN0;
const arc = (a, b) => Math.acos(L.clamp(Math.sin(a[0] * D) * Math.sin(b[0] * D) + Math.cos(a[0] * D) * Math.cos(b[0] * D) * Math.cos((a[1] - b[1]) * D), -1, 1)) / D;
const inShadow = (ts) => { const [x, y] = pos(ts); return x > 0 && Math.abs(y) < RP; };
const inRange = (ts) => arc(subPoint(ts), SITE) < SITE_R;

// burns: the two impulse burns, then a thruster trim at every ascending node
const trimAt = (k) => T2 + (((PHN - (PA + Math.PI)) / D + 360 * 4) % 360) / 360 * PC + (k - 1) * PC;
const TRIM_DV = [0.4, 0.3, 0.5, 0.2, 0.4, 0.6, 0.3];
const BURNS = [
  { name: "Insertion Burn", short: "Insertion", t0: B1[0], t1: B1[1], dv: 0, how: "Retrograde at 4,000 km", impulse: true },
  { name: "Circularization Burn", short: "Circularization", t0: B2[0], t1: B2[1], dv: 0, how: "Retrograde at Periapsis", impulse: true },
];
// the planned delta-v: the speed on arrival less the speed wanted, at each burn point
BURNS[0].dv = (Math.sqrt(VINF ** 2 + (2 * GM) / RA) - Math.sqrt(GM * (2 / RA - 1 / aE))) * 1000;
BURNS[1].dv = (Math.sqrt(GM * (2 / RC - 1 / aE)) - Math.sqrt(GM / RC)) * 1000;
const burnN = (k) => (k < 2 ? BURNS[k] : { name: "Station-Keeping Trim", short: "Trim", t0: trimAt(k - 1) - 120, t1: trimAt(k - 1) + 120,
  dv: TRIM_DV[(k - 2) % TRIM_DV.length], how: "Thrusters  ·  Ascending Node", impulse: false, rev: k - 1 });
const burnIndexAt = (ts) => { // the burn running now or next
  if (ts < B1[1]) return 0; if (ts < B2[1]) return 1;
  let k = 2; while (burnN(k).t1 <= ts) k++; return k;
};
const revAt = (ts) => (ts < T2 ? 0 : Math.floor((ts - T2) / PC) + 1);

// shadow and site passes, sampled ahead as they are needed
const STEP = 30, samp = { ts: -6000, sh: inShadow(-6000), rg: inRange(-6000), shadow: [], sunlit: [], passes: [], s0: -1e9, r0: 0 };
samp.s0 = -1e9; samp.r0 = samp.rg ? -1e9 : 0;
const sampleTo = (until) => {
  while (samp.ts < until) {
    const t = samp.ts + STEP, sh = inShadow(t), rg = inRange(t);
    if (sh !== samp.sh) { (samp.sh ? samp.shadow : samp.sunlit).push([samp.s0, t]); samp.s0 = t; samp.sh = sh; }
    if (rg !== samp.rg) { if (rg) samp.r0 = t; else samp.passes.push([samp.r0, t]); samp.rg = rg; }
    samp.ts = t;
  }
};
sampleTo(TS(60));

// ---------------- status line ----------------
const WORDS = ["Approach", "Insertion Burn", "Transfer Coast", "Circularization", "Standard Orbit"];
const SUBX = LX + Math.max(...WORDS.map((w) => L.textWidth(w, 100))) + 56;
const state = cls(L.text({ x: LX, cap: 150, s: 100, c: "olive", txt: "" }), "sw");
const stateSub = cls(L.text({ x: SUBX, base: 222, s: 38, c: "sand", txt: "" }), "sw");
L.box({ x: RX, y: 158, w: 400, h: 64, c: "olive", label: "Tavela System  ·  Survey", fs: 32, r: "l" });
const clockBox = L.box({ x: RX + 400 + L.GAP, y: 158, w: RR - (RX + 400 + L.GAP), h: 64, c: "sand", label: "", fs: 32, r: "r" });

// ---------------- insertion parameters ----------------
L.header({ x: LX, y: 280, w: LR - LX, label: "Insertion Parameters", c1: "olive", c2: "sky" });
const CUR = 820;
L.text({ x: LX, base: U(0), s: 36, c: "sky", txt: "Parameter" });
L.text({ x: CUR, base: U(0), s: 36, c: "sky", txt: "Current", align: "r" });
L.text({ x: LR, base: U(0), s: 36, c: "sky", txt: "Target", align: "r" });
const PARAMS = [["Periapsis", `${fmt(ALT)} km`], ["Apoapsis", `${fmt(ALT)} km`], ["Eccentricity", "0.000"],
  ["Inclination", `${INC.toFixed(1)}°`], ["Velocity", `${Math.sqrt(GM / RC).toFixed(2)} km/s`], ["Period", `${(PC / 60).toFixed(1)} min`]];
const par = PARAMS.map(([n, tg], k) => {
  L.text({ x: LX, base: U(1 + k), s: 40, c: "sand", txt: n });
  L.text({ x: LR, base: U(1 + k), s: 40, c: "sand", txt: tg, align: "r" });
  return L.text({ x: CUR, base: U(1 + k), s: 52, c: "white", txt: "", align: "r" });
});

// ---------------- burn control ----------------
L.header({ x: LX, y: 1000, w: LR - LX, label: "Burn Control", c1: "sky", c2: "olive" });
const burnCap = cls(L.text({ x: LX, base: LO(0), s: 36, c: "butter", txt: "" }), "sw");
const GBX = LX + 300, GBR = 820;
const fill = (x, y, w, h, c) => { const f = L.layer({ x, y, w, h }); f.style.background = colr(c); f.style.transformOrigin = "0 0"; return f; };
const gauge = (k, name, c) => {
  L.text({ x: LX, base: LO(k), s: 40, c: "sand", txt: name });
  L.rect({ x: GBX, y: LO(k) - 26, w: GBR - GBX, h: 26, c: TRACK });
  return { bar: fill(GBX, LO(k) - 26, GBR - GBX, 26, c), v: L.text({ x: LR, base: LO(k), s: 44, c: "white", txt: "", align: "r" }), u: -1 };
};
const showBar = (g, k) => { k = L.clamp(k); if (Math.abs(k - g.u) > 0.0004) { g.u = k; tf(g.bar, `scaleX(${k.toFixed(4)})`); } };
const G = { out: gauge(1, "Impulse Output", "butter"), dv: gauge(2, "Delta-V  m/s", "olive"), time: gauge(3, "Burn Time", "sky"),
  next: gauge(4, "Next Burn", "sand"), deut: gauge(5, "Deuterium", "olive") };

// ---------------- the plot ----------------
L.header({ x: MX, y: 280, w: MR - MX, label: "Orbital Plot  ·  Tavela IV", c1: "olive", c2: "sand" });
const CX = 1920, CY = 960, R6 = 560, SC = R6 / (RP + 6000);   // the outer ring is 6,000 km up
const sx = (x) => CX + SC * x, sy = (y) => CY - SC * y;
const PW = 1560, PH = 1220, PX0 = CX - PW / 2, PY0 = CY - PH / 2;   // the plot's own box (a picture: not audited)
const svgLayer = (inner, c = "boot") => {
  const l = cls(L.layer({ x: PX0, y: PY0, w: PW, h: PH }), c);
  l.innerHTML = `<svg width="${PW}" height="${PH}" viewBox="${PX0} ${PY0} ${PW} ${PH}" style="position:absolute;left:0;top:0;overflow:visible">${inner}</svg>`;
  return l;
};
const circle = (r, a) => `<circle cx="${CX}" cy="${CY}" r="${r}" ${a}/>`;
{
  let s = "";
  // the planet's shadow, out to the plot's edge
  s += `<defs><linearGradient id="shd" x1="0" x2="1"><stop offset="0" stop-color="#1a2233" stop-opacity=".9"/><stop offset="1" stop-color="#1a2233" stop-opacity="0"/></linearGradient>
        <radialGradient id="edge" cx="${CX}" cy="${CY}" r="${R6 + 70}" gradientUnits="userSpaceOnUse">
          <stop offset="${(R6 - 10) / (R6 + 70)}" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
        <mask id="fadeM" maskUnits="userSpaceOnUse" x="${PX0}" y="${PY0}" width="${PW}" height="${PH}"><rect x="${PX0}" y="${PY0}" width="${PW}" height="${PH}" fill="url(#edge)"/></mask></defs>`;
  s += `<rect x="${CX}" y="${CY - RP * SC}" width="${R6 - 30}" height="${2 * RP * SC}" fill="url(#shd)"/>`;
  // altitude rings at 2,000, 4,000 and 6,000 km, their figures below each
  [2000, 4000, 6000].forEach((a, k) => {
    const r = (RP + a) * SC;
    s += circle(r, `fill="none" stroke="var(--${k === 2 ? "sky" : "slate"})" stroke-width="${k === 2 ? 4 : 3}"`);
    s += `<text x="${CX}" y="${(CY + r + 34).toFixed(1)}" text-anchor="middle" font-size="30" style="fill:var(--sky)">${fmt(a)} KM</text>`;
  });
  // ticks round the outer ring, every ten degrees
  let tk = "";
  for (let a = 0; a < 360; a += 10) {
    const l = a % 30 === 0 ? 26 : 14, c = Math.cos(a * D), n = Math.sin(a * D);
    tk += `M${(CX + R6 * c).toFixed(1)},${(CY - R6 * n).toFixed(1)} L${(CX + (R6 - l) * c).toFixed(1)},${(CY - (R6 - l) * n).toFixed(1)} `;
  }
  s += `<path d="${tk}" stroke="var(--sky)" stroke-width="4"/>`;
  // the planet: a sunlit half toward the primary, its night half, a thin atmosphere
  const pr = RP * SC;
  s += circle(pr + 12, `fill="none" stroke="var(--ice)" stroke-opacity=".45" stroke-width="6"`);
  s += circle(pr, `fill="#4a4520"`);
  s += `<path d="M${CX},${CY - pr} A${pr},${pr} 0 0 0 ${CX},${CY + pr} Z" fill="var(--olive)"/>`;
  for (const f of [0.35, 0.68]) s += `<ellipse cx="${CX}" cy="${CY}" rx="${pr}" ry="${(pr * f).toFixed(1)}" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="3"/>`;
  s += `<line x1="${CX - pr}" y1="${CY}" x2="${CX + pr}" y2="${CY}" stroke="#000" stroke-opacity=".28" stroke-width="3"/>`;
  svgLayer(s);
}
// the three paths: the approach, the transfer half-orbit, the standard orbit
const pathD = (f, a, b, n = 160) => {
  let d = "";
  for (let i = 0; i <= n; i++) { const [x, y] = xy(f(L.mix(a, b, i / n))); d += (i ? "L" : "M") + sx(x).toFixed(1) + "," + sy(y).toFixed(1); }
  return d;
};
const approach = svgLayer(`<path d="${pathD(hyp, T1 - 3400, T1)}" fill="none" stroke="var(--sky)" stroke-width="5" mask="url(#fadeM)"/>`);
const transfer = svgLayer(`<path d="${pathD(ell, T1, T2)}" fill="none" stroke="var(--ice)" stroke-width="5"/>`);
const orbit = svgLayer(circle(RC * SC, `fill="none" stroke="var(--butter)" stroke-width="6"`));
const orbitPlan = svgLayer(circle(RC * SC, `fill="none" stroke="var(--butter)" stroke-width="4" stroke-dasharray="14 16"`));
// burn points and the ascending node, marked
{
  const mk = (ts, label, dx, dy, anchor) => {
    const [x, y] = pos(ts), X = sx(x), Y = sy(y);
    return `<path d="M${X},${Y - 16} L${X + 16},${Y} L${X},${Y + 16} L${X - 16},${Y} Z" fill="var(--butter)" stroke="#000" stroke-width="4"/>
      <text x="${X + dx}" y="${Y + dy}" text-anchor="${anchor}" font-size="36" style="fill:var(--butter)">${label}</text>`;
  };
  svgLayer(mk(T1, "BURN 1", -30, -22, "end") + mk(T2, "BURN 2", 30, 46, "start"));
}
// the ship: a chevron pointing where it is going
const ship = L.layer({ x: 0, y: 0, w: 56, h: 56 });
ship.innerHTML = `<svg width="56" height="56" style="position:absolute;left:0;top:0">
  <circle cx="28" cy="28" r="26" fill="none" stroke="var(--butter)" stroke-opacity=".35" stroke-width="3"/>
  <path d="M46,28 L16,12 L23,28 L16,44 Z" fill="var(--white)" stroke="#000" stroke-width="3"/></svg>`;
// the primary's direction
L.text({ x: MX, base: CY + 13, s: 36, c: "butter", txt: "Primary" });
L.svg("path", { d: `M${MX + 136},${CY} l18,-12 v24 Z`, fill: "var(--butter)", class: "boot" });
L.rect({ x: MX + 154, y: CY - 3, w: 60, h: 6, c: "butter", free: true });

// readings in the plot's four corners
const corner = (x, align, lb, label, vb, cb) => ({
  l: L.text({ x, base: lb, s: 36, c: "sky", txt: label, align }),
  v: L.text({ x, base: vb, s: 100, c: "white", txt: "", align }),
  c: cls(L.text({ x, base: cb, s: 36, c: "sand", txt: "", align }), "sw"),
});
const cAlt = corner(MX, "l", U(0), "Altitude  ·  Kilometers", U(2), U(3));
const cVel = corner(MR, "r", U(0), "Velocity  ·  Kilometers per Second", U(2), U(3));
const cRev = corner(MX, "l", LO(2), "Revolution", LO(4), LO(5));
const cNext = corner(MR, "r", LO(2), "Next Event  ·  Ship Minutes", LO(4), LO(5));

// ---------------- ground track ----------------
L.header({ x: RX, y: 280, w: RR - RX, label: "Ground Track", c1: "sky", c2: "olive" });
const MW = RR - RX, MH = MW / 2, MY = 360;
const mx = (lon) => ((lon + 180) / 360) * MW, my = (lat) => ((90 - lat) / 180) * MH;
// the surface: flat 5° cells of land and sea, from a few smooth waves (periodic round the planet)
const elev = (lon, lat) => {
  const a = lon * D, b = lat * D;
  return 0.55 * Math.sin(a + 0.6) * Math.cos(b * 1.3 - 0.4) + 0.35 * Math.sin(2 * a + 2.1 + b * 1.4) + 0.28 * Math.cos(3 * a - 1.2 - b * 2.2)
    + 0.18 * Math.sin(5 * a + 0.4 + b * 3.1) + 0.12 * Math.cos(7 * a + 2.5 - b * 4.4) + 0.25 * Math.sin(b * 2.5 + 0.8);
};
const base = L.canvas({ x: RX, y: MY, w: MW, h: MH });
base.onResize = () => {
  const g = base.g; g.fillStyle = "#08101e"; g.fillRect(0, 0, MW, MH);
  const cw = MW / 72, ch = MH / 36;
  for (let i = 0; i < 72; i++) for (let j = 0; j < 36; j++) {
    const lon = -177.5 + i * 5, lat = 87.5 - j * 5, e = elev(lon, lat);
    let c = null;
    if (Math.abs(lat) > 72) c = e > -0.2 ? "#7d8a94" : "#3c4750";
    else if (e > 0.62) c = "#9c9466"; else if (e > 0.38) c = "#857a2e"; else if (e > 0.18) c = "#5a521f";
    else if (e > 0.08) c = "#122440";
    if (c) { g.fillStyle = c; g.fillRect(i * cw + 1, j * ch + 1, cw - 2, ch - 2); }
  }
  g.strokeStyle = "rgba(92,157,255,.35)"; g.lineWidth = 1.5;
  for (let lon = -150; lon < 180; lon += 30) { g.beginPath(); g.moveTo(mx(lon), 0); g.lineTo(mx(lon), MH); g.stroke(); }
  for (let lat = -60; lat <= 60; lat += 30) { g.beginPath(); g.moveTo(0, my(lat)); g.lineTo(MW, my(lat)); g.stroke(); }
  g.strokeStyle = "rgba(92,157,255,.7)"; g.lineWidth = 2.5; g.beginPath(); g.moveTo(0, my(0)); g.lineTo(MW, my(0)); g.stroke();
};
// night: drawn once for the sun at longitude 0, two copies wide, slid west as the planet turns
const nightClip = L.el("div", "clip", L.stage, { left: RX + "px", top: MY + "px", width: MW + "px", height: MH + "px" });
const nightL = cls(L.layer({ x: 0, y: 0, w: 2 * MW, h: MH }, nightClip), "boot");
const night = L.canvas({ x: 0, y: 0, w: 2 * MW, h: MH }, nightL);
night.onResize = () => {
  const cv = night.cv, W = cv.width, H = cv.height, img = night.g.createImageData(W, H), d = img.data;
  const sd = Math.sin(DEC * D), cd = Math.cos(DEC * D);
  for (let py = 0; py < H; py++) {

  const cz = Math.sin(SITE[0] * D) * Math.sin(DEC * D) + Math.cos(SITE[0] * D) * Math.cos(DEC * D) * Math.cos((SITE[1] - sunLon(ts)) * D);
  const elv = Math.asin(L.clamp(cz, -1, 1)) / D;
  L.set(sunV, elv > 0 ? `Day  ·  ${elv.toFixed(1)}° above Horizon` : `Night  ·  ${(-elv).toFixed(1)}° below Horizon`);
  if (ts - trackAt > 20) { trackAt = ts; drawTrack(ts); }
}, 0);
});
</script></body></html>
