<!doctype html>
<html><head><meta charset="utf-8"><title>Fleet Deployment</title>
<link rel="stylesheet" href="../lcars.css">
<style>
  .sw { transition: background-color .8s ease, color .8s ease; }
  .ml { text-shadow: 0 0 6px #000, 0 0 3px #000, 0 0 2px #000; }
  .clip { position: absolute; overflow: hidden; }
  .ring { border-radius: 50%; border: 4px solid var(--butter); }
  .band { background: #0d1a30; }
</style></head>
<body><script src="../lcars.js"></script><script>
"use strict";
const L = LCARS;
L.ready(() => {

// ---------------- the frame: sidebar left, title top right ----------------
L.frame({ type: "A", title: "Starfleet Command  •  Fleet Deployment", c: "sky", c2: "gold", accent: "ice", foot: "Starfleet",
  side: [[140, "gold", "Fleet Ops"], [70, "ice", "SFC"], [420, "sky", "Deployment"], [70, "gold", "Orders"],
         [300, "ice", "Sector 001"], [70, "sky", "Registry"], [216, "gold", "Wolf 359"]] });

const PANEL = "#020814", TRACK = "#14223a", DIM = "#4e5d6c";
const col = (c) => (c.startsWith("#") ? c : `var(--${c})`);
const pad2 = (n) => String(n).padStart(2, "0");
const widest = (items, s) => Math.ceil(Math.max(...items.map((t) => L.textWidth(t, s))));
const bad = [];
const fits = (txt, s, w, where) => { if (L.textWidth(txt, s) > w) bad.push(`${where}: "${txt}"`); };
const rng = (seed) => () => {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const tf = (e, v) => { if (e._tf !== v) { e._tf = v; e.style.transform = v; } };
const op = (e, v) => { v = v.toFixed(3); if (e._op !== v) { e._op = v; e.style.opacity = v; } };
const bg = (e, c) => { if (e._bg !== c) { e._bg = c; e.style.background = col(c); } };
const fg = (e, c) => { if (e._fg !== c) { e._fg = c; e.style.color = col(c); } };
const columns = (x0, x1, widths) => {                        // a table's columns spread evenly: [left, right] of each
  const total = widths.reduce((a, b) => a + b, 0), gap = (x1 - x0 - total) / (widths.length - 1);
  let x = x0;
  return widths.map((w) => { const c = [Math.round(x), Math.round(x + w)]; x += w + gap; return c; });
};
const easeIn = (u, a, d) => L.ease(L.clamp((u - a) / d));

// ---------------- the stardate: the Mac's clock, continuous across midnight ----------------
// Stardate 44391 is the day after Data's Day (44390.1): the Enterprise is taking Ambassador T'Pel to the
// Neutral Zone, Captain Maxwell's Phoenix is on the Cardassian border, and Wolf 359 is a few months past.
const MID = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); })();
const stardate = (ms = Date.now()) => 44391 + ((ms - MID) / 86400000) * 2.74;

// ---------------- the grid ----------------
// The map 330–2140; the right-hand column 2200–3816. Bottom strip: log 330–1220 | orders 1280–2140 | memorial 2200–3816.
const MX0 = 330, MX1 = 2140, MY0 = 360, MY1 = 1580;
const RX0 = 2200, RX1 = 3816;
const LX1 = 1220, OX0 = 1280;

// ---------------- the fleet ----------------
// stations: x, y on the map, region, assignment
const STN = {
  ent:   { x: 760,  y: 655,  reg: "nz",   job: "Ambassador Transport" },
  pot:   { x: 470,  y: 712,  reg: "nz",   job: "Neutral Zone Patrol" },
  nzE:   { x: 1150, y: 560,  reg: "nz",   job: "Neutral Zone Patrol" },
  sb74:  { x: 590,  y: 905,  reg: "sb",   job: "Refit  ·  Starbase 74" },
  kb:    { x: 1530, y: 700,  reg: "kb",   job: "Klingon Border Patrol" },
  nar:   { x: 1800, y: 790,  reg: "kb",   job: "Narendra Sector Patrol" },
  sb133: { x: 1300, y: 1150, reg: "sb",   job: "Escort  ·  Starbase 133" },
  wolf:  { x: 1150, y: 835,  reg: "core", job: "Memorial Survey" },
  sut:   { x: 860,  y: 1005, reg: "core", job: "Sector 001 Defense" },
  aka:   { x: 1040, y: 1030, reg: "core", job: "Escort  ·  Utopia Planitia" },
  vul:   { x: 780,  y: 1170, reg: "core", job: "Diplomatic Escort" },
  typ:   { x: 520,  y: 1420, reg: "sv",   job: "Survey  ·  Typhon Expanse" },
  bren:  { x: 1010, y: 1430, reg: "sv",   job: "Cartographic Survey" },
  pho:   { x: 1650, y: 1170, reg: "cb",   job: "Cardassian Border Patrol" },
  sb211: { x: 1450, y: 1330, reg: "sb",   job: "Medical Transport" },
  cb2:   { x: 1570, y: 1470, reg: "cb",   job: "Cardassian Border Patrol" },
};
// vessel, registry, class, stations (two for the ships that are moved), heading on station (deg, 0 = east)
const FLEET = [
  ["U.S.S. Enterprise", "NCC-1701-D", "Galaxy",        ["ent"],            -40],
  ["U.S.S. Potemkin",   "NCC-18253",  "Excelsior",     ["pot"],            -20],
  ["U.S.S. Hood",       "NCC-42296",  "Excelsior",     ["sb74", "nzE"],    0],
  ["U.S.S. Excalibur",  "NCC-26517",  "Ambassador",    ["kb", "sb133"],    0],
  ["U.S.S. Endeavour",  "NCC-71805",  "Nebula",        ["nar"],            -60],
  ["U.S.S. Zhukov",     "NCC-26136",  "Ambassador",    ["wolf"],           30],
  ["U.S.S. Sutherland", "NCC-72015",  "Nebula",        ["sut"],            180],
  ["U.S.S. Akagi",      "NCC-62158",  "Rigel",         ["aka"],            0],
  ["U.S.S. Merrimac",   "NCC-61827",  "Nebula",        ["vul"],            200],
  ["U.S.S. Victory",    "NCC-9754",   "Constellation", ["typ", "bren"],    0],
  ["U.S.S. Phoenix",    "NCC-65420",  "Nebula",        ["pho"],            30],
  ["U.S.S. Repulse",    "NCC-2544",   "Excelsior",     ["sb211", "cb2"],   0],
].map(([name, reg, cls, st, hd], i) => ({ i, name, short: name.slice(7), reg, cls, st, hd }));
const MOVERS = FLEET.filter((f) => f.st.length === 2);       // Hood, Excalibur, Victory, Repulse: one moves each cycle
const REGIONS = [["nz", "Romulan Neutral Zone"], ["kb", "Klingon Border"], ["cb", "Cardassian Border"],
                 ["core", "Sector 001  ·  Core Worlds"], ["sb", "Starbase Support"], ["sv", "Deep Space Survey"]];
// a sector number from the map grid (200 px squares); Sector 001 is Earth's
const EARTH = [950, 960];
const sectorOf = (s) => Math.hypot(s.x - EARTH[0], s.y - EARTH[1]) < 100 ? "001"
  : `2${Math.floor((s.y - MY0) / 200) + 1}${pad2(Math.floor((s.x - MX0) / 200) + 4)}${(Math.floor(s.x / 70) + Math.floor(s.y / 90)) % 10}`;
for (const k in STN) STN[k].sec = sectorOf(STN[k]);

// ---------------- the redeployment cycle: one every 75 s ----------------
// 0–6 s new orders (the course is laid in, the ship turns), 6–46 s under way, then on station; at 60 s a routine report.
const CYCLE = 75, T_GO = 6, T_ARR = 46, T_REP = 60;
const E0 = (() => {                                          // (dev: #u=40 starts the screen 40 s into a cycle)
  const now = Date.now() / 1000, m = /u=(\d+)/.exec(location.hash);
  return m ? now - (now % CYCLE) + +m[1] : now;
})();
const mover = (k) => MOVERS[((k % 4) + 4) % 4];
const movesBefore = (f, k) => { const j = MOVERS.indexOf(f); return Math.floor((k - j + 3) / 4); };   // moves of f in cycles < k
const stationAt = (f, k) => f.st.length === 1 ? f.st[0] : f.st[movesBefore(f, k) % 2];               // where f is as cycle k begins
const orderNo = (k) => `44-${String(((k % 9000) + 9000) % 9000 + 1000)}`;
const REPORTS = [   // the routine report at 60 s, from a ship holding station
  [10, "Capt. Maxwell  ·  Border Quiet"], [0, "Ambassador T'Pel Aboard"], [5, "Memorial Survey  ·  Wolf 359"],
  [4, "Klingon Border  ·  No Contacts"], [1, "Neutral Zone  ·  No Contacts"], [8, "Vulcan  ·  Escort Complete"],
  [6, "Sector 001  ·  Fleet Exercise"], [7, "Utopia Planitia  ·  Escort Complete"],
];
const report = (k) => REPORTS[((k % REPORTS.length) + REPORTS.length) % REPORTS.length];

// ================= status line =================
const STATES = [["Fleet Deployed", "sky"], ["Fleet Redeploying", "butter"]];
const stateTxt = L.text({ x: MX0, cap: 150, s: 100, c: "sky", txt: STATES[0][0] });
const subX = MX0 + widest(STATES.map((s) => s[0]), 100) + 48;
const subTxt = L.text({ x: subX, base: 222, s: 38, c: "ice", txt: "" });
const subFor = (n, sd) => `Starfleet Command  ·  Federation Space  ·  12 Starships Assigned  ·  ${n}  ·  Stardate ${sd}`;
const PILLW = 480;
L.box({ x: RX1 - PILLW, y: 150, w: PILLW, h: 72, c: "sky", label: "Condition Green", r: "lr", fs: 36 });

// ================= the deployment map =================
L.header({ x: MX0, y: 280, w: MX1 - MX0, label: "Federation Space  ·  Deployment Display", c1: "sky", c2: "gold" });
L.rect({ x: MX0, y: MY0, w: MX1 - MX0, h: MY1 - MY0, c: PANEL, panel: true });
const map = L.svg("g", { class: "boot" });
const defs = L.svg("defs", {}, map);
L.svg("rect", { x: MX0, y: MY0, width: MX1 - MX0, height: MY1 - MY0 }, L.svg("clipPath", { id: "fdClip" }, defs));
const g = L.svg("g", { "clip-path": "url(#fdClip)" }, map);
const poly = (pts) => pts.map((p) => p.join(",")).join(" ");
// stars, faint
{
  const r = rng(4439), cs = ["#5c7dff", "#8fd3ff", "#c9d6ff", "#ffffff"];
  for (let k = 0; k < 300; k++) L.svg("circle", { cx: (MX0 + r() * (MX1 - MX0)).toFixed(1), cy: (MY0 + r() * (MY1 - MY0)).toFixed(1),
    r: (0.8 + r() ** 3 * 1.8).toFixed(2), fill: cs[Math.floor(r() * 4)], opacity: (0.2 + r() * 0.35).toFixed(2) }, g);
}
// the sector grid, 200 px squares
for (let x = MX0 + 200; x < MX1; x += 200) L.svg("line", { x1: x, y1: MY0, x2: x, y2: MY1, stroke: "#1d3cc4", "stroke-width": 2, "stroke-dasharray": "3 9", opacity: 0.55 }, g);
for (let y = MY0 + 200; y < MY1; y += 200) L.svg("line", { x1: MX0, y1: y, x2: MX1, y2: y, stroke: "#1d3cc4", "stroke-width": 2, "stroke-dasharray": "3 9", opacity: 0.55 }, g);
// the neighbours: the Romulan Star Empire beyond the Neutral Zone, the Klingon Empire, the Cardassian Union
const NZO = [[MX0, 560], [560, 530], [800, 478], [1000, 420], [1110, MY0]];          // the zone's Romulan edge
const NZI = [[MX0, 640], [570, 612], [820, 560], [1040, 492], [1200, MY0]];          // its Federation edge
const KB = [[1520, MY0], [1580, 500], [1720, 600], [1920, 652], [MX1, 672]];
const CB = [[1620, MY1], [1690, 1400], [1810, 1272], [1980, 1205], [MX1, 1185]];
L.svg("polygon", { points: poly([[MX0, MY0], ...NZO]), fill: "var(--olive)", opacity: 0.08 }, g);
L.svg("polygon", { points: poly([...NZO, ...NZI.slice().reverse()]), fill: "var(--olive)", opacity: 0.16 }, g);
L.svg("polygon", { points: poly([...KB, [MX1, MY0]]), fill: "var(--mars)", opacity: 0.07 }, g);
L.svg("polygon", { points: poly([...CB, [MX1, MY1]]), fill: "var(--tan)", opacity: 0.08 }, g);
[[NZO, "olive"], [NZI, "olive"], [KB, "mars"], [CB, "tan"]].forEach(([pts, c]) =>
  L.svg("polyline", { points: poly(pts), fill: "none", stroke: `var(--${c})`, "stroke-width": 3, "stroke-dasharray": "12 8", opacity: 0.75 }, g));
// the Typhon Expanse: uncharted
L.svg("ellipse", { cx: 560, cy: 1400, rx: 190, ry: 92, fill: "var(--lilac)", "fill-opacity": 0.05, stroke: "var(--lilac)", "stroke-width": 2, "stroke-dasharray": "4 8", opacity: 0.8 }, g);
// places
const PLACES = [
  // name, x, y, kind, colour, label dx, label base dy, align
  ["Sector 001", EARTH[0], EARTH[1], "earth", "sky", 0, -44, "c"],
  ["Wolf 359", 1085, 900, "memorial", "mars", 24, 13, "l"],
  ["Vulcan", 700, 1100, "planet", "ice", 0, -24, "c"],
  ["Starbase 74", 520, 860, "base", "ice", 0, -26, "c"],
  ["Starbase 133", 1240, 1095, "base", "ice", 0, -26, "c"],
  ["Starbase 211", 1380, 1290, "base", "ice", -26, 13, "r"],
  ["Minos Korva", 1720, 1100, "planet", "white", 0, -24, "c"],
  ["Narendra III", 1850, 560, "planet", "mars", 0, -24, "c"],
];
PLACES.forEach(([, x, y, kind, c]) => {
  if (kind === "earth") { L.svg("circle", { cx: x, cy: y, r: 30, fill: "none", stroke: "var(--sky)", "stroke-width": 3, opacity: 0.6 }, g);
                          L.svg("circle", { cx: x, cy: y, r: 12, fill: "var(--sky)" }, g); }
  if (kind === "planet") L.svg("circle", { cx: x, cy: y, r: 10, fill: `var(--${c})` }, g);
  if (kind === "base") L.svg("rect", { x: x - 10, y: y - 10, width: 20, height: 20, fill: "var(--ice)" }, g);
  if (kind === "memorial") { L.svg("circle", { cx: x, cy: y, r: 14, fill: "none", stroke: "var(--mars)", "stroke-width": 4 }, g);
                             L.svg("circle", { cx: x, cy: y, r: 4, fill: "var(--mars)" }, g); }
});
const ml = (x, base, txt, c, align = "l", parent) => L.text({ x, base, s: 36, c, txt, align, cls: "ml",
  w: align === "c" ? Math.ceil(L.textWidth(txt, 36)) + 8 : undefined }, parent);
PLACES.forEach(([name, x, y, , c, dx, dy, al]) => ml(x + dx, y + dy, name, c, al));
// the regions' names, and the key
ml(MX0 + 24, MY0 + 60, "Romulan Star Empire", "olive");
ml(MX0 + 24, 600, "Neutral Zone", "olive");
ml(MX1 - 24, MY0 + 60, "Klingon Empire", "mars", "r");
ml(MX1 - 24, MY1 - 24, "Cardassian Union", "tan", "r");
ml(560, 1400 - 92 - 18, "Typhon Expanse", "lilac", "c");
ml(MX0 + 24, MY1 - 24, "Grid  ·  20 Light-Years", "sky");
{
  const KEY = [["Starship", "white", "ship"], ["New Orders", "butter", "ship"], ["Starbase", "ice", "base"]];
  KEY.forEach(([txt, c, kind], i) => {
    const base = 1064 + 44 * i, x = MX0 + 40, y = base - 13;
    if (kind === "ship") L.svg("path", { d: `M${x + 12},${y} L${x - 9},${y - 11} L${x - 4},${y} L${x - 9},${y + 11} Z`, fill: `var(--${c})` }, g);
    if (kind === "base") L.svg("rect", { x: x - 9, y: y - 9, width: 18, height: 18, fill: "var(--ice)" }, g);
    ml(x + 28, base, txt, c);
  });
}

// ---- the ships: each a chevron layer and a name layer ----
const course = L.layer({ x: 0, y: -2, w: 100, h: 4 });
course.style.transformOrigin = "0 50%";
course.style.background = "repeating-linear-gradient(90deg, rgba(255,204,102,.8) 0 14px, rgba(255,204,102,0) 14px 26px)";
const trail = L.layer({ x: 0, y: -3, w: 100, h: 6 });
trail.style.transformOrigin = "0 50%"; trail.style.background = "var(--butter)";
const ring = L.layer({ x: 0, y: 0, w: 76, h: 76, cls: "ring" });
[course, trail, ring].forEach((e) => op(e, 0));
FLEET.forEach((f) => {
  f.chev = L.layer({ x: 0, y: 0, w: 40, h: 40 });
  const s = L.svg("svg", { width: 40, height: 40, viewBox: "0 0 40 40" }, f.chev);
  f.path = L.svg("path", { d: "M32,20 L9,8 L14,20 L9,32 Z", fill: "var(--white)" }, s);
  f.chev.style.transformOrigin = "50% 50%";
  f.lab = L.layer({ x: 0, y: 0, w: 300, h: 50 });
  f.labTxt = L.text({ x: 0, base: 40, s: 36, c: "white", txt: f.short, cls: "ml" }, f.lab);
  f.labW = Math.ceil(L.textWidth(f.short, 36));
});
// where a ship's name sits: to the right, unless that runs into something
const LEFT = new Set(["sut", "vul", "cb2", "sb211", "typ"]);
const labOff = (key, f) => LEFT.has(key) ? [-48 - f.labW, 13] : [48, 13];

// ================= fleet assignments (top right) =================
L.header({ x: RX0, y: 280, w: RX1 - RX0, label: "Fleet Assignments", c1: "gold", c2: "sky" });
const FCAP = ["Vessel", "Registry", "Class", "Assignment", "Sector", "Status"];
const FAL = ["l", "l", "l", "l", "r", "r"];
const STAT = ["On Station", "New Orders", "Under Way"];
const FW = [widest(["Vessel", ...FLEET.map((f) => f.name)], 40), widest(["Registry", ...FLEET.map((f) => f.reg)], 40),
  widest(["Class", ...FLEET.map((f) => f.cls)], 40), widest(["Assignment", ...Object.values(STN).map((s) => s.job)], 40),
  widest(["Sector", "00000"], 40), widest(["Status", ...STAT], 40)];
const fcols = columns(RX0, RX1, FW);
const fx = (j) => (FAL[j] === "l" ? fcols[j][0] : fcols[j][1]);
FCAP.forEach((txt, j) => L.text({ x: fx(j), base: 396, s: 36, c: "gold", txt, align: FAL[j] }));
const ROW0 = 460, RP = 60;
const band = L.layer({ x: RX0 - 16, y: 0, w: RX1 - RX0 + 16, h: RP, cls: "band" });
op(band, 0);
FLEET.forEach((f, i) => {
  const base = ROW0 + RP * i;
  f.tName = L.text({ x: fx(0), base, s: 40, c: "white", txt: f.name, cls: "sw" });
  L.text({ x: fx(1), base, s: 40, c: "ice", txt: f.reg });
  L.text({ x: fx(2), base, s: 40, c: "sky", txt: f.cls });
  f.tJob = L.text({ x: fx(3), base, s: 40, c: "sky", txt: "", cls: "sw" });
  f.tSec = L.text({ x: fx(4), base, s: 40, c: "white", txt: "", align: "r", cls: "sw" });
  f.tStat = L.text({ x: fx(5), base, s: 40, c: "sky", txt: "", align: "r", cls: "sw" });
});

// ================= fleet strength by region (lower right) =================
const GY = 1180;
L.header({ x: RX0, y: GY, w: RX1 - RX0, label: "Fleet Strength by Region", c1: "sky", c2: "gold" });
const RNW = widest(REGIONS.map((r) => r[1]), 36), RCW = widest(["0"], 52);
const CNX = RX0 + RNW + 40 + RCW, SLOTS = 4, SG = 16, SX0 = CNX + 40, SX1 = RX1, SW = (SX1 - SX0 - (SLOTS - 1) * SG) / SLOTS;
const regionRows = REGIONS.map(([key, name], i) => {
  const base = 1296 + 54 * i;
  L.text({ x: RX0, base, s: 36, c: "sky", txt: name });
  const slots = Array.from({ length: SLOTS }, (_, j) =>
    L.box({ x: SX0 + j * (SW + SG), y: base - 36, w: SW, h: 40, c: TRACK, label: "", fs: 28, cls: "sw" }));
  return { key, slots, cnt: L.text({ x: CNX, base: base + 4, s: 52, c: "white", txt: "", align: "r" }) };
});

// ================= deployment log (bottom left) =================
L.header({ x: MX0, y: 1620, w: LX1 - MX0, label: "Deployment Log", c1: "sky", c2: "gold", h: 48 });
const allEvents = [...FLEET.map((f) => f.short)];
const EVW = ["New Orders  ·  Escort  ·  Starbase 133", ...REPORTS.map((r) => r[1]), "On Station  ·  Sector 00000"];
const LOGW = [widest(["Stardate", "44399.9"], 36), widest(["Vessel", ...allEvents], 36), widest(["Event", ...EVW], 36)];
const lcols = columns(MX0, LX1, LOGW);
const LAL = ["l", "l", "r"];
["Stardate", "Vessel", "Event"].forEach((txt, j) =>
  L.text({ x: LAL[j] === "l" ? lcols[j][0] : lcols[j][1], base: 1716, s: 36, c: "sky", txt, align: LAL[j] }));
const LOGN = 5, LP = 54;
const logClip = L.el("div", "clip", L.stage, { left: MX0 + "px", top: 1776 - 46 + "px", width: LX1 - MX0 + "px", height: LOGN * LP + 4 + "px" });
const logRows = Array.from({ length: LOGN + 1 }, (_, i) => {
  const e = L.layer({ x: 0, y: 0, w: LX1 - MX0, h: LP }, logClip);
  const cells = LOGW.map((_, j) => L.text({ x: LAL[j] === "l" ? lcols[j][0] - MX0 : lcols[j][1] - MX0, base: 46, s: 36,
    c: ["ice", "white", "sky"][j], txt: "", align: LAL[j], rightIn: LAL[j] === "r" }, e));
  const row = { e, slot: i, cells };
  row.fill = (d) => { d.slice(0, 3).forEach((v, j) => L.set(cells[j], v)); fg(cells[2], d[3]); };
  L.move(e, 0, i * LP);
  return row;
});
logRows[LOGN].e.style.opacity = 0;
const logQueue = [];
let logT0 = -1, logLanded = null, logT1 = 0, logPending = null;
L.tick((t) => {                                               // all slide up one place; the top row fades away
  if (logT0 < 0) { if (logQueue.length) { logPending = logQueue.shift(); logT0 = t; } else return; }
  const u = t - logT0;
  if (!logLanded) {
    const topRow = logRows.find((r) => r.slot === 0), k = L.ease(L.clamp(u / 1.1));
    logRows.forEach((r) => { if (r.slot <= LOGN - 1) L.move(r.e, 0, (r.slot - k) * LP); });
    topRow.e.style.opacity = (1 - L.clamp(u / 0.4)).toFixed(3);
    if (k < 1) return;
    const spare = logRows.find((r) => r.slot === LOGN);
    logRows.forEach((r) => { if (r !== spare) r.slot = r.slot === 0 ? LOGN : r.slot - 1; });
    spare.slot = LOGN - 1; spare.fill(logPending); spare.e.style.opacity = 0; L.move(spare.e, 0, (LOGN - 1) * LP);
    logLanded = spare; logT1 = t;
  } else {
    const a = L.clamp((t - logT1) / 0.8);
    logLanded.e.style.opacity = a.toFixed(3);
    if (a >= 1) { logT0 = -1; logLanded = null; }
  }
});
// the cycle's three events: [cycle second, what]
const eventsOf = (k) => {
  const f = mover(k), to = STN[f.st[1 - movesBefore(f, k) % 2]], [ri, rtxt] = report(k);
  return [[0, f.short, `New Orders  ·  ${to.job}`, "butter"], [T_ARR, f.short, `On Station  ·  Sector ${to.sec}`, "sky"],
          [T_REP, FLEET[ri].short, rtxt, "ice"]];
};
const logLine = (ev, ms) => [stardate(ms).toFixed(1), ev[1], ev[2], ev[3]];

// ================= current orders (bottom middle) =================
L.header({ x: OX0, y: 1620, w: MX1 - OX0, label: "Current Orders", c1: "butter", c2: "sky", h: 48 });
const oShip = L.text({ x: OX0, base: 1716, s: 36, c: "butter", txt: "" });
const oNo = L.text({ x: MX1, base: 1716, s: 36, c: "sky", txt: "", align: "r" });
const OLAB = ["From", "To", "Speed", "Remaining", "Transit"];
const OLW = widest(OLAB, 36);
const oVal = OLAB.slice(0, 4).map((txt, i) => {
  L.text({ x: OX0, base: 1776 + LP * i, s: 36, c: "sky", txt });
  return L.text({ x: MX1, base: 1776 + LP * i, s: 36, c: "white", txt: "", align: "r", cls: "sw" });
});
L.text({ x: OX0, base: 1992, s: 36, c: "sky", txt: "Transit" });
const OPW = widest(["100%"], 36), OBX0 = OX0 + OLW + 32, OBX1 = MX1 - OPW - 32;
L.rect({ x: OBX0, y: 1992 - 28, w: OBX1 - OBX0, h: 28, c: TRACK });
const oBar = L.layer({ x: OBX0, y: 1992 - 28, w: OBX1 - OBX0, h: 28 });
oBar.style.background = "var(--butter)"; oBar.style.transformOrigin = "0 0"; oBar.style.transform = "scaleX(0)";
const oPct = L.text({ x: MX1, base: 1992, s: 36, c: "white", txt: "", align: "r" });

// ================= in memoriam, Wolf 359 (bottom right) =================
L.header({ x: RX0, y: 1620, w: RX1 - RX0, label: "In Memoriam  ·  Wolf 359", c1: "mars", c2: "gold", h: 48 });
L.text({ x: RX0, base: 1716, s: 36, c: "mars", txt: "Stardate 44002.3  ·  39 Starships Lost  ·  11,000 Lives" });
L.text({ x: RX1, base: 1716, s: 36, c: "sky", txt: "Sector 001 Defended", align: "r" });
const TCOL = 13, TG = 12, TW = (RX1 - RX0 - (TCOL - 1) * TG) / TCOL;
const tiles = Array.from({ length: 39 }, (_, k) => {
  const x = RX0 + (k % TCOL) * (TW + TG), y = 1776 + LP * Math.floor(k / TCOL) - 36;
  L.rect({ x, y, w: TW, h: 36, c: "#3a2420", noalign: true });
  const glow = L.layer({ x, y, w: TW, h: 36 });
  glow.style.background = "var(--mars)"; op(glow, 0);
  return glow;
});
L.text({ x: RX0, base: 1938, s: 36, c: "white", txt: "Saratoga  ·  Melbourne  ·  Kyushu  ·  Tolstoy  ·  Chekov  ·  Bellerophon  ·  Gage" });
L.text({ x: RX0, base: 1992, s: 36, c: "sky", txt: "Their Watch Is Ended  ·  The Fleet Remembers" });
L.text({ x: RX1, base: 1992, s: 36, c: "gold", txt: "Fleet Rebuilding  ·  Utopia Planitia", align: "r" });

// ================= the clock =================
const bySt = {};                                             // which station each ship is at, now
let lastKey = null;
{ // the log starts with the last five events before now, oldest at the top
  const E = E0, k = Math.floor(E / CYCLE), u = E - k * CYCLE, past = [];
  for (let kk = k; kk >= k - 3 && past.length < LOGN; kk--) {
    const evs = eventsOf(kk);
    for (let i = evs.length - 1; i >= 0 && past.length < LOGN; i--) {
      const ago = (k - kk) * CYCLE + u - evs[i][0];
      if (ago >= 0) past.push(logLine(evs[i], Date.now() - ago * 1000));
    }
  }
  past.reverse().forEach((d, i) => logRows[i].fill(d));
  lastKey = k * 10 + [0, T_ARR, T_REP].filter((s) => s <= u).length;
}
const headOf = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
const turn = (a, b, k) => { let d = ((b - a + 540) % 360) - 180; return a + d * k; };
const placeShip = (f, x, y, rot, lo) => {
  tf(f.chev, `translate3d(${(x - 20).toFixed(2)}px,${(y - 20).toFixed(2)}px,0) rotate(${rot.toFixed(2)}deg)`);
  tf(f.lab, `translate3d(${(x + lo[0]).toFixed(2)}px,${(y + lo[1] - 40).toFixed(2)}px,0)`);
};
const cur = { k: null };
L.tick((t) => {
  const E = E0 + t, k = Math.floor(E / CYCLE), u = E - k * CYCLE;
  const key = k * 10 + [0, T_ARR, T_REP].filter((s) => s <= u).length;
  if (key !== lastKey) {
    const n = key % 10, evs = eventsOf(k);
    if (n > 0) logQueue.push(logLine(evs[n - 1], Date.now()));
    lastKey = key;
  }
  const m = mover(k), from = STN[stationAt(m, k)], toKey = m.st[1 - movesBefore(m, k) % 2], to = STN[toKey];
  cur.k = k; cur.m = m; cur.from = from; cur.to = to; cur.toKey = toKey; cur.u = u;
  const go = easeIn(u, T_GO, T_ARR - T_GO);
  cur.go = go;
  // every ship: on station, drifting a little along its heading
  FLEET.forEach((f) => {
    const s = STN[stationAt(f, k)];
    const drift = 5 * Math.sin(t / 7 + f.i * 1.3);
    if (f !== m) {
      const h = f.st.length === 2 ? headOf(STN[f.st[1 - f.st.indexOf(stationAt(f, k))]], s) : f.hd;
      const r = h * Math.PI / 180;
      placeShip(f, s.x + drift * Math.cos(r), s.y + drift * Math.sin(r), h, labOff(stationAt(f, k), f));
      return;
    }
    const h0 = headOf(STN[f.st[1 - f.st.indexOf(stationAt(f, k))]], from), h1 = headOf(from, to);
    const x = L.mix(from.x, to.x, go), y = L.mix(from.y, to.y, go);
    const lo0 = labOff(stationAt(f, k), f), lo1 = labOff(toKey, f), lk = easeIn(u, T_ARR - 6, 6);
    const lo = [L.mix(lo0[0], lo1[0], lk), L.mix(lo0[1], lo1[1], lk)];
    const rot = turn(h0, h1, easeIn(u, 1, T_GO - 1));
    const r = rot * Math.PI / 180, dd = drift * (u >= T_ARR ? easeIn(u, T_ARR, 6) : 1 - easeIn(u, 0, T_GO));
    placeShip(f, x + dd * Math.cos(r), y + dd * Math.sin(r), rot, lo);
    tf(ring, `translate3d(${(x - 38).toFixed(2)}px,${(y - 38).toFixed(2)}px,0)`);
  });
  // the course: laid in, flown, then cleared
  const len = Math.hypot(to.x - from.x, to.y - from.y), ang = headOf(from, to);
  const base = `translate3d(${from.x.toFixed(2)}px,${from.y.toFixed(2)}px,0) rotate(${ang.toFixed(3)}deg)`;
  tf(course, `${base} scaleX(${(len / 100).toFixed(4)})`);
  tf(trail, `${base} scaleX(${(len * go / 100).toFixed(4)})`);
  const vis = Math.min(easeIn(u, 0.5, 2.5), 1 - easeIn(u, T_ARR + 4, 4));
  op(course, 0.85 * vis); op(trail, 0.9 * vis);
  op(ring, Math.min(easeIn(u, 0, 1.5), 1 - easeIn(u, T_ARR + 2, 4)) * (0.75 + 0.25 * Math.cos(t * 1.6)));
  // the ordered ship's row
  tf(band, `translate3d(0,${(ROW0 - 46 + RP * m.i - 1).toFixed(1)}px,0)`);
  op(band, Math.min(easeIn(u, 0, 1), 1 - easeIn(u, T_ARR + 4, 2)));
  m.path.style.fill = u < T_ARR + 4 ? "var(--butter)" : "var(--white)";
  // the memorial: a light passing slowly along the 39
  const p = (t / 3) % 39;
  tiles.forEach((e, i) => { const d = Math.abs(p - i), w = Math.min(d, 39 - d); op(e, 0.75 * Math.max(0, 1 - w / 1.6) ** 2); });
});

// readings, a few times a second
L.every(250, () => {
  const { k, m, from, to, toKey, u, go } = cur;
  if (k === null) return;
  const sd = stardate().toFixed(1), moving = u < T_ARR;
  L.set(stateTxt, STATES[moving ? 1 : 0][0]); fg(stateTxt, STATES[moving ? 1 : 0][1]);
  L.set(subTxt, subFor(moving ? `${m.short} Under Orders` : "All Stations Manned", sd));
  // the table
  FLEET.forEach((f) => {
    let s = STN[stationAt(f, k)], st = 0;
    if (f === m) { if (u < T_GO) st = 1; else if (u < T_ARR) st = 2; s = u < 0 ? from : to; }
    L.set(f.tJob, s.job); fg(f.tJob, f === m && st ? "butter" : "sky");
    L.set(f.tSec, s.sec); fg(f.tSec, f === m && st ? "butter" : "white");
    L.set(f.tStat, STAT[st]); fg(f.tStat, st ? "butter" : "sky");
    fg(f.tName, f === m && st ? "butter" : "white");
  });
  // the regions: a ship counts where it is; under way, nowhere
  REGIONS.forEach(([key], i) => {
    const here = FLEET.filter((f) => {
      if (f === m) return u < T_GO ? from.reg === key : u >= T_ARR ? to.reg === key : false;
      return STN[stationAt(f, k)].reg === key;
    });
    const row = regionRows[i];
    row.slots.forEach((b, j) => { const f = here[j]; L.set(b, f ? f.short : ""); bg(b, f ? (f === m ? "butter" : "sky") : TRACK); });
    L.set(row.cnt, here.length);
  });
  // the orders panel
  const len = Math.hypot(to.x - from.x, to.y - from.y) * 0.1;   // 200 px squares are 20 light-years
  L.set(oShip, `${m.name}  ·  ${m.reg}`);
  L.set(oNo, `Order ${orderNo(k)}`);
  L.set(oVal[0], `${from.job}  ·  Sector ${from.sec}`);
  L.set(oVal[1], `${to.job}  ·  Sector ${to.sec}`);
  const crs = ((Math.round(90 + headOf(from, to)) % 360) + 360) % 360;
  const warp = u < T_GO ? "Holding" : u < T_ARR ? `Warp 6  ·  Course ${String(crs).padStart(3, "0")} Mark 0` : "Station Keeping";
  L.set(oVal[2], warp);
  L.set(oVal[3], `${(len * (1 - go)).toFixed(1)} of ${len.toFixed(1)} LY`);
  fg(oVal[3], u >= T_ARR ? "sky" : "white");
  tf(oBar, `scaleX(${go.toFixed(4)})`);
  L.set(oPct, `${Math.floor(go * 100 + 1e-6)}%`);
}, 0);

// ---------------- a guard: every line fits its place ----------------
fits(subFor("Excalibur Under Orders", "44399.9"), 38, RX1 - PILLW - 60 - subX, "subtitle");
for (const k of Object.keys(STN)) fits(`${STN[k].job}  ·  Sector ${STN[k].sec}`, 36, MX1 - OX0 - OLW - 40, "orders");
fits("Warp 6  ·  Course 000 Mark 0", 36, MX1 - OX0 - OLW - 40, "speed");
fits("Constellation", 28, SW - 30, "slot");
FLEET.forEach((f) => fits(f.short, 28, SW - 30, "slot"));
fits("Stardate 44002.3  ·  39 Starships Lost  ·  11,000 Lives", 36, RX1 - RX0 - L.textWidth("Sector 001 Defended", 36) - 48, "memorial");
fits("Their Watch Is Ended  ·  The Fleet Remembers", 36, RX1 - RX0 - L.textWidth("Fleet Rebuilding  ·  Utopia Planitia", 36) - 48, "memorial");
if (bad.length) setTimeout(() => { throw new Error("fleet-deployment: " + bad.join(" | ")); });
});
</script></body></html>
