<!doctype html>
<html><head><meta charset="utf-8"><title>Industrial Replicator</title>
<link rel="stylesheet" href="../lcars.css">
<style>
  /* swapped text dips and comes back; colors change slowly; .boot (the start-up cascade) always wins */
  .sw { transition: opacity .45s ease, background-color 1.2s ease, color 1.2s ease; }
  .out:not(.boot) { opacity: .2; }
  .clip { overflow: hidden; }
</style></head>
<body><script src="../lcars.js"></script><script>
"use strict";
const L = LCARS;
L.ready(() => {

// ---------------- the frame: a bracket, title centred ----------------
L.frame({ type: "C", title: "Industrial Replicator  •  Fabrication", c: "gold", c2: "tan", accent: "orange", foot: "Fab",
  side: [[140, "tan", "Fab 02"], [70, "orange", "2716"], [420, "gold", "Queue"], [70, "butter", "27"], [300, "tan", "Stocks"],
         [70, "orange", "C4"], [216, "gold", "Deck 27"]],
  side2: [[140, "tan", "Ind 02"], [70, "orange", "5094"], [420, "gold", "Pattern"], [70, "butter", "04"], [300, "tan", "Energy"],
          [70, "orange", "E7"], [216, "gold", "Output"]] });

const NS = "http://www.w3.org/2000/svg";
const TRACK = "#2e200c", DIM = "#3a2a12", CHAMBER = "#171006";
const fill = (x, y, w, h, c, origin = "0 0", parent) => {
  const f = L.layer({ x, y, w, h }, parent);
  f.style.background = c.startsWith("#") || c.includes("(") ? c : `var(--${c})`; f.style.transformOrigin = origin;
  return f;
};
const cls = (e, ...c) => (e.classList.add(...c), e);
const tf = (e, v) => { if (e._tf !== v) { e._tf = v; e.style.transform = v; } };
const op = (e, v) => { v = v < 0.005 ? "0" : v > 0.995 ? "1" : v.toFixed(2); if (e._op !== v) { e._op = v; e.style.opacity = v; } };
const bg = (e, c) => { if (e._bg !== c) { e._bg = c; e.style.background = c.startsWith("#") ? c : `var(--${c})`; } };
const fg = (e, c) => { if (e._fg !== c) { e._fg = c; e.style.color = c.startsWith("#") ? c : `var(--${c})`; } };
const swap = (els, f) => { els.forEach((e) => e.classList.add("out")); setTimeout(() => { f(); els.forEach((e) => e.classList.remove("out")); }, 460); };
const D2 = (n) => String(n).padStart(2, "0");
const fmt = (n, d = 0) => n.toLocaleString("en", { minimumFractionDigits: d, maximumFractionDigits: d });
const ease = (x) => L.ease(L.clamp(x));

// Columns: left 220–1080, the chamber 1140–2700, right 2760–3620. Rows of 64 on an 88 pitch from 428
// (upper) and 1148 (lower), shared across all three columns; the bottom strip on a 54 grid.
const LX = 220, LR = 1080, MX = 1140, MR = 2700, RX = 2760, RR = 3620;
const BX = 340, BRW = 240;                                   // gauges: bar 340 in, stops 240 short of the edge
const ROW0 = 428, ROW1 = 1148, PITCH = 88;
const base0 = (i) => ROW0 + i * PITCH + 52.5, base1 = (i) => ROW1 + i * PITCH + 52.5;
const STRIP = (i) => 1734 + i * 54;

const gaugeRow = (x, r, base, name, c, bx = BX, brw = BRW) => {
  const n = L.text({ x, base, s: 40, c: "tan", txt: name });
  L.rect({ x: x + bx, y: base - 26, w: r - brw - (x + bx), h: 26, c: TRACK });
  return { n, bar: fill(x + bx, base - 26, r - brw - (x + bx), 26, c), v: L.text({ x: r, base, s: 52, c: "white", txt: "", align: "r" }), u: -1 };
};
const showBar = (g, k) => { k = L.clamp(k); if (Math.abs(k - g.u) > 0.0002) { g.u = k; tf(g.bar, `scaleX(${k.toFixed(4)})`); } };

// ---------------- what the replicator makes ----------------
// The five bulk stocks, in the order of every composition.
const MATS = [["Tritanium", "gold", 14000, 0.82], ["Duranium", "tan", 16000, 0.77], ["Verterium Cortenide", "orange", 9000, 0.69],
              ["Rodinium", "butter", 6000, 0.74], ["Polysilicate", "peach", 5000, 0.86]];

// ---------------- the parts, as geometric patterns ----------------
// Each part is a few solids (in mm, z up): a turned body (lathe), a shape extruded upward (prismZ) or a
// section extruded front to back (prismY). They are seen from a little above, drawn once as SVG; the
// chamber only moves layers over them.
const D2R = Math.PI / 180, YAW = -36 * D2R, PIT = 16 * D2R;
const cY = Math.cos(YAW), sY = Math.sin(YAW), cP = Math.cos(PIT), sP = Math.sin(PIT);
const rot = ([x, y, z]) => [x * cY - y * sY, x * sY + y * cY, z];          // [across, depth, up]
const TOWARD = [0, -cP, sP], LIGHT = (() => { const v = [-0.5, -0.55, 0.68], n = Math.hypot(...v); return v.map((a) => a / n); })();
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const scrX = (p) => p[0], scrY = (p) => -p[2] * cP - p[1] * sP, depth = (p) => p[1] * cP - p[2] * sP;
const TAU = 2 * Math.PI;

// Every line carries, for each segment, the normals of the surfaces it lies on: a segment is in front
// when any of them faces us, so hidden lines can be drawn dim.
const UP = [0, 0, 1];
function lathe(P, o = {}) {
  const N = o.seg || 40, M = o.mer || 16;
  const pt = (z, r, a) => [r * Math.cos(a), r * Math.sin(a), z];
  const segN = (j, a) => { const [z0, r0] = P[j - 1], [z1, r1] = P[j]; return [(z1 - z0) * Math.cos(a), (z1 - z0) * Math.sin(a), -(r1 - r0)]; };
  // a ring, its segments lying on the surfaces of profile segments js (and facing up, if up)
  const ring = (z, r, js, up) => ({ pts: Array.from({ length: N }, (_, k) => pt(z, r, (k / N) * TAU)), closed: true,
    ns: Array.from({ length: N }, (_, k) => { const a = ((k + 0.5) / N) * TAU; return [...js.map((j) => segN(j, a)), ...(up ? [UP] : [])]; }) });
  const lines = [], faces = [];
  const H0 = P[0][0], H1 = P[P.length - 1][0], last = P.length - 1;
  P.forEach(([z, r], i) => { if (r > 0.5) lines.push(ring(z, r, [i, i + 1].filter((j) => j >= 1 && j <= last), i === last)); });
  const nl = o.layers || 16;
  for (let i = 1; i < nl; i++) {                             // the deposition layers, between the turns of the profile
    const z = H0 + ((H1 - H0) * i) / nl;
    for (let j = 1; j < P.length; j++) {
      const [z0, r0] = P[j - 1], [z1, r1] = P[j];
      if (z > z0 && z < z1) { lines.push(ring(z, r0 + ((r1 - r0) * (z - z0)) / (z1 - z0), [j])); break; }
    }
  }
  for (let m = 0; m < M; m++) {
    const a = (m / M) * TAU;
    lines.push({ pts: P.map(([z, r]) => pt(z, r, a)), ns: P.slice(1).map((_, j) => [segN(j + 1, a)]) });
  }
  for (let j = 1; j < P.length; j++) {
    const [z0, r0] = P[j - 1], [z1, r1] = P[j];
    if (z0 === z1 && r0 === r1) continue;
    for (let k = 0; k < N; k++) {
      const a0 = (k / N) * TAU, a1 = ((k + 1) / N) * TAU;
      faces.push({ pts: [pt(z0, r0, a0), pt(z0, r0, a1), pt(z1, r1, a1), pt(z1, r1, a0)], n: segN(j, (a0 + a1) / 2) });
    }
  }
  const [zt, rt] = P[last];
  if (rt > 0.5) faces.push({ pts: Array.from({ length: N }, (_, k) => pt(zt, rt, (k / N) * TAU)), n: UP });
  if (o.bore) {
    faces.push({ pts: Array.from({ length: N }, (_, k) => pt(zt, o.bore, (k / N) * TAU)), n: UP, dark: true, bias: 1 });
    lines.push(ring(zt, o.bore, [], true));
  }
  return { lines, faces };
}
const ccw = (poly) => { let a = 0; poly.forEach((p, i) => { const q = poly[(i + 1) % poly.length]; a += p[0] * q[1] - q[0] * p[1]; }); return a > 0 ? poly : poly.slice().reverse(); };
// a shape in the floor plane, extruded upward
function prismZ(poly, z0, z1, o = {}) {
  poly = ccw(poly);
  const n = poly.length, lines = [], faces = [];
  const en = (i) => { const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % n]; return [y1 - y0, -(x1 - x0), 0]; };   // outward
  const at = (z, up) => ({ pts: poly.map(([x, y]) => [x, y, z]), closed: true, ns: poly.map((_, i) => (up ? [en(i), UP] : [en(i)])) });
  lines.push(at(z0), at(z1, true));
  const nl = o.layers || 0;
  for (let i = 1; i < nl; i++) lines.push(at(z0 + ((z1 - z0) * i) / nl));
  (o.vert || poly.map((_, i) => i)).forEach((i) => lines.push({ pts: [[...poly[i], z0], [...poly[i], z1]], ns: [[en(i), en((i + n - 1) % n)]] }));
  for (let i = 0; i < n; i++) {
    const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % n];
    faces.push({ pts: [[x0, y0, z0], [x1, y1, z0], [x1, y1, z1], [x0, y0, z1]], n: en(i) });
  }
  faces.push({ pts: poly.map(([x, y]) => [x, y, z1]), n: UP });
  return { lines, faces };
}
// a section in the upright (x, z) plane, extruded from front (y0) to back (y1)
function prismY(poly, y0, y1, o = {}) {
  poly = ccw(poly);
  const n = poly.length, lines = [], faces = [];
  const en = (i) => { const [x0, z0] = poly[i], [x1, z1] = poly[(i + 1) % n]; return [z1 - z0, 0, -(x1 - x0)]; };   // outward
  const fn = (y) => [0, Math.sign(y - (y0 + y1) / 2), 0];
  const at = (y) => ({ pts: poly.map(([x, z]) => [x, y, z]), closed: true, ns: poly.map((_, i) => [en(i), fn(y)]) });
  lines.push(at(y0), at(y1));
  (o.vert || poly.map((_, i) => i)).forEach((i) => lines.push({ pts: [[poly[i][0], y0, poly[i][1]], [poly[i][0], y1, poly[i][1]]], ns: [[en(i), en((i + n - 1) % n)]] }));
  const zs = poly.map((p) => p[1]), zlo = Math.min(...zs), zhi = Math.max(...zs), nl = o.layers || 0;
  for (let i = 1; i < nl; i++) {                             // layer lines across both faces: the section's scanline
    const z = zlo + ((zhi - zlo) * i) / nl, xs = [];
    for (let j = 0; j < n; j++) {
      const [ax, az] = poly[j], [bx, bz] = poly[(j + 1) % n];
      if ((az <= z && bz > z) || (bz <= z && az > z)) xs.push(ax + ((z - az) * (bx - ax)) / (bz - az));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) for (const y of [y0, y1]) lines.push({ pts: [[xs[k], y, z], [xs[k + 1], y, z]], ns: [[fn(y)]] });
  }
  for (let i = 0; i < n; i++) {
    const [x0, z0] = poly[i], [x1, z1] = poly[(i + 1) % n];
    faces.push({ pts: [[x0, y0, z0], [x1, y0, z1], [x1, y1, z1], [x0, y1, z0]], n: en(i) });
  }
  faces.push({ pts: poly.map(([x, z]) => [x, y0, z]), n: fn(y0) });
  faces.push({ pts: poly.map(([x, z]) => [x, y1, z]), n: fn(y1) });
  return { lines, faces };
}
const arcPts = (cx, cz, r, a0, a1, k) => Array.from({ length: k + 1 }, (_, i) => { const a = (a0 + ((a1 - a0) * i) / k) * D2R; return [cx + r * Math.cos(a), cz + r * Math.sin(a)]; });

// the patterns
const SHAPES = {
  // a warp coil segment: a stilted arch of verterium cortenide
  coil: () => {
    const K = 24, outer = arcPts(0, 160, 300, 0, 180, K), inner = arcPts(0, 160, 200, 180, 0, K);
    const poly = [[300, 0], ...outer, [-300, 0], [-200, 0], ...inner, [200, 0]];
    const vert = poly.map((_, i) => i).filter((i) => i <= 1 || (i >= K && i <= K + 4) || i >= 2 * K + 2 || i % 4 === 1);
    return [prismY(poly, -75, 75, { vert, layers: 20 })];
  },
  // a plasma conduit section: a flanged tube with two stiffening rings
  conduit: () => [lathe([[0, 150], [28, 150], [28, 112], [150, 112], [150, 128], [180, 128], [180, 112], [320, 112], [320, 128],
                         [350, 128], [350, 112], [472, 112], [472, 150], [500, 150]], { bore: 92, layers: 18 })],
  // an EPS power coupling: a hexagonal base, the collar and the tap
  coupling: () => [
    prismZ(Array.from({ length: 6 }, (_, k) => [150 * Math.cos(k * 60 * D2R), 150 * Math.sin(k * 60 * D2R)]), 0, 90, { layers: 4 }),
    lathe([[90, 92], [250, 92], [250, 116], [282, 116], [282, 58], [380, 58]], { layers: 12, bore: 30 })],
  // a hull plate: a curved tritanium panel, its stringers on the inner face
  plate: () => {
    const R = 900, A = 19, k = 16;
    const p = (r, a) => [r * Math.sin(a * D2R), r * Math.cos(a * D2R) - R];
    const band = [...Array.from({ length: k + 1 }, (_, i) => p(R, -A + (2 * A * i) / k)), ...Array.from({ length: k + 1 }, (_, i) => p(R + 34, A - (2 * A * i) / k))];
    const out = [prismZ(band, 0, 560, { layers: 16, vert: [0, 4, 8, 12, 16, 17, 21, 25, 29, 33] })];
    for (const a of [-12, 0, 12]) {
      const t = [Math.cos(a * D2R), -Math.sin(a * D2R)], nn = [Math.sin(a * D2R), Math.cos(a * D2R)], c = p(R, a);
      const q = (u, v) => [c[0] + t[0] * u - nn[0] * v, c[1] + t[1] * u - nn[1] * v];
      out.push(prismZ([q(-14, 0), q(14, 0), q(14, 46), q(-14, 46)], 0, 560, { layers: 16 }));
    }
    return out;
  },
  // a mounting bracket: an angle of duranium with two gussets
  bracket: () => [
    prismY([[-240, 0], [240, 0], [240, 44], [-186, 44], [-186, 380], [-240, 380]], -140, 140, { layers: 18, vert: [0, 1, 2, 3, 4, 5] }),
    prismY([[-186, 44], [70, 44], [-186, 290]], -112, -86, { layers: 10 }),
    prismY([[-186, 44], [70, 44], [-186, 290]], 86, 112, { layers: 10 })],
  // a deuterium injector: the nozzle below, the body, the manifold collar and the feed
  injector: () => [lathe([[0, 30], [90, 74], [112, 74], [112, 116], [280, 116], [280, 146], [312, 146], [312, 66], [396, 66], [396, 86], [420, 86]],
                         { layers: 18, bore: 40 })],
};

// the chamber: the object stands on the platform in a box 720 × 770
const OBJ = { x: 1560, y: 456, w: 720, h: 770 }, OW = OBJ.w, OH = OBJ.h, MAXW = 600, MAXH = 690, FOOT = OH - 4;
const f1 = (v) => v.toFixed(1);
function build(prims) {
  const lines = [], faces = [];
  for (const pr of prims) {
    for (const l of pr.lines) lines.push({ pts: l.pts.map(rot), closed: l.closed, vis: l.ns.map((ns) => ns.some((v) => dot(rot(v), TOWARD) > 1e-6)) });
    for (const f of pr.faces) faces.push({ ...f, pts: f.pts.map(rot), n: rot(f.n) });
  }
  const all = lines.flatMap((l) => l.pts);
  const xs = all.map(scrX), ys = all.map(scrY);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = Math.min(MAXW / (x1 - x0), MAXH / (y1 - y0));
  const X = (p) => OW / 2 + (scrX(p) - (x0 + x1) / 2) * s, Y = (p) => FOOT - (y1 - scrY(p)) * s;
  // the pattern: every line, the far ones dimmer
  let front = "", back = "";
  for (const l of lines) {
    const n = l.pts.length, m = l.closed ? n : n - 1;
    for (let i = 0; i < m; i++) {
      const a = l.pts[i], b = l.pts[(i + 1) % n], seg = `M${f1(X(a))},${f1(Y(a))}L${f1(X(b))},${f1(Y(b))}`;
      if (l.vis[i]) front += seg; else back += seg;
    }
  }
  // the solid: faces toward us, lit from above left, far ones first
  const shown = faces.filter((f) => dot(f.n, TOWARD) > 1e-6);
  shown.forEach((f) => { f.d = f.pts.reduce((a, p) => a + depth(p), 0) / f.pts.length - (f.bias || 0); });
  shown.sort((a, b) => b.d - a.d);
  let solid = "";
  for (const f of shown) {
    const nl = Math.hypot(...f.n), b = 0.26 + 0.74 * Math.max(0, dot(f.n, LIGHT) / nl);
    const c = f.dark ? [26, 18, 6] : [L.mix(70, 226, b), L.mix(46, 168, b), L.mix(12, 64, b)].map(Math.round);
    const d = "M" + f.pts.map((p) => `${f1(X(p))},${f1(Y(p))}`).join("L") + "Z";
    solid += `<path d="${d}" fill="rgb(${c})" stroke="rgb(${c})" stroke-width="0.8"/>`;
  }
  // where the object is, row by row: the width of the deposition front
  const BIN = 4, NB = Math.ceil(OH / BIN), lo = new Array(NB).fill(Infinity), hi = new Array(NB).fill(-Infinity);
  for (const l of lines) {
    const n = l.pts.length, m = l.closed ? n : n - 1;
    for (let i = 0; i < m; i++) {
      const a = l.pts[i], b = l.pts[(i + 1) % n], ax = X(a), ay = Y(a), bx = X(b), by = Y(b);
      const k = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 3));
      for (let j = 0; j <= k; j++) {
        const x = L.mix(ax, bx, j / k), bi = Math.floor(L.mix(ay, by, j / k) / BIN);
        if (bi >= 0 && bi < NB) { lo[bi] = Math.min(lo[bi], x); hi[bi] = Math.max(hi[bi], x); }
      }
    }
  }
  const H = (y1 - y0) * s;
  const zmax = Math.max(...all.map((p) => p[2]));
  return { front, back, solid, top: FOOT - H, lo, hi, BIN, NB, layers: Math.round(zmax / 0.25), mm: zmax,
           span: (y) => { let b = L.clamp(Math.floor(y / BIN), 0, NB - 1); for (let d = 0; d < NB; d++) for (const c of [b - d, b + d]) if (c >= 0 && c < NB && lo[c] < Infinity) return [lo[c], hi[c]]; return [OW / 2, OW / 2]; } };
}

const PARTS = {
  coil:     { name: "Warp Coil Segment",      pat: "WC-4410-V", comp: [0, 10, 82, 8, 0],   kg: 186.0, dest: "Main Engineering",   qty: [2, 3] },
  conduit:  { name: "Plasma Conduit Section", pat: "PC-2209-D", comp: [18, 74, 0, 8, 0],   kg: 48.2,  dest: "Jefferies Tube 25",  qty: [4, 8] },
  coupling: { name: "EPS Power Coupling",     pat: "EP-0712-R", comp: [30, 12, 0, 50, 8],  kg: 22.4,  dest: "EPS Junction 12",    qty: [6, 10] },
  plate:    { name: "Hull Plate",             pat: "HP-1701-T", comp: [64, 30, 0, 0, 6],   kg: 96.5,  dest: "Cargo Bay 4",        qty: [3, 6] },
  bracket:  { name: "Mounting Bracket",       pat: "MB-0388-D", comp: [10, 86, 0, 4, 0],   kg: 9.6,   dest: "Shuttlebay 2",       qty: [8, 12] },
  injector: { name: "Deuterium Injector",     pat: "DI-3307-R", comp: [42, 0, 0, 50, 8],   kg: 31.4,  dest: "Main Engineering",   qty: [2, 4] },
};
const ORDER = ["coil", "conduit", "coupling", "plate", "bracket", "injector"];

// ---------------- status line ----------------
L.text({ x: LX, cap: 150, s: 100, c: "gold", txt: "Fabricating" });
const stateSub = cls(L.text({ x: MX, base: 222, s: 38, c: "tan", txt: "" }), "sw");
const stagePill = cls(L.box({ x: RR - 400, y: 150, w: 400, h: 72, c: "gold", label: "", r: "lr", fs: 36 }), "sw");

// ---------------- the fabrication queue ----------------
L.header({ x: LX, y: 280, w: LR - LX, label: "Fabrication Queue", c1: "gold", c2: "tan" });
const QJW = 170, QNX = LX + QJW + L.GAP;
[["Job", LX, ""], ["Part", QNX, ""], ["Units", LR, "r"]].forEach(([txt, x, align]) => L.text({ x, base: 400, s: 36, c: "gold", txt, align }));
const qRows = Array.from({ length: 6 }, (_, i) => ({
  box: cls(L.box({ x: LX, y: ROW0 + i * PITCH, w: QJW, h: 64, c: DIM, label: "", fs: 32, r: "l" }), "sw"),
  name: cls(L.text({ x: QNX, base: base0(i), s: 40, c: "tan", txt: "" }), "sw"),
  units: cls(L.text({ x: LR, base: base0(i), s: 52, c: "white", txt: "", align: "r" }), "sw"),
}));
let jobNum = 4471;
const newJob = (key, qty) => { const p = PARTS[key]; return { num: jobNum++, key, p, qty: qty || L.irand(...p.qty), done: 0 }; };
const queue = [newJob("coil", 3), newJob("conduit", 6), newJob("coupling", 8), newJob("plate", 4), newJob("bracket", 12), newJob("injector", 2)];
queue[0].done = 1;
let nextKind = 0;
const showQueue = () => qRows.forEach((r, i) => {
  const j = queue[i], on = i === 0;
  L.set(r.box, `J-${j.num}`); bg(r.box, on ? "gold" : DIM); fg(r.box, on ? "#000" : "tan");
  L.set(r.name, j.p.name); fg(r.name, on ? "butter" : "tan");
  L.set(r.units, `${j.done} / ${j.qty}`);
});

// ---------------- raw material stocks ----------------

  L.set(cHt.v, `${(layer * 0.25).toFixed(1)} mm`);
  L.set(cDev.v, s === 0 ? "0 nm" : `${Math.round(112 + 18 * Math.sin(t * 0.4) + 7 * Math.sin(t * 1.1))} nm`);
  const [P, C, M, B, F, K] = EN;
  showBar(P, P.val / PMAX); L.set(P.v, P.val.toFixed(1) + " MW");
  showBar(C, C.val); L.set(C.v, (C.val * 100).toFixed(1) + "%");
  showBar(M, M.val / 480); L.set(M.v, Math.round(M.val) + " kg/min");
  showBar(B, B.val); L.set(B.v, (B.val * 100).toFixed(2) + "%");
  showBar(F, F.val); L.set(F.v, (F.val * 100).toFixed(1) + "%");
  showBar(K, K.val); L.set(K.v, (K.val * 100).toFixed(1) + "%");
  L.set(drawV, `Now  ${P.val.toFixed(1)} MW`);
  stocks.forEach((m, i) => { showBar(m, m.lvl); L.set(m.v, (m.lvl * 100).toFixed(1) + "%"); fg(m.n, s === 1 && j.p.comp[i] >= 10 ? "butter" : "tan"); });
}, 0);
L.every(1000, () => showTotals(), 0);
let acc = 0, accT = 0;
L.every(60000, () => { if (accT > 0) { pw.shift(); pw.push(pw[NPT - 2] * 0.55 + (acc / accT) * 0.45); acc = accT = 0; drawChart(); } }, 0);
L.every(30000, () => { tot.rec += L.rand(0.4, 1.6); }, 0.3);
});
</script></body></html>
