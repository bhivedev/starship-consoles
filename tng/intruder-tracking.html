<body><script src="../lcars.js"></script><script>
"use strict";
const L = LCARS;
L.ready(() => {

const NS = "http://www.w3.org/2000/svg";
const X0 = 330, GR = 2490, RX = 2554, X1 = 3816, ML = 1398, MR = 1422;
const TRACK = "#1b2a40", ROOM = "#12223a", CORR = "#22354b";
const cls = (e, ...c) => (e.classList.add(...c), e);
const op = (e, v) => { v = v < 0.005 ? "0" : v > 0.995 ? "1" : v.toFixed(3); if (e._op !== v) { e._op = v; e.style.opacity = v; } };
const tf = (e, v) => { if (e._tf !== v) { e._tf = v; e.style.transform = v; } };
const fg = (e, c) => { const v = c.startsWith("#") ? c : `var(--${c})`; if (e._fg !== v) { e._fg = v; e.style.color = v; } };
const bg = (e, c) => { const v = c.startsWith("#") ? c : `var(--${c})`; if (e._bg !== v) { e._bg = v; e.style.background = v; } };
const fill = (x, y, w, h, c) => { const f = L.layer({ x, y, w, h }); f.style.background = `var(--${c})`; f.style.transformOrigin = "0 0"; f._bg = `var(--${c})`; return f; };
const scaleX = (e, k) => tf(e, `scaleX(${L.clamp(k).toFixed(4)})`);
const swap = (els, f) => { els.forEach((e) => e.classList.add("out")); setTimeout(() => { f(); els.forEach((e) => e.classList.remove("out")); }, 520); };
const pad2 = (n) => String(n).padStart(2, "0");
const range = (n) => Array.from({ length: n }, (_, i) => i);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = L.irand(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sv = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const svgIn = (parent, w, h) => { const s = sv("svg", { width: w, height: h }, parent); Object.assign(s.style, { position: "absolute", left: 0, top: 0, overflow: "visible" }); return s; };
const bad = [];
const fits = (txt, s, w, where) => { if (L.textWidth(txt, s) > w) bad.push(`${where}: "${txt}" ${Math.round(L.textWidth(txt, s))}>${Math.round(w)}`); };
const hyp = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const polyLen = (p) => { let s = 0; for (let i = 1; i < p.length; i++) s += hyp(p[i - 1], p[i]); return s; };
const along = (p, s) => {
  for (let i = 1; i < p.length; i++) {
    const l = hyp(p[i - 1], p[i]);
    if (s <= l || i === p.length - 1) { const k = l ? L.clamp(s / l) : 1; return [L.mix(p[i - 1][0], p[i][0], k), L.mix(p[i - 1][1], p[i][1], k)]; }
    s -= l;
  }
  return p[0].slice();
};
// distance along a leg that eases in and out: accelerate for a, cruise, decelerate for a
const trap = (len, dur, tau, a) => {
  a = Math.min(a, dur / 2); const v = len / (dur - a);
  if (tau <= 0) return 0; if (tau >= dur) return len;
  if (tau < a) return (v * tau * tau) / (2 * a);
  if (tau < dur - a) return v * (tau - a / 2);
  const r = dur - tau; return len - (v * r * r) / (2 * a);
};
const trapV = (len, dur, tau, a) => {
  a = Math.min(a, dur / 2); const v = len / (dur - a);
  if (tau <= 0 || tau >= dur) return 0;
  return tau < a ? (v * tau) / a : tau < dur - a ? v : (v * (dur - tau)) / a;
};
const trapT = (len, dur, s, a) => {                            // the time a leg reaches distance s
  a = Math.min(a, dur / 2); const v = len / (dur - a);
  if (s <= (v * a) / 2) return Math.sqrt((2 * a * s) / v);
  if (s <= len - (v * a) / 2) return s / v + a / 2;
  return dur - Math.sqrt(Math.max(0, (2 * a * (len - s)) / v));
};

// ---------------- the frame: sidebar left, title top right ----------------
const SD = (45896 + L.rand(0.1, 0.8)).toFixed(1);             // after The Next Phase (45892) — its interphase signature is on file
L.frame({ type: "A", title: "Intruder Tracking  •  Internal Sensors", c: "mars", c2: "ice", accent: "red", foot: "Security",
  side: [[140, "ice", SD], [70, "red", "08-21"], [420, "mars", "Sensors"], [70, "ice", "Lv 3"],
         [300, "mars", "Teams"], [70, "red", "04"], [216, "ice", "Force Fields"]] });

// ---------------- the decks: 24 rooms each, numbered fore to aft ----------------
// order per column: row A (whole, or upper and lower), row B, row C (whole, or upper and lower)
const DECKS = {
  6: ["Crew Quarters", "Science Lab 4", "Guest Quarters", "Storage",
      "Transporter Room 2", "Crew Quarters", "Transporter Room 3", "Crew Lounge",
      "Officers' Quarters", "Gymnasium", "Crew Quarters", "Replicator Bay",
      "Storage", "Crew Quarters", "Science Lab 5", "Guest Quarters",
      "Ensigns' Quarters", "Cargo Transporter", "Life Support", "Storage",
      "Crew Quarters", "Crew Quarters", "Science Lab 6", "Observation Lounge"],
  22: ["Cargo Control", "Cargo Bay 3", "Storage", "Antigrav Lifts",
       "Crew Quarters", "Storage", "Cargo Transporter", "Matter Stores",
       "Quartermaster", "Cargo Bay 4", "Storage", "Crew Quarters",
       "Storage", "Workshop", "Cargo Bay 5", "Hazardous Cargo",
       "Inventory Control", "Freight Lift", "Storage", "Crew Quarters",
       "Storage", "Crew Quarters", "Bulk Stores", "Docking Port"],
  12: ["Crew Quarters", "Biology Lab", "Storage", "Crew Quarters",
       "Nursery", "Crew Quarters", "Sickbay", "Intensive Care",
       "Surgery", "Medical Lab", "Morgue", "Pharmacy",
       "CMO's Office", "Physical Therapy", "Counselor's Office", "Crew Quarters",
       "Exobiology Lab", "Isolation Ward", "Storage", "Crew Quarters",
       "Crew Quarters", "Medical Stores", "Diagnostics", "Crew Lounge"],
  36: ["Engineering Lab", "Main Engineering", "Storage", "Crew Quarters",
       "Chief Engineer", "Engineering Office", "Warp Core", "Dilithium Chamber",
       "Fabrication Shop", "Engineering Bay", "Storage", "Crew Quarters",
       "Transfer Conduits", "Storage", "Plasma Conduits", "Workshop",
       "Engineering Stores", "Field Generators", "EPS Junction", "Crew Quarters",
       "Storage", "Crew Quarters", "Systems Lab", "Crew Lounge"],
};
// what the sensors find, and how each kind of intruder behaves
const LIB = ["Humanoid", "Borg Drone  ·  Third of Five", "Romulan Interphase Signature", "Nonhumanoid Lifeform", "Energy-Based Lifeform"];
const PROFILES = [
  { deck: 6, origin: 6, cls: "Interphase Signature", life: "Intermittent", mass: () => "Indeterminate", speed: 46, base: 44, amp: 13,
    match: [12, 4, 86, 9, 31], losses: 2, phase: true },
  { deck: 22, origin: 9, cls: "Nonhumanoid Lifeform", life: "Nonhumanoid", mass: () => L.irand(34, 42) + " kg", speed: 74, base: 78, amp: 5,
    match: [7, 3, 2, 81, 6], losses: 1 },
  { deck: 12, origin: 21, cls: "Unregistered Humanoid", life: "Humanoid", mass: () => L.irand(68, 84) + " kg", speed: 56, base: 84, amp: 4,
    match: [74, 9, 3, 14, 2], losses: 1 },
  { deck: 36, origin: 18, cls: "Energy-Based Lifeform", life: "Energy Pattern", mass: () => "Negligible", speed: 86, base: 70, amp: 8,
    match: [3, 1, 18, 6, 83], losses: 1 },
];
const TEAMS = [{ n: "Team 1", leader: "Lt. Worf" }, { n: "Team 2", leader: "Lt. j.g. Ortega" }, { n: "Team 3", leader: "Ens. Kessler" }];
const MPX = 0.025;                                               // metres per design px on the plan

// ---------------- status line ----------------
const BIG = 100;
const state = cls(L.text({ x: X0, cap: 150, s: BIG, c: "ice", txt: "" }), "sw");
const sub = cls(L.text({ x: 0, base: 222, s: 38, c: "ice", txt: "" }), "sw");
const placeSub = () => { sub.style.left = X0 + L.textWidth(state.textContent, BIG) + 48 + "px"; };
const reading = (x, label, align) => {
  const lw = L.textWidth(label, 40);
  if (align === "r") {
    const v = L.text({ x, cap: 150, s: BIG, c: "white", txt: "00:00", align: "r" });
    const lab = L.text({ x: 0, base: 222, s: 40, c: "ice", txt: label });
    return { v, place: () => { lab.style.left = x - L.textWidth(v.textContent, BIG) - 36 - lw + "px"; } };
  }
  L.text({ x, base: 222, s: 40, c: "ice", txt: label });
  return { v: L.text({ x: x + lw + 36, cap: 150, s: BIG, c: "white", txt: "0" }), place: () => {} };
};
const rFix = reading(RX, "Track Fixes");
const rTime = reading(X1, "Contact Time", "r");

// ---------------- the deck plan ----------------
const PX0 = X0, PX1 = GR, PY0 = 360, PY1 = 1484, CWD = 48, G8 = 8;
const planBox = L.box({ x: X0, y: 280, w: Math.ceil(L.textWidth("Deck Plan  ·  Deck 22", 32) + 88), h: 56, c: "mars", label: "", fs: 32, r: "l", cls: "sw" });
const planLW = parseFloat(planBox.style.width);
L.rect({ x: X0 + planLW + L.GAP, y: 280, w: GR - X0 - planLW - L.GAP, h: 56, c: "ice" });
const COLW = [304, 308, 308, 308, 308, 304];
const colL = [];
{ let x = PX0; for (const w of COLW) { colL.push(x); x += w + 2 * G8 + CWD; } }
const VX = range(5).map((i) => colL[i] + COLW[i] + G8 + CWD / 2);
const HY = [724, 1120];
// corridors: two running fore and aft, five across
HY.forEach((y) => L.rect({ x: PX0, y: y - CWD / 2, w: PX1 - PX0, h: CWD, c: CORR, noalign: true }));
VX.forEach((x) => L.rect({ x: x - CWD / 2, y: PY0, w: CWD, h: PY1 - PY0, c: CORR, noalign: true }));
// rooms
const rooms = [];
for (let c = 0; c < 6; c++) {
  const add = (row, y0, y1, part) => rooms.push({ i: rooms.length, row, col: c, part, x: colL[c], y: y0, w: COLW[c], h: y1 - y0 });
  if (c % 2 === 0) add(0, 360, 692, "w"); else { add(0, 360, 522, "t"); add(0, 530, 692, "b"); }
  add(1, 756, 1088, "w");
  if (c % 2 === 1) add(2, 1152, 1484, "w"); else { add(2, 1152, 1314, "t"); add(2, 1322, 1484, "b"); }
}
for (const r of rooms) {
  r.cx = r.x + r.w / 2; r.cy = r.y + r.h / 2;
  r.sx = r.x + r.w - 50; r.sy = r.h > 200 ? r.y + 200 : r.y + 124;   // where someone stands, and its doors: aft of its labels
  L.rect({ x: r.x, y: r.y, w: r.w, h: r.h, c: ROOM, panel: true, noalign: true });
  L.rect({ x: r.x, y: r.y, w: r.w, h: 8, c: r.row === 1 ? "mars" : "ice", noalign: true });
  r.num = cls(L.text({ x: r.x + 22, cap: r.y + 28, s: 36, c: "ice", txt: "" }), "sw");
  r.name = cls(L.text({ x: r.x + 22, cap: r.y + 70, s: 36, c: "sand", txt: "" }), "sw");
}

// ---------------- the graph the intruder and the teams move on ----------------
const nodes = [], keyOf = new Map();
const node = (x, y, kind) => {
  const k = Math.round(x) + "," + Math.round(y);
  if (keyOf.has(k)) return keyOf.get(k);
  nodes.push({ id: nodes.length, x, y, kind, adj: [] }); keyOf.set(k, nodes.length - 1); return nodes.length - 1;
};
const link = (a, b, phase = false) => {
  if (a === b) return;
  const A = nodes[a], B = nodes[b], len = Math.hypot(A.x - B.x, A.y - B.y);
  A.adj.push({ to: b, len, phase }); B.adj.push({ to: a, len, phase });
};
const ek = (a, b) => (a < b ? a + "-" + b : b + "-" + a);
const hList = HY.map(() => []), vList = VX.map(() => []);
const hEnds = HY.map((y, j) => { const a = node(PX0 + 22, y, "end"), b = node(PX1 - 22, y, "end"); hList[j].push(a, b); return [a, b]; });
const vEnds = VX.map((x, i) => { const a = node(x, PY0 + 22, "end"), b = node(x, PY1 - 22, "end"); vList[i].push(a, b); return [a, b]; });
VX.forEach((x, i) => HY.forEach((y, j) => { const n = node(x, y, "x"); vList[i].push(n); hList[j].push(n); }));
// doors: onto the corridor fore and aft where the room touches one, else onto the corridor beside it
const doorMarks = [];
for (const r of rooms) {
  r.node = node(r.sx, r.sy, "room"); nodes[r.node].room = r;
  r.doors = [];
  const hDoor = (j, above) => {
    const d = node(r.sx, HY[j], "door"); hList[j].push(d); r.doors.push({ n: d, gx: r.sx, gy: above ? r.y + r.h + 4 : r.y - 4, h: true });
  };
  if (r.row === 1) { hDoor(0, false); hDoor(1, true); }
  else if (r.row === 0 && r.part !== "t") hDoor(0, true);
  else if (r.row === 2 && r.part !== "b") hDoor(1, false);
  else {
    const i = Math.min(r.col, 4), right = i === r.col;
    const d = node(VX[i], r.sy, "door"); vList[i].push(d);
    r.doors.push({ n: d, gx: right ? r.x + r.w + 4 : r.x - 4, gy: r.sy, h: false });
  }
  for (const d of r.doors) {
    link(r.node, d.n);
    doorMarks.push(d.h ? { x: d.gx - 32, y: d.gy - 4, w: 64, h: 8 } : { x: d.gx - 4, y: d.gy - 32, w: 8, h: 64 });
  }
}
const sortLink = (list, axis) => {
  const u = [...new Set(list)].sort((a, b) => nodes[a][axis] - nodes[b][axis]);
  for (let i = 1; i < u.length; i++) link(u[i - 1], u[i]);
};
hList.forEach((l) => sortLink(l, "x")); vList.forEach((l) => sortLink(l, "y"));
// an interphased being walks through bulkheads: straight from one middle-row room to the next
const rowB = rooms.filter((r) => r.row === 1);
for (let i = 1; i < rowB.length; i++) link(rowB[i - 1].node, rowB[i].node, true);
doorMarks.forEach((d) => L.rect({ ...d, c: "ice", free: true }));
const LIFTS = [hEnds[0][0], hEnds[1][1], vEnds[1][0], vEnds[3][1], vEnds[2][1], vEnds[4][0], hEnds[0][1], hEnds[1][0]];

const roomAt = (x, y) => rooms.find((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
const nearRoom = (x, y) => roomAt(x, y) || rooms.reduce((b, r) => (Math.hypot(r.cx - x, r.cy - y) < Math.hypot(b.cx - x, b.cy - y) ? r : b));

// a wandering path from the origin room to another room, along corridors (and, for a phased being, through walls)
function genPath(start, phase, minLen, maxLen) {
  const startRoom = nodes[start].room;
  let best = null;
  for (let tries = 0; tries < 4000; tries++) {
    const path = [start], seen = new Set(path);
    let len = 0, cur = start, prevDir = "";
    for (let step = 0; step < 90; step++) {
      const cand = [];
      for (const e of nodes[cur].adj) {
        if (seen.has(e.to) || (e.phase && !phase)) continue;
        const n = nodes[e.to], C = nodes[cur];
        if (n.kind === "end") continue;
        const dir = Math.sign(Math.round(n.x - C.x)) + "," + Math.sign(Math.round(n.y - C.y));
        if (n.kind === "room") {
          const ends = len + e.len >= minLen && n.room !== startRoom;
          const onward = n.adj.some((f) => f.to !== cur && !seen.has(f.to) && (phase || !f.phase));
          if (ends) cand.push({ e, w: 8, ends: true, dir });
          else if (onward && n.room !== startRoom) cand.push({ e, w: phase ? 2 : 0.6, ends: false, dir });
          continue;
        }
        cand.push({ e, w: dir === prevDir ? 3 : 1, ends: false, dir });
      }
      if (!cand.length) break;
      let r = Math.random() * cand.reduce((a, c) => a + c.w, 0), pick = cand[0];
      for (const c of cand) { r -= c.w; if (r <= 0) { pick = c; break; } }
      path.push(pick.e.to); seen.add(pick.e.to); len += pick.e.len; prevDir = pick.dir; cur = pick.e.to;
      if (pick.ends) {
        if (len <= maxLen) return path;
        if (!best || len < best.len) best = { path, len };
        break;
      }
    }
  }
  return best.path;
}
// the teams keep to the corridors: shortest way from a turbolift to the door
function route(a, b) {
  const N = nodes.length, dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), done = new Array(N).fill(false);
  dist[a] = 0;
  for (;;) {
    let u = -1;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < Infinity && (u < 0 || dist[i] < dist[u])) u = i;
    if (u < 0 || u === b) break;
    done[u] = true;
    for (const e of nodes[u].adj) {
      if (e.phase || nodes[e.to].kind === "room") continue;
      const d = dist[u] + e.len;
      if (d < dist[e.to]) { dist[e.to] = d; prev[e.to] = u; }
    }
  }
  const out = [];
  for (let u = b; u >= 0; u = prev[u]) out.unshift(u);
  return out;
}
const trimEnd = (pts, d) => {
  pts = pts.map((p) => p.slice());
  while (pts.length > 1 && d > 0) {
    const a = pts[pts.length - 2], b = pts[pts.length - 1], l = hyp(a, b);
    if (l <= d) { pts.pop(); d -= l; }
    else { const k = (l - d) / l; pts[pts.length - 1] = [L.mix(a[0], b[0], k), L.mix(a[1], b[1], k)]; d = 0; }
  }
  return pts;
};

// ---------------- an incident, worked out in full when it begins ----------------
const ACC = 1.0, TSPD = 72, TACC = 1.2;
function makeIncident(T0, prof) {
  const I = { prof, T0, deck: prof.deck, dd: pad2(prof.deck), ph: L.rand(0, 6), massTxt: prof.mass() };
  I.sec = (r) => `${I.dd}-${pad2(r.i + 1)}`;
  I.secAt = (x, y) => I.sec(nearRoom(x, y));
  I.origin = rooms[prof.origin];
  const g = genPath(I.origin.node, !!prof.phase, prof.speed * 32, prof.speed * 44);
  const pts = g.map((id) => [nodes[id].x, nodes[id].y]);
  I.path = g; I.final = nodes[g[g.length - 1]].room;
  I.tDet = T0 + L.rand(10, 13);
  I.tMove0 = I.tDet + 1.6;
  // one or two pauses at junctions; legs between them
  const inner = range(g.length).filter((i) => i >= 2 && i <= g.length - 4 && nodes[g[i]].kind === "x");
  const pauses = new Map();
  shuffle(inner).slice(0, L.irand(1, 2)).forEach((i) => pauses.set(i, L.rand(2.4, 3.6)));
  I.legs = []; I.nodeT = [];
  let tc = I.tMove0, a = 0;
  for (const b of [...[...pauses.keys()].sort((p, q) => p - q), g.length - 1]) {
    const lp = pts.slice(a, b + 1), len = polyLen(lp), dur = len / prof.speed + ACC;
    const leg = { t0: tc, t1: tc + dur, pts: lp, len, dur };
    I.legs.push(leg);
    let s = 0;
    for (let i = a; i <= b; i++) { if (i > a) s += hyp(pts[i - 1], pts[i]); I.nodeT[i] = tc + trapT(len, dur, s, ACC); }
    tc = leg.t1 + (pauses.get(b) || 0);
    a = b;
  }
  I.tArrive = I.legs[I.legs.length - 1].t1;
  // contact lost now and then
  I.losses = [];
  const lo = I.tMove0 + 6, hi = I.tArrive - 6;
  for (let tries = 0; tries < 200 && I.losses.length < prof.losses; tries++) {
    const d = L.rand(5.5, 7.5), s = L.rand(lo, hi - d);
    if (s < lo || s + d > hi) continue;
    if (I.losses.every((w) => s > w.l1 + 5 || s + d < w.l0 - 5)) I.losses.push({ l0: s, l1: s + d });
  }
  I.losses.sort((p, q) => p.l0 - q.l0);
  // the teams: from three turbolifts to the door the intruder went in by, arriving after it stops
  const entry = g[g.length - 2];
  const starts = shuffle(LIFTS.filter((id) => id !== entry));
  const used = new Set();
  I.teams = TEAMS.map((tm, k) => {
    const rt = route(starts[k], entry);
    for (let i = 1; i < rt.length; i++) used.add(ek(rt[i - 1], rt[i]));
    const full = rt.map((id) => [nodes[id].x, nodes[id].y]);
    const rp = trimEnd(full, Math.min([36, 110, 184][k], polyLen(full) - 1));
    const len = polyLen(rp), td = I.tDet + 3 + 2.2 * k;
    let ta = I.tArrive + 2 + 2.6 * k;
    const tm0 = Math.max(td + 1.2, ta - len / TSPD - TACC);

let cur = makeIncident(firstT0, firstProf), prevI = before;

function crewDots(I) {
  while (crewSvg.firstChild) crewSvg.removeChild(crewSvg.firstChild);
  for (const r of rooms) {
    const n = L.irand(0, r.h > 200 ? 4 : 2);
    for (let k = 0; k < n; k++) {
      let x, y, tries = 0;
      do { x = L.rand(r.x + 28, r.x + r.w - 28); y = L.rand(r.y + 118, r.y + r.h - 24); tries++; }
      while (tries < 20 && Math.hypot(x - r.sx, y - r.sy) < 60);
      sv("circle", { cx: x - PX0, cy: y - PY0, r: 7, fill: "#bdb497", opacity: 0.75 }, crewSvg);
    }
  }
}
function setup(I, first) {
  fieldEls.forEach((f, i) => {
    const d = I.fields[i];
    if (d) Object.assign(f.style, { left: d.x + "px", top: d.y + "px", width: d.w + "px", height: d.h + "px" });
    op(f, 0);
  });
  const r = I.final;
  Object.assign(holdL.style, { left: r.x - 3 + "px", top: r.y - 3 + "px", width: r.w + 6 + "px", height: r.h + 6 + "px" });
  holdL.classList.toggle("anyon", !!I.prof.phase);
  op(holdL, 0);
  while (gLines.firstChild) gLines.removeChild(gLines.firstChild);
  while (gDots.firstChild) gDots.removeChild(gDots.firstChild);
  op(trailL, 1);
  tints.forEach((tn) => { tn.room = null; tn.on = false; tn.from = 0; op(tn.e, 0); });
  const put = () => {
    rooms.forEach((rm) => { L.set(rm.num, I.sec(rm)); L.set(rm.name, DECKS[I.deck][rm.i]); });
    L.set(planBox, `Deck Plan  ·  Deck ${I.dd}`);
    crewDots(I);
  };
  if (first) put(); else swap([planBox, crewL, ...rooms.flatMap((rm) => [rm.num, rm.name])], put);
}
setup(cur, true);
function drawFix(I, f) {
  const x = f.x - PX0, y = f.y - PY0, p = I.lastFix;
  if (p) sv("line", { x1: p.x - PX0, y1: p.y - PY0, x2: x, y2: y, stroke: f.gap ? "#8fd3ff" : "#ff5a3c", "stroke-width": f.gap ? 4 : 5,
    "stroke-dasharray": f.gap ? "12 12" : "none", opacity: f.gap ? 0.85 : 0.6, "stroke-linecap": "round" }, gLines);
  if (p) sv("circle", { cx: x, cy: y, r: 8, fill: "#ff5a3c" }, gDots);
  else sv("circle", { cx: x, cy: y, r: 14, fill: "none", stroke: "#ff5a3c", "stroke-width": 5 }, gDots);   // where it was first seen
  I.lastFix = f;
}
// the log starts with what has already happened
{
  const hist = [...before.events.filter((e) => e.A < cur.T0), ...cur.events.filter((e) => e.A <= 0)].slice(-LN);
  while (cur.ei < cur.events.length && cur.events[cur.ei].A <= 0) cur.ei++;
  lastLogA = hist[hist.length - 1].A;
  logRows.forEach((r, i) => showLog(r, hist[i]));
}

// ---------------- the signal trace ----------------
const floorSig = (t) => 4 + 1.6 * Math.sin(t * 1.3) + 1.1 * Math.sin(t * 3.7 + 1);
const sigAt = (t) => {
  const I = t >= cur.T0 ? cur : prevI && t >= prevI.T0 ? prevI : null, f = floorSig(t);
  if (!I) return f;
  const s = I.prof.base + I.prof.amp * Math.sin(t * 0.9 + I.ph) + I.prof.amp * 0.4 * Math.sin(t * 2.3);
  return L.clamp(f + visAt(I, t) * (s - f), 0, 100);
};
let written = 0, prevPt = null, filled = false, lastT = 0;
function stepTrace(dt, time) {
  const x = written + dt * CSPD, y = yOf(sigAt(time));
  for (const tile of tiles) if (x >= (tile.idx + 2) * CWW) { tile.idx += 2; tile.g.clearRect(0, 0, CWW + 8, CHH); }
  if (prevPt) for (const tile of tiles) {
    const g = tile.g, o = tile.idx * CWW;
    g.strokeStyle = "#ff5a3c"; g.lineWidth = 3.4; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); g.moveTo(prevPt[0] - o, prevPt[1]); g.lineTo(x - o, y); g.stroke();
  }
  prevPt = [x, y]; written = x;
}
// the trace is drawn ten times a second; between draws the tiles keep gliding, so the scroll stays smooth
const placeTiles = (lead) => tiles.forEach((tile) => tf(tile.cv, `translate3d(${(tile.idx * CWW - (written + lead - CWW)).toFixed(2)}px,0,0)`));
tiles.forEach((c) => (c.onResize = () => { filled = false; }));

// ---------------- readings, a few times a second ----------------
let word = "", subTxt = "";
const mmss = (s) => `${pad2(Math.floor(s / 60))}:${pad2(Math.floor(s % 60))}`;
function stateOf(I, t) {
  const dk = `Deck ${I.dd}`, fin = `Section ${I.sec(I.final)}`;
  if (t < I.tDet) return ["Sweeping", "ice", `${dk}  ·  No Contact`];
  if (t >= I.tSD) return ["Stand Down", "ice", `${dk}  ·  Teams Returning`];
  if (t >= I.tDone) return I.prof.phase ? ["Resolved", "ice", `${dk}  ·  ${fin}  ·  Chronitons Dispersed`] : ["Contained", "ice", `${dk}  ·  ${fin}  ·  Security Holding`];
  if (t >= I.tCont) return I.prof.phase ? ["Anyon Sweep", "sky", `${dk}  ·  ${fin}  ·  Emitters Active`] : ["Containment", "sky", `${dk}  ·  ${fin}  ·  Doors Sealed`];
  if (t < I.tMove0 + 1.5) return ["Intruder Alert", "mars", `${dk}  ·  Section ${I.sec(I.origin)}  ·  ${DECKS[I.deck][I.origin.i]}`];
  if (lossAt(I, t)) return ["Contact Lost", "peach", `${dk}  ·  Last Fix  ·  Section ${I.lastFix ? I.secAt(I.lastFix.x, I.lastFix.y) : I.sec(I.origin)}`];
  const p = posAt(I, t);
  return ["Tracking", "mars", `${dk}  ·  Section ${I.secAt(p[0], p[1])}  ·  ${headingAt(I, t)}`];
}
function headingAt(I, t) {
  if (speedAt(I, t) < 4) return "Stationary";
  const a = posAt(I, t - 0.15), b = posAt(I, t + 0.15), dx = b[0] - a[0], dy = b[1] - a[1];
  return Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? "Moving Aft" : "Moving Fore") : dy < 0 ? "Moving to Port" : "Moving to Starboard";
}
function readings(t) {
  const I = cur;
  const [w, c, s] = stateOf(I, t);
  if (w !== word) { word = w; subTxt = s; swap([state, sub], () => { L.set(state, w); L.set(sub, s); fg(state, c); placeSub(); }); }
  else if (s !== subTxt) { subTxt = s; swap([sub], () => L.set(sub, s)); }
  // top readings
  L.set(rFix.v, I.fi);
  L.set(rTime.v, t < I.tDet ? "00:00" : mmss(Math.min(t, I.tSD) - I.tDet)); rTime.place();
  // contact
  const vis = visAt(I, t), seen = vis > 0.5, live = t >= I.tDet && t < I.tSD;
  const p = posAt(I, t);
  L.set(vClass, !live ? "No Contact" : t < I.tDet + ANALYSIS ? "Analyzing" : I.prof.cls);
  L.set(vLife, !live ? "–" : seen ? I.prof.life : "No Contact");
  L.set(vMass, live && t >= I.tDet + 4 ? I.massTxt : "–");
  L.set(vVel, live && seen ? (speedAt(I, t) * MPX).toFixed(1) + " m/s" : "–");
  L.set(vHead, live && seen ? headingAt(I, t).replace("Moving ", "").replace("to ", "") : "–");
  L.set(vSec, !live ? "–" : seen ? I.secAt(p[0], p[1]) : I.lastFix ? I.secAt(I.lastFix.x, I.lastFix.y) : "–");
  let near = Infinity;
  I.teams.forEach((tm) => { if (t >= tm.td) near = Math.min(near, hyp(teamPos(tm, t), p)); });
  L.set(vNear, live && seen && near < Infinity ? Math.round(near * MPX) + " m" : "–");
  L.set(vSig, Math.round(sigAt(t)) + "%");
  // teams
  I.teams.forEach((tm, k) => {
    const r = trows[k];
    let loc = "Deck 08", st = "Standing By", eta = "–", col = "sand";
    if (t >= tm.td && t < I.tSD) {
      const q = teamPos(tm, t); loc = I.secAt(q[0], q[1]);
      if (t < tm.tm) { st = "Dispatched"; col = "ice"; } else if (t < tm.ta) { st = "Intercepting"; col = "mars"; } else { st = "In Position"; col = "white"; }
      eta = t < tm.ta ? mmss(Math.ceil(tm.ta - t)).replace(/^0/, "") : "On Site";
    } else if (t >= I.tSD) { const q = teamPos(tm, t); loc = I.secAt(q[0], q[1]); st = "Returning"; }
    L.set(r.loc, loc); L.set(r.st, st); fg(r.st, col); L.set(r.eta, eta);
  });
  const act = I.fields.filter((f) => t >= f.tOn && t < I.tSD);
  L.set(ffRow.loc, act.length ? act[act.length - 1].sec : "–");
  L.set(ffRow.st, act.length ? act.length + " Active" : "None Active"); fg(ffRow.st, act.length ? "sky" : "sand");
}
readings(0);
L.every(250, (t) => readings(t), 0);

// the log moves one line at a time: the oldest fades, the rest slide up, the new one fades in
let logAnim = null;
const stepLog = (t) => {
  if (!logAnim) { if (!pendingLog.length) return; logAnim = { phase: "fade", t0: t, row: logRows.find((r) => r.slot === 0) }; }
  const u = t - logAnim.t0, r0 = logAnim.row;
  if (logAnim.phase === "fade") {
    op(r0.e, 1 - L.clamp(u / 0.5));
    if (u >= 0.5) logAnim = { phase: "slide", t0: t, row: r0 };
  } else if (logAnim.phase === "slide") {
    const k = L.ease(L.clamp(u / 0.8));
    logRows.forEach((r) => { if (r.slot > 0) L.move(r.e, 0, (r.slot - k) * LPH); });
    if (k >= 1) {
      logRows.forEach((r) => (r.slot = r === r0 ? LN - 1 : r.slot - 1));
      showLog(r0, pendingLog.shift()); L.move(r0.e, 0, (LN - 1) * LPH);
      logAnim = { phase: "in", t0: t, row: r0 };
    }
  } else {
    op(r0.e, L.clamp(u / 0.6));
    if (u >= 0.6) logAnim = null;
  }
};

// ---------------- every frame ----------------
const pt = (x, y, r = 0) => `translate3d(${(x).toFixed(1)}px,${(y).toFixed(1)}px,0)` + (r ? ` scale(${r.toFixed(3)})` : "");
L.tick((t) => {
  if (t >= cur.tEnd) { prevI = cur; cur = makeIncident(cur.tEnd, nextProf()); setup(cur, false); }
  const I = cur;
  while (I.fi < I.fixes.length && I.fixes[I.fi].t <= t) drawFix(I, I.fixes[I.fi++]);
  while (I.ei < I.events.length && I.events[I.ei].A <= t) logEvent(I.events[I.ei++]);
  const vis = visAt(I, t), p = posAt(I, t);
  // the intruder: a pulsing ring (a phased one flickers gently)
  tf(mk, pt(p[0] - PX0, p[1] - PY0));
  op(mk, vis * (I.prof.phase ? 0.72 + 0.28 * Math.sin(t * 2.1) : 1));
  tf(mkRing, `scale(${(0.92 + 0.1 * Math.sin(t * 3)).toFixed(3)})`);
  // first sighting: a ring opens out from it
  const up = (t - I.tDet) / 1.6;
  if (up >= 0 && up <= 1) { const o = I.origin; tf(pingL, pt(o.sx - PX0, o.sy - PY0, 0.4 + 2 * up)); op(pingL, 1 - up); } else op(pingL, 0);
  // contact lost: the estimate of where it might be grows from the last fix
  const w = I.losses.find((x) => t >= x.l0 && t < x.l1 + 0.6);
  if (w && I.lastFix) {
    const k = L.clamp((t - w.l0) / (w.l1 - w.l0));
    tf(estL, pt(I.lastFix.x - PX0, I.lastFix.y - PY0, 0.7 + 1.1 * k)); op(estL, 1 - vis);
  } else op(estL, 0);
  // the section it is in glows faintly
  const room = vis > 0.05 ? roomAt(p[0], p[1]) : null;
  const ta = tints.find((x) => x.on);
  if ((ta ? ta.room : null) !== room) {
    if (ta) { ta.from = ta.cur || 0; ta.on = false; ta.t0 = t; }
    if (room) {
      const tn = tints.find((x) => x !== ta);
      tn.room = room; tn.on = true; tn.t0 = t; tn.from = 0;
      tf(tn.e, `translate3d(${room.x}px,${room.y}px,0) scale(${room.w / 100},${room.h / 100})`);
    }
  }
  tints.forEach((tn) => {
    tn.cur = tn.on ? L.mix(tn.from, 1, L.clamp((t - tn.t0) / 0.6)) : tn.from * (1 - L.clamp((t - tn.t0) / 0.6));
    op(tn.e, tn.cur * Math.min(1, vis * 1.2));
  });
  // teams
  I.teams.forEach((tm, k) => {
    const e = teamEls[k];
    if (t < tm.td) { op(e, 0); return; }
    const q = teamPos(tm, t);
    tf(e, pt(q[0] - PX0, q[1] - PY0));
    op(e, L.clamp((t - tm.td) / 0.6) * (1 - L.clamp((t - I.tSD) / 1.6)));
  });
  // force fields and the hold on the room
  const off = 1 - L.clamp((t - I.tSD) / 1.2);
  fieldEls.forEach((f, i) => { const d = I.fields[i]; op(f, d ? L.clamp((t - d.tOn) / 0.5) * off : 0); });
  op(holdL, L.clamp((t - I.tCont) / 0.8) * off);
  op(trailL, 1 - L.clamp((t - I.tSD) / 2));
  // the internal sensor sweep crosses the plan
  const su = ((t + SWEEP_OFF) % SWEEP_PER) / SWEEP_PASS;
  if (su < 1) {
    const lead = su * (PX1 - PX0);
    tf(band, `translate3d(${(lead - BANDW).toFixed(1)}px,0,0)`);
    op(band, Math.min(1, lead / 120, (PX1 - PX0 - lead) / 160));
  } else op(band, 0);
  // the sweeps panel
  const anyonOn = !!I.prof.phase && t >= I.tCont && t < I.tSD;
  SWEEPS.forEach((s) => {
    let u;
    if (s.anyon) {
      if (anyonOn || s.u > 0) { s.u += 1 / 30 / s.per; if (s.u >= 1) { s.u = anyonOn ? s.u - 1 : 0; s.n++; } }
      u = (s.u * s.per) / s.pass;
      fg(s.nameEl, anyonOn ? "white" : "#7d8a99");
    } else {
      const ph = t + s.off;
      u = (ph % s.per) / s.pass;
      s.n = s.n0 + Math.floor((ph - s.pass) / s.per) + 1;
    }
    if (u > 0 && u < 1) {
      tf(s.seg, `translate3d(${(u * (SBAR[1] - SBAR[0] - SEGW)).toFixed(1)}px,0,0)`);
      op(s.seg, Math.min(1, u / 0.08, (1 - u) / 0.08));
    } else op(s.seg, 0);
    L.set(s.nEl, s.anyon && !anyonOn && s.u === 0 ? "Standby" : s.n);
  });
  // signature comparison
  const best = I.prof.match.indexOf(Math.max(...I.prof.match)), classified = t >= I.tDet + ANALYSIS && t < I.tSD;
  cmp.forEach((c, k) => {
    const v = matchAt(I, k, t);
    scaleX(c.bar, v / 100); L.set(c.pct, Math.round(v) + "%");
    const hi = classified && k === best;
    fg(c.name, hi ? "white" : "sand"); bg(c.bar, hi ? "mars" : "ice");
  });
  // the signal trace
  if (!filled) {
    filled = true; written = 0; tiles[0].idx = -1; tiles[1].idx = 0; prevPt = null;
    tiles.forEach((tile) => tile.g.clearRect(0, 0, CWW + 8, CHH));
    const n = Math.ceil((CWW / CSPD) * 30) + 2;
    for (let i = n; i >= 0; i--) stepTrace(1 / 30, t - i / 30);
    lastT = t; placeTiles(0);
  } else {
    if (t - lastT >= 0.1) { stepTrace(Math.min(0.3, t - lastT), t); lastT = t; }
    placeTiles(Math.min(0.3, t - lastT) * CSPD);
  }
  stepLog(t);
});
});
</script></body></html>
