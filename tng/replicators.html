<!doctype html>
<html><head><meta charset="utf-8"><title>Replicator Systems</title>
<link rel="stylesheet" href="../lcars.css">
<style>
  /* text that is swapped fades out and back in; colors change slowly; .boot (the start-up cascade) always wins */
  .sw { transition: opacity .45s ease, background-color 1.2s ease, color 1.2s ease; }
  .out:not(.boot) { opacity: .25; }   /* a row dips while its order changes, never goes empty */
  .cell { transition: opacity .8s ease; }
  .seg { transition: transform 1.4s cubic-bezier(.45, 0, .55, 1); }
  .clip { overflow: hidden; }
</style></head>
<body><script src="../lcars.js"></script><script>
"use strict";
const L = LCARS;
L.ready(() => {

// ---------------- the frame: sidebar left, title top right ----------------
const BAR = 64;
L.title({ x: 3700, y: 40, h: BAR, c: "peach", txt: "Replicator Systems  •  Food and Matter Synthesis" });
// (L.title measures with a canvas, which sets this line ~11px wider than the page draws it; use the page's own width)
const titleLeft = 3700 - document.querySelector("[data-title]").offsetWidth;
L.box({ x: 3724, y: 40, w: 92, h: BAR, c: "pink", r: "r" });
L.elbow({ corner: "tl", x: 40, y: 40, w: 1360, h: 250, bw: 240, bh: BAR, R: 150, r: 60, c: "pink" });
L.rect({ x: 1400 + L.GAP, y: 40, w: 300, h: BAR, c: "butter" });
L.rect({ x: 1724 + L.GAP, y: 40, w: titleLeft - L.GAP - (1724 + L.GAP), h: BAR, c: "pink" });
[[298, 140, "lilac", "Rep 10"], [446, 70, "butter", "Food"], [524, 420, "pink", "Network"], [952, 70, "peach", "Matter"],
 [1030, 300, "lilac", "Patterns"], [1338, 70, "butter", "Energy"], [1416, 216, "pink", "Reclaim"]]
  .forEach(([y, h, c, label]) => L.box({ x: 40, y, w: 240, h, c, label }));
L.elbow({ corner: "bl", x: 40, y: 1640, w: 1500, h: 480, bw: 240, bh: BAR, R: 150, r: 60, c: "lilac" });
L.text({ x: 258, base: 1712, s: 40, c: "#000", txt: "Synthesis", align: "r", on: true });
[[1540 + L.GAP, 600, "pink"], [2164 + L.GAP, 900, "butter"], [3088 + L.GAP, 3700 - (3088 + L.GAP), "lilac"]]
  .forEach(([x, w, c]) => L.rect({ x, y: 2056, w, h: BAR, c }));
L.box({ x: 3724, y: 2056, w: 92, h: BAR, c: "pink", r: "r" });

// a section header: a rounded box and a bar to the column's edge; returns where the bar starts
const header = (x, y, w, label, c1, c2, h = 56, fs = 32, lw) => {
  lw = lw || Math.round((L.textWidth(label, fs) + 64) / 10) * 10;
  L.box({ x, y, w: lw, h, c: c1, label, fs, r: "l" });
  L.rect({ x: x + lw + L.GAP, y, w: w - lw - L.GAP, h, c: c2 });
  return x + lw + L.GAP;
};
const small = (x, y, w, label, c1, c2, lw) => header(x, y, w, label, c1, c2, 48, 28, lw);
const fill = (x, y, w, h, c, origin = "0 0", parent) => {
  const f = L.layer({ x, y, w, h }, parent);
  f.style.background = c.startsWith("#") ? c : `var(--${c})`; f.style.transformOrigin = origin;
  return f;
};
const cls = (e, ...c) => (e.classList.add(...c), e);
// write only what changed: an unchanged reading costs nothing
const put = (e, txt) => { if (e.textContent !== txt) e.textContent = txt; };
const tf = (e, v) => { if (e._tf !== v) { e._tf = v; e.style.transform = v; } };
const op = (e, v) => { v = v.toFixed(2); if (e._op !== v) { e._op = v; e.style.opacity = v; } };
const bg = (e, c) => { if (e._bg !== c) { e._bg = c; e.style.background = c.startsWith("#") ? c : `var(--${c})`; } };
const fg = (e, c) => { if (e._fg !== c) { e._fg = c; e.style.color = c.startsWith("#") ? c : `var(--${c})`; } };
const fmt = (n) => Math.round(n).toLocaleString("en");
const D2 = (d) => String(d).padStart(2, "0");
const later = (ms, f, jitter) => L.every(ms, (t) => { if (t > 1) f(t); }, jitter);   // not at once: first after a while

// Columns: left 330–1530, middle 1590–2730 (the synthesis chamber), right 2790–3816.
const LX = 330, LR = 1530, MX = 1590, MR = 2730, RX = 2790, RR = 3816;
const ROW0 = 428, PITCH = 88, rowBase = (i) => ROW0 + i * PITCH + 52.5;   // rows of 64 on an 88 grid, left and right
const TRACK = "#2a1a30";                                                   // the dark of an empty gauge

// ---------------- what the ship asks for ----------------
// The six stocks a replicator draws on, in the order of the reserves table and every composition.
const MATTER = [["Water", "lilac", "Water"], ["Organic Suspension", "peach", "Organic"], ["Carbon Polymer", "plum", "Carbon"],
                ["Silicates", "pink", "Silicate"], ["Metallic Stock", "butter", "Metal"], ["Trace Elements", "tan", "Trace"]];
const FOOD = ["Ten Forward 1", "Ten Forward 3", "Quarters 0812", "Quarters 0901", "Quarters 1704", "Quarters 2511",
              "Quarters 0603", "Crew Lounge", "Observation Lounge"];
const DECK = { "Ready Room": 1, "Observation Lounge": 1, "Ten Forward 1": 10, "Ten Forward 3": 10, "Crew Lounge": 15,
  "Sickbay": 12, "Main Engineering": 36, "Replicator Shop": 27, "Security Office": 8, "Battle Bridge": 8,
  "Schoolroom 4": 18, "Stellar Cartography": 4 };
const deckOf = (loc) => DECK[loc] || +loc.slice(-4, -2);
// [order, shape, composition by mass %, kg, served at, how often, pattern, gradient top/bottom, liquid, returned as, where]
const ITEMS = [
  ["Tea, Earl Grey, hot", "cup", [60, 4, 0, 34, 0, 2], 0.46, "68 °C", 14, "31-0417", ["white", "lilac"], "#7a3f16", "Teacup and saucer", ["Ready Room", "Ready Room", ...FOOD]],
  ["Raktajino", "mug", [56, 8, 0, 34, 0, 2], 0.52, "74 °C", 12, "31-2209", ["peach", "plum"], "#3a2012", "Mug", ["Security Office", "Battle Bridge", ...FOOD]],
  ["Coffee, black", "mug", [58, 6, 0, 34, 0, 2], 0.50, "71 °C", 10, "31-0388", ["butter", "peach"], "#2a170c", "Mug", FOOD],
  ["Plomeek soup", "bowl", [54, 16, 0, 28, 0, 2], 0.74, "71 °C", 8, "22-1146", ["pink", "plum"], "#c9692a", "Soup bowl", FOOD],
  ["Chocolate sundae", "sundae", [22, 46, 0, 30, 0, 2], 0.58, "-11 °C", 6.5, "48-0912", ["pink", "lilac"], "", "Sundae glass", ["Schoolroom 4", ...FOOD]],
  ["Synthehol, Saurian brandy", "bottle", [46, 6, 0, 46, 0, 2], 0.98, "14 °C", 5, "39-5521", ["lilac", "plum"], "", "Bottle, empty", ["Ten Forward 1", "Ten Forward 3", "Crew Lounge"]],
  ["Prune juice", "glass", [66, 10, 0, 22, 0, 2], 0.38, "6 °C", 3.2, "31-7740", ["peach", "pink"], "#3b1228", "Glass", ["Security Office", "Ten Forward 1", "Quarters 0712"]],
  ["Hot chocolate", "mug", [60, 8, 0, 30, 0, 2], 0.54, "66 °C", 3, "31-1023", ["pink", "peach"], "#4a2616", "Mug", ["Schoolroom 4", ...FOOD]],
  ["Gagh", "bowl", [14, 58, 0, 0, 26, 2], 0.86, "9 °C", 1.6, "56-0081", ["butter", "tan"], "#5a3a2a", "Serving bowl", ["Quarters 0712", "Security Office", "Ten Forward 3"]],
  ["Rokeg blood pie", "pie", [12, 60, 0, 26, 0, 2], 0.92, "62 °C", 1.4, "56-0213", ["peach", "tan"], "", "Pie dish", ["Quarters 0712", "Ten Forward 3"]],
  ["Spare isolinear chip", "chip", [0, 0, 4, 66, 26, 4], 0.03, "21 °C", 1.8, "07-4410", ["lilac", "pink"], "", "Isolinear chip, fused", ["Main Engineering", "Replicator Shop", "Stellar Cartography"]],
  ["Uniform, size 4", "uniform", [0, 14, 78, 0, 4, 4], 1.12, "21 °C", 1.5, "12-0604", ["butter", "peach"], "", "Uniform, worn", ["Quarters 0812", "Quarters 1704", "Quarters 2511", "Quarters 0603"]],
  ["Hypospray cartridge", "cartridge", [40, 10, 0, 22, 26, 2], 0.06, "4 °C", 1.2, "18-3307", ["lilac", "butter"], "", "Cartridge, spent", ["Sickbay"]],
].map(([name, shape, comp, kg, temp, w, pat, grad, liquid, ret, where]) => ({ name, shape, comp, kg, temp, w, pat, grad, liquid, ret, where }));
const pickItem = () => {
  let r = Math.random() * ITEMS.reduce((a, it) => a + it.w, 0), i = 0;
  while ((r -= ITEMS[i].w) > 0) i++;
  return ITEMS[i];
};

// ---------------- status line ----------------
const STATE = "Replicators Online";
L.text({ x: LX, cap: 150, s: 100, c: "pink", txt: STATE });
const stateSub = L.text({ x: MX, base: 222, s: 38, c: "peach", txt: "" });          // on the chamber column's line
L.box({ x: RR - 400, y: 150, w: 400, h: 72, c: "lilac", label: "Network Nominal", r: "lr", fs: 36 });

// ---------------- the cycle of one order ----------------
// Pattern retrieval 0–3 s, matter conversion 3–6.5 s, materialization 6.5–10 s, then complete.
const STAGES = [[0, 3, "Pattern", "lilac"], [3, 6.5, "Converting", "pink"], [6.5, 10, "Materializing", "butter"]];
const DONE = 10, HOLD = 11.6, GONE = 12.2;                 // the chamber holds the finished object, then clears
const stageAt = (u) => (u < 3 ? 0 : u < 6.5 ? 1 : u < DONE ? 2 : 3);

// ---------------- active replicators ----------------
const ORDX = header(LX, 280, LR - LX, "Active Replicators", "pink", "lilac", 56, 32, 300);   // 654: the order column
const SEGX = 1040, SEGW = 60, SEGG = 8, PILLX = 1280;
[["Replicator", LX], ["Order", ORDX], ["Stage", PILLX]].forEach(([txt, x]) => L.text({ x, base: 400, s: 36, c: "lilac", txt }));
L.text({ x: SEGX + (3 * SEGW + 2 * SEGG) / 2, base: 400, s: 36, c: "lilac", txt: "Progress", align: "c", w: 3 * SEGW + 2 * SEGG });   // centred on its gauges
const slots = Array.from({ length: 6 }, (_, i) => {
  const y = ROW0 + i * PITCH, base = rowBase(i);
  const loc = L.box({ x: LX, y, w: 300, h: 64, c: "lilac", label: "", fs: 32, r: "l", cls: "sw" });
  const item = L.text({ x: ORDX, base, s: 40, c: "white", txt: "", cls: "sw" });
  const segs = STAGES.map(([, , , c], k) => {
    const x = SEGX + k * (SEGW + SEGG);
    L.rect({ x, y: base - 26, w: SEGW, h: 26, c: TRACK });
    return cls(fill(x, base - 26, SEGW, 26, c), "sw");
  });
  const pill = L.box({ x: PILLX, y, w: LR - PILLX, h: 64, c: "lilac", label: "", fs: 32, r: "lr", cls: "sw" });
  return { i, loc, item, segs, pill, order: null, t0: 0, linger: 0, phase: "run", fadeT: 0, stage: -2, done: false, mon: false };
});
const rowEls = (s) => [s.loc, s.item, s.pill, ...s.segs];

// ---------------- the synthesis chamber ----------------
header(MX, 280, MR - MX, "Matter Synthesis", "butter", "pink");
const monLoc = cls(L.text({ x: MX, base: 400, s: 40, c: "butter", txt: "" }), "sw");
const monNum = cls(L.text({ x: MR, base: 400, s: 40, c: "peach", txt: "", align: "r" }), "sw");
const CHAMBER = "#170e1d", ALCOVE = "#22152b";
L.rect({ x: MX, y: 428, w: MR - MX, h: 732, c: CHAMBER, panel: true });
const OBJ = { x: 1900, y: 532, w: 520, h: 566 };          // the alcove; the object stands on its floor
const OW = OBJ.w, OH = OBJ.h, MAXW = 450, MAXH = 500, K = 0.24;   // K: how far down we look at it
L.svg("rect", { x: OBJ.x, y: OBJ.y, width: OBJ.w, height: OBJ.h, fill: ALCOVE, class: "boot" });
L.svg("rect", { x: OBJ.x - 20, y: OBJ.y - 22, width: OBJ.w + 40, height: 10, rx: 5, fill: "#4a3058", class: "boot" });   // emitter
L.svg("rect", { x: OBJ.x - 20, y: OBJ.y + OBJ.h + 8, width: OBJ.w + 40, height: 16, rx: 8, fill: "#4a3058", class: "boot" });  // pad
const padGlow = fill(OBJ.x - 20, OBJ.y + OBJ.h + 8, OBJ.w + 40, 16, "butter");
padGlow.style.borderRadius = "8px"; padGlow.style.opacity = 0;
const emitGlow = fill(OBJ.x - 20, OBJ.y - 22, OBJ.w + 40, 10, "lilac");
emitGlow.style.borderRadius = "5px"; emitGlow.style.opacity = 0;
const monName = cls(L.text({ x: 2160, base: 492, s: 52, c: "white", txt: "", align: "c", w: 1000 }), "sw");
// four readings either side of the alcove
const SIDE = [["Layer", 1630, ""], ["Mass", 1630, ""], ["Serve At", 1630, ""], ["Resolution", 1630, ""],
              ["Pattern", 2690, "r"], ["Energy", 2690, "r"], ["Matter Stream", 2690, "r"], ["Phase Variance", 2690, "r"]];
const side = SIDE.map(([name, x, align], i) => {
  const k = i % 4;
  L.text({ x, base: 492 + k * 150, s: 40, c: "lilac", txt: name, align });
  return L.text({ x, base: 554 + k * 150, s: 52, c: "white", txt: "", align });
});
put(side[3], "Molecular");

// The object: a solid (revealed from the floor up by lifting a cover the alcove's colour), the bright
// pattern wireframe over it, and a canvas of glints for the matter stream.
const NS = "http://www.w3.org/2000/svg";
const svgIn = (parent) => {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", `0 0 ${OW} ${OH}`); s.setAttribute("width", OW); s.setAttribute("height", OH);
  Object.assign(s.style, { position: "absolute", left: "0", top: "0", overflow: "visible" });
  parent.appendChild(s); return s;
};
const clip = L.layer({ x: OBJ.x, y: OBJ.y, w: OW, h: OH, cls: "clip" });
const solidSvg = svgIn(clip);
const cover = L.el("div", "layer", clip, { left: 0, top: 0, width: OW + "px", height: OH + 40 + "px", background: ALCOVE });
const front = L.el("div", "layer", clip, { left: 0, top: 0, width: OW + "px", height: "6px",
  background: "linear-gradient(to right, rgba(255,204,102,0), rgba(255,204,102,.95) 18%, rgba(255,240,210,1) 50%, rgba(255,204,102,.95) 82%, rgba(255,204,102,0))" });
front.style.transformOrigin = "50% 50%"; front.style.opacity = 0;
const wire = L.layer({ x: OBJ.x, y: OBJ.y, w: OW, h: OH });
const wireSvg = svgIn(wire);
wireSvg.style.color = "var(--lilac)"; wire.style.opacity = 0;
const sparkL = L.layer({ x: OBJ.x, y: OBJ.y, w: OW, h: OH });
const spark = L.canvas({ x: 0, y: 0, w: OW, h: OH }, sparkL);
const scan = L.layer({ x: OBJ.x, y: OBJ.y, w: OW, h: 4 });
scan.style.background = "linear-gradient(to right, rgba(199,160,216,0), rgba(199,160,216,.9) 15%, rgba(199,160,216,.9) 85%, rgba(199,160,216,0))";
scan.style.opacity = 0;

solidSvg.innerHTML = `<defs>
  <linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="${OH}">
    <stop id="rg0" offset="0"/><stop id="rg1" offset="1"/></linearGradient>
  <linearGradient id="rs" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".42"/><stop offset=".3" stop-color="#fff" stop-opacity=".14"/>
    <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
</defs>`;
const f1 = (v) => v.toFixed(1);
const ARC = (cx, y, r, front) => `M${f1(cx - r)},${f1(y)} A${f1(r)},${f1(r * K)} 0 0 ${front ? 0 : 1} ${f1(cx + r)},${f1(y)}`;
// a turned object, from its profile: [height, radius] from the foot up
function lathe(P, o = {}) {
  const H = P[P.length - 1][0], R = Math.max(...P.map((p) => p[1])), hx = o.handle ? o.handle[2] : 0;
  const s = Math.min(MAXW / (2 * R + hx), MAXH / (H + 2 * R * K));
  const cx = OW / 2 - (hx * s) / 2, Y0 = OH - 8 - P[0][1] * s * K, y = (h) => Y0 - h * s;
  const r = (h) => {
    for (let i = 1; i < P.length; i++) if (h <= P[i][0]) {
      const [h0, r0] = P[i - 1], [h1, r1] = P[i];
      return (r0 + ((r1 - r0) * (h - h0)) / Math.max(1e-6, h1 - h0)) * s;
    }
    return P[P.length - 1][1] * s;
  };
  // the solid: the cross-sections at every turn of the profile, and the outline between them
  let body = `M${f1(cx - P[0][1] * s)},${f1(y(0))}`;
  for (const [h, rr] of P) body += ` L${f1(cx - rr * s)},${f1(y(h))}`;
  const rT = P[P.length - 1][1] * s;
  if (rT > 0.5) body += ` A${f1(rT)},${f1(rT * K)} 0 0 1 ${f1(cx + rT)},${f1(y(H))}`;
  for (let i = P.length - 1; i >= 0; i--) body += ` L${f1(cx + P[i][1] * s)},${f1(y(P[i][0]))}`;
  const r0 = P[0][1] * s;
  body += ` A${f1(r0)},${f1(r0 * K)} 0 0 1 ${f1(cx - r0)},${f1(y(0))} Z`;
  const discs = P.filter((p) => p[1] > 0).map(([h, rr]) =>
    `<ellipse cx="${f1(cx)}" cy="${f1(y(h))}" rx="${f1(rr * s)}" ry="${f1(rr * s * K)}"/>`).join("");
  let handle = "";
  if (o.handle) {
    const [ha, hb] = o.handle, xr = cx + R * s + hx * s * 0.8;
    handle = `M${f1(cx + r(ha) - 4)},${f1(y(ha))} C${f1(xr)},${f1(y(ha))} ${f1(xr)},${f1(y(hb))} ${f1(cx + r(hb) - 4)},${f1(y(hb))}`;
  }
  // the pattern: layers (cross-sections) and meridians
  const hs = [...new Set([...P.map((p) => p[0]), ...Array.from({ length: 15 }, (_, i) => (H * i) / 14)])].sort((a, b) => a - b);
  let backs = "", fronts = "", mer = "";
  for (const h of hs) { const rr = r(h); if (rr < 1) continue; backs += ARC(cx, y(h), rr, false); fronts += ARC(cx, y(h), rr, true); }
  for (const th of [-90, -60, -30, 0, 30, 60, 90]) {
    const sn = Math.sin((th * Math.PI) / 180), cs = Math.cos((th * Math.PI) / 180);
    mer += hs.map((h, i) => `${i ? "L" : "M"}${f1(cx + r(h) * sn)},${f1(y(h) + r(h) * K * cs)}`).join("");
  }
  const top = o.open ? `<ellipse cx="${f1(cx)}" cy="${f1(y(H))}" rx="${f1(rT)}" ry="${f1(rT * K)}" fill="url(#rg)"/>
    <ellipse class="liq" cx="${f1(cx)}" cy="${f1(y(H) + rT * K * 0.18)}" rx="${f1(rT * 0.86)}" ry="${f1(rT * K * 0.8)}"/>` : "";
  return {
    solid: (handle ? `<path d="${handle}" fill="none" stroke="url(#rg)" stroke-width="${f1(20 * s)}" stroke-linecap="round"/>` : "") +
      `<g fill="url(#rg)">${discs}<path d="${body}"/></g><path d="${body}" fill="url(#rs)"/>${top}
      <path d="${fronts}${mer}" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="2"/>`,
    wire: `<path d="${backs}" opacity=".32"/><path d="${fronts}${mer}${handle}"/>`,
    top: y(H) - rT * K - 2, y0: OH - 8, hpx: OH - 8 - (y(H) - rT * K),
    yAt: (hf) => y(hf * H), span: (hf) => [cx - r(hf * H), cx + r(hf * H)], ry: (hf) => r(hf * H) * K,
  };
}
// a block (a chip standing on edge, a folded uniform), seen from a little above and to the left
function block(w, d, h, o = {}) {
  const dx = d * 0.55, dy = d * 0.32, s = Math.min(MAXW / (w + dx), MAXH / (h + dy));
  const W = w * s, D = dx * s, E = dy * s, HH = h * s, x0 = OW / 2 - (W + D) / 2, Y0 = OH - 8;
  const P = (pts) => "M" + pts.map(([a, b]) => `${f1(a)},${f1(b)}`).join(" L") + " Z";
  const frontF = P([[x0, Y0], [x0 + W, Y0], [x0 + W, Y0 - HH], [x0, Y0 - HH]]);
  const sideF = P([[x0 + W, Y0], [x0 + W + D, Y0 - E], [x0 + W + D, Y0 - E - HH], [x0 + W, Y0 - HH]]);
  const topF = P([[x0, Y0 - HH], [x0 + W, Y0 - HH], [x0 + W + D, Y0 - HH - E], [x0 + D, Y0 - HH - E]]);
  let lines = "";
  for (let i = 1; i < 14; i++) { const yy = Y0 - (HH * i) / 14; lines += `M${f1(x0)},${f1(yy)} H${f1(x0 + W)} L${f1(x0 + W + D)},${f1(yy - E)}`; }
  for (let i = 1; i < 4; i++) { const xx = x0 + (W * i) / 4; lines += `M${f1(xx)},${f1(Y0)} V${f1(Y0 - HH)} L${f1(xx + D)},${f1(Y0 - HH - E)}`; }
  for (let i = 1; i < 3; i++) { const k = i / 3; lines += `M${f1(x0 + D * k)},${f1(Y0 - HH - E * k)} H${f1(x0 + W + D * k)}`; }
  const edges = frontF + sideF + topF;
  const back = `M${f1(x0)},${f1(Y0)} L${f1(x0 + D)},${f1(Y0 - E)} H${f1(x0 + W + D)} M${f1(x0 + D)},${f1(Y0 - E)} V${f1(Y0 - E - HH)}`;
  let extra = "";
  if (o.chip) extra = `<rect x="${f1(x0 + W * 0.1)}" y="${f1(Y0 - HH * 0.13)}" width="${f1(W * 0.8)}" height="${f1(HH * 0.07)}" fill="var(--butter)"/>
    <path d="M${f1(x0 + W * 0.3)},${f1(Y0 - HH * 0.2)} V${f1(Y0 - HH * 0.75)} M${f1(x0 + W * 0.5)},${f1(Y0 - HH * 0.2)} V${f1(Y0 - HH * 0.85)} M${f1(x0 + W * 0.7)},${f1(Y0 - HH * 0.2)} V${f1(Y0 - HH * 0.65)}" stroke="#000" stroke-opacity=".3" stroke-width="5"/>`;

  drawSparks(t, dt, amt, u >= 6.5 ? L.clamp((G.y0 - yF) / G.hpx) : null);
  // the stages
  const st = stageAt(u);
  stageBox.forEach((b, i) => {
    const s = i < st ? "done" : i === st ? "on" : "";
    if (s !== b.state) { b.state = s; bg(b.b, s === "done" ? "pink" : s === "on" ? "butter" : "#3a2646"); fg(b.b, s ? "#000" : "lilac"); }
    tf(b.bar, `scaleX(${L.clamp((u - STAGES[i][0]) / (STAGES[i][1] - STAGES[i][0])).toFixed(3)})`);
  });
  // then it is held, faded, and the chamber waits for the next order
  if (u >= HOLD) {
    op(clip, 1 - L.clamp((u - HOLD) / (GONE - HOLD)));
    if (!monName.classList.contains("out")) [monName, monLoc, monNum].forEach((e) => e.classList.add("out"));
  }
  if (u >= GONE) { mon.s.mon = false; if (mon.s.order === mon.o) bg(mon.s.loc, "lilac"); op(clip, 0); drawSparks(t, dt, 0, null); mon.done = true; }
};
const chamberText = (t) => {
  if (!mon) return;
  const u = t - mon.t0, it = mon.it, k = L.clamp((u - 6.5) / 3.5), kf = k * k * (3 - 2 * k);
  const active = u > 0 && u < DONE;
  put(side[0], `${Math.round(kf * 240)} of 240`);
  put(side[1], (kf * it.kg).toFixed(2) + " kg");
  put(side[5], (mon.o.energy * L.clamp((u - 3) / 3.5) + (u > 0 ? 0.04 * Math.min(u, 3) : 0)).toFixed(2) + " MJ");
  put(side[6], active ? Math.round(u < 3 ? 8 : u < 6.5 ? 64 + 4 * Math.sin(t) : 38 + 4 * Math.sin(t)) + "%" : "0%");
  put(side[7], active ? (0.0028 + 0.0006 * Math.sin(t * 0.9) + 0.0002 * Math.sin(t * 2.3)).toFixed(4) : "0.0000");
};

// ---------------- the starting state ----------------
showTop();
[[-1.5, "run"], [-4.4, "run"], [-7.6, "run"], [-12.5, "run"], [-15.2, "run"], [-18.4, "run"]].forEach(([t0], i) => {
  const s = slots[i]; fillSlot(s, newOrder(), t0); decks[deckOf(s.order.loc) - 1].bump = 0;
  s.linger = L.rand(5, 10);
});
monitor(slots[0]);
[["Tea, Earl Grey, hot  ·  Ready Room", 0.46], ["Plomeek soup  ·  Quarters 0901", 0.74], ["Raktajino  ·  Security Office", 0.52],
 ["Spare isolinear chip  ·  Main Engineering", 0.03], ["Chocolate sundae  ·  Schoolroom 4", 0.58], ["Synthehol, Saurian brandy  ·  Ten Forward 3", 0.98]]
  .forEach(([txt, kg]) => logLine(txt, kg.toFixed(2) + " kg"));
[ITEMS[0], ITEMS[3], ITEMS[11], ITEMS[5]].forEach((it, i) => startJob(reclaim[i], retOf(it, L.pick(it.where)), L.rand(0.1, 0.8)));

// ---------------- the clock ----------------
let tPrev = null;
L.tick((t) => {
  const dt = tPrev === null ? 0 : Math.min(0.1, t - tPrev); tPrev = t;
  for (const s of slots) {                                  // each replicator through its order
    const u = t - s.t0;
    if (s.phase === "run") {
      const k = stageAt(u);
      if (k !== s.stage && u >= 0) showStage(s, k);
      s.segs.forEach((e, i) => tf(e, `scaleX(${L.clamp((u - STAGES[i][0]) / (STAGES[i][1] - STAGES[i][0])).toFixed(3)})`));
      if (u >= DONE && !s.done) complete(s, t, u > DONE + 1);
      if (u >= DONE + s.linger && !s.mon) { s.phase = "fade"; s.fadeT = t; rowEls(s).forEach((e) => e.classList.add("out")); }
    } else if (s.phase === "fade" && t - s.fadeT >= 0.45) { // swapped at the bottom of the dip, then back up
      fillSlot(s, newOrder(), t + 0.6);
      rowEls(s).forEach((e) => e.classList.remove("out"));
    }
  }
  if (mon && mon.done) mon = null;
  if (!mon) {                                               // watch the next order to begin
    const s = slots.find((s) => s.phase === "run" && t - s.t0 > -0.6 && t - s.t0 < 0.3);
    if (s) monitor(s);
  }
  chamber(t, dt);
  for (const r of reserves) {                               // the gauges follow their stocks
    if (Math.abs(r.lvl - r.u) < 0.0004 && r.drawn) continue;
    r.u += (r.lvl - r.u) * Math.min(1, dt * 1.2); r.drawn = true;
    tf(r.bar, `scaleX(${r.u.toFixed(4)})`);
  }
  const top = TOP[0].n * 1.06;
  topRows.forEach((r, i) => {
    const g = TOP[i].n / top;
    if (Math.abs(g - r.u) < 0.0004 && r.drawn) return;
    r.u += (g - r.u) * Math.min(1, dt * 2); r.drawn = true;
    tf(r.bar, `scaleX(${r.u.toFixed(4)})`);
  });
  for (const d of decks) {
    if (Math.abs(d.goal - d.u) < 0.02 && d.drawn) continue;
    d.u += (d.goal - d.u) * Math.min(1, dt * 0.9); d.drawn = true;
    tf(d.f, `scaleY(${(L.clamp(d.u / DMAX)).toFixed(4)})`);
  }
  for (const r of reclaim) {                                // returned things go back into stock
    if (!r.job || r.busy) continue;
    r.p = Math.min(1, r.p + dt / r.job.dur);
    if (Math.abs(r.p - r.shown) > 0.001) { r.shown = r.p; tf(r.bar, `scaleX(${r.p.toFixed(4)})`); }
    if (r.p >= 1) {
      r.busy = true; recTotal += r.job.kg; draw(r.job.comp, r.job.kg * 0.6, 1);
      const els = [r.n, r.bar, r.v];
      setTimeout(() => {
        els.forEach((e) => e.classList.add("out"));
        setTimeout(() => {
          const it = pickItem();
          startJob(r, returns.shift() || retOf(it, L.pick(it.where))); tf(r.bar, "scaleX(0)"); put(r.v, "0.00 kg");
          els.forEach((e) => e.classList.remove("out")); r.busy = false;
        }, 480);
      }, 1500);
    }
  }
});
L.every(250, (t) => {
  chamberText(t);
  reclaim.forEach((r) => { if (r.job && !r.busy) put(r.v, (r.job.kg * r.p).toFixed(2) + " kg"); });
}, 0);
L.every(1000, (t) => {
  // the stocks: drawn down by orders, refilled by reclamation and the recyclers, never far from their usual level
  const drawingNow = new Set();
  slots.forEach((s) => { if (s.phase === "run" && s.stage === 1) s.order.it.comp.forEach((p, i) => p >= 10 && drawingNow.add(i)); });
  reserves.forEach((r, i) => {
    r.lvl = L.clamp(r.lvl + (MEAN[i] - r.lvl) * 0.01, 0.3, 0.97);
    put(r.v, (r.lvl * 100).toFixed(1) + "%");
    fg(r.n, drawingNow.has(i) ? "butter" : "peach");
  });
  const busy = slots.filter((s) => s.phase === "run" && t - s.t0 >= 0 && t - s.t0 < DONE).length;
  put(stateSub, `1,246 units online  ·  ${26 + busy} orders in synthesis  ·  ${fmt(served)} served this shift`);
  let sum = 0, pk = 0;
  decks.forEach((d, i) => {
    d.bump *= Math.exp(-1 / 14);
    d.goal = d.w * (1 + 0.14 * Math.sin(t * 0.05 + d.seed) + 0.06 * Math.sin(t * 0.17 + d.seed * 2)) + d.bump;
    sum += d.goal; if (d.goal > decks[pk].goal) pk = i;
  });
  put(loadV, `Shipwide  ${fmt(sum)}  ·  Peak  Deck ${D2(pk + 1)}`);
  bufPct = L.clamp(bufPct + L.rand(-0.06, 0.06), 61.5, 63.5);
  put(bufV, `${fmt(4812 + Math.round((bufPct - 62) * 40))} patterns  ·  ${bufPct.toFixed(1)}%`);
  put(recTotV, recTotal.toFixed(1) + " kg");
  recEff = L.clamp(recEff + L.rand(-0.02, 0.02), 99.4, 99.8);
  put(recEffV, recEff.toFixed(1) + "%");
  showTop();
}, 0);
later(2600, () => { const it = pickItem(); countItem(it.name); served++; }, 0.3);     // the rest of the ship, unseen
L.every(3000, (t) => {
  const busy = slots.filter((s) => s.phase === "run" && t - s.t0 >= 0 && t - s.t0 < DONE).length;
  energy.shift(); energy.push(energy[NE - 2] * 0.5 + energyAt(t, busy) * 0.5); drawEnergy();
}, 0);
later(1700, () => {                                        // now and then a stored pattern is written or retired
  const c = L.pick(cells);
  if (c.reading) return;
  c.stored = !c.stored; showCell(c);
}, 0.4);
});
</script></body></html>
