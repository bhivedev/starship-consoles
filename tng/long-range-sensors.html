<!doctype html>
<html><head><meta charset="utf-8"><title>Long Range Sensors</title>
<link rel="stylesheet" href="../lcars.css">
<style>
  .arm { background: linear-gradient(to top, rgba(143,211,255,.25), rgba(220,240,255,.95)); transform-origin: 50% 100%; border-radius: 2px; }
  .trailL { transform-origin: 100% 100%; }
  .trailR { transform-origin: 0 100%; }
  .glow { border-radius: 50%; }
  .ml .t { text-shadow: 0 0 6px #000, 0 0 3px #000, 0 0 2px #000; }
  .ret i { position: absolute; display: block; border-color: var(--butter); border-style: solid; border-width: 0; width: 26px; height: 26px; }
  .cursor { background: linear-gradient(to right, rgba(143,211,255,0), rgba(220,240,255,.75)); }
  .bar { transform-origin: 50% 100%; transition: transform 1.4s ease, background-color 1s ease; }
  .pbar { transform-origin: 0 50%; transition: transform 1.6s ease; }
  .pill { transition: background-color 1.2s ease; }
  .proj { transform-origin: 0 50%; background: repeating-linear-gradient(to right, rgba(255,90,60,.85) 0 14px, rgba(255,90,60,0) 14px 26px); }
  .ping { border-radius: 50%; border: 3px solid var(--ice); }
</style></head>
<body><script src="../lcars.js"></script><script>
"use strict";
const L = LCARS;
L.ready(() => {

// ---------------- the frame: sidebar left, title top right ----------------
const BAR = 64;
L.title({ x: 3700, y: 40, h: BAR, c: "sky", txt: "Long Range Sensors  •  Subspace Scan" });
// (L.title measures with a canvas, which sets this line ~11px wider than the page draws it; use the page's own width)
const titleLeft = 3700 - document.querySelector("[data-title]").offsetWidth;
L.box({ x: 3724, y: 40, w: 92, h: BAR, c: "sky", r: "r" });
L.elbow({ corner: "tl", x: 40, y: 40, w: 1360, h: 250, bw: 240, bh: BAR, R: 150, r: 60, c: "blue" });
L.box({ x: 1400 + L.GAP, y: 40, w: 300, h: BAR, c: "butter", label: "LRS-4" });
L.rect({ x: 1724 + L.GAP, y: 40, w: titleLeft - L.GAP - (1724 + L.GAP), h: BAR, c: "navy" });
[[298, 140, "sky", "LRS 01"], [446, 70, "butter", "Fwd"], [524, 420, "blue", "Sweep"], [952, 70, "ice", "20 LY"],
 [1030, 300, "sky", "Contacts"], [1338, 70, "mars", "Focus"], [1416, 216, "blue", "Arrays"]]
  .forEach(([y, h, c, label]) => L.box({ x: 40, y, w: 240, h, c, label }));
L.elbow({ corner: "bl", x: 40, y: 1640, w: 1500, h: 480, bw: 240, bh: BAR, R: 150, r: 60, c: "sky" });
L.text({ x: 258, base: 1712, s: 40, c: "#000", txt: "Sensors", align: "r", on: true });
[[1540 + L.GAP, 600, "navy"], [2164 + L.GAP, 900, "ice"], [3088 + L.GAP, 3700 - (3088 + L.GAP), "blue"]]
  .forEach(([x, w, c]) => L.rect({ x, y: 2056, w, h: BAR, c }));
L.box({ x: 3724, y: 2056, w: 92, h: BAR, c: "sky", r: "r" });

const header = (x, y, w, label, c1, c2, h = 56, fs = 32) => {
  const lw = Math.round((L.textWidth(label, fs) + 64) / 10) * 10;
  L.box({ x, y, w: lw, h, c: c1, label, fs, r: "l" });
  L.rect({ x: x + lw + L.GAP, y, w: w - lw - L.GAP, h, c: c2 });
};
const div = (parent, cls, css) => L.el("div", cls, parent, Object.assign({ position: "absolute" }, css));
const put = (e, txt) => { if (e.textContent !== txt) e.textContent = txt; };   // a readout repaints only when it changes
const css = (e, k, v) => { if (e.style[k] !== v) e.style[k] = v; };
const opa = (o, v) => { if (Math.abs(v - o.op) > 0.004 || (v === 0 && o.op !== 0)) { o.op = v; o.e.style.opacity = v.toFixed(3); } };
const later = (ms, f, jitter) => L.every(ms, (t) => { if (t > 1) f(t); }, jitter);
const seeded = (s) => () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const brg = (b) => String(Math.round((b + 360) % 360)).padStart(3, "0");
const DARK = "#0c1840";

// columns: the scan 330–2330; the right column 2410–3816. Bottom strip: arrays 330–1330, interference 1410–2330, log 2410–3816
const FX = 330, FW = 2000, FY = 360, FH = 1200, RX = 2410, RR = 3816;

// ---------------- the scan: a fan looking forward along the ship's course ----------------
const CX = 1330, CY = 1500, K = 52, RANGE = 20, R = RANGE * K, SPAN = 60;
const rad = (d) => (d * Math.PI) / 180;
const pol = (b, r) => [CX + r * K * Math.sin(rad(b)), CY - r * K * Math.cos(rad(b))];   // bearing (0 = dead ahead), light-years
const toPolar = (x, y) => [(Math.atan2(x - CX, CY - y) * 180) / Math.PI, Math.hypot(x - CX, CY - y) / K];

let stardate = 46379.1;
const STATE = "Long Range Scan";
L.text({ x: 330, cap: 150, s: 100, c: "ice", txt: STATE });
const stateSub = L.text({ x: 330 + L.textWidth(STATE, 100) + 40, base: 222, s: 38, c: "sky", txt: "" });
const showSub = () => put(stateSub, `Forward sweep  ·  Course 047 mark 12  ·  Warp 6  ·  Range ${RANGE} light-years  ·  Stardate ${stardate.toFixed(1)}`);
showSub();
const pill = L.box({ x: 3416, y: 150, w: 400, h: 72, c: "sky", label: "Sensors Active", r: "lr", fs: 36, cls: "pill" });
pill.style.willChange = "opacity";
L.tick((t) => { pill.style.opacity = (0.82 + 0.18 * Math.sin(t * 1.1)).toFixed(3); });

header(FX, 280, FW, "Forward Scan  ·  Bearing 300 – 060", "sky", "blue");
L.rect({ x: FX, y: FY, w: FW, h: FH, c: "#02061a", panel: true });
{
  const g = L.svg("g", { class: "boot" });
  const defs = L.svg("defs", {}, g);
  const fanG = L.svg("radialGradient", { id: "lrFan", cx: CX, cy: CY, r: R, gradientUnits: "userSpaceOnUse" }, defs);
  [[0, "#1f3fd6", 0.16], [0.7, "#1f3fd6", 0.07], [1, "#3a6fff", 0.13]].forEach(([o, c, a]) => L.svg("stop", { offset: o, "stop-color": c, "stop-opacity": a }, fanG));
  const [lx, ly] = pol(-SPAN, RANGE), [rx, ry] = pol(SPAN, RANGE);
  L.svg("path", { d: `M${CX},${CY} L${lx},${ly} A${R},${R} 0 0 1 ${rx},${ry} Z`, fill: "url(#lrFan)" }, g);
  // the stars behind, inside the fan only
  const rnd = seeded(9021), cols = ["#5c7dff", "#3a6fff", "#8fd3ff", "#c9d6ff", "#ffffff"];
  for (let k = 0; k < 420; k++) {
    const b = (rnd() * 2 - 1) * SPAN, r = Math.sqrt(0.02 + 0.98 * rnd()) * RANGE * 0.985, [x, y] = pol(b, r);
    L.svg("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: (0.9 + rnd() ** 3 * 2).toFixed(2), fill: cols[Math.floor(rnd() * cols.length)], opacity: (0.25 + rnd() * 0.45).toFixed(2) }, g);
  }
  // bearings every 15°, the fan's edges solid
  for (let b = -SPAN; b <= SPAN; b += 15) {
    const [x, y] = pol(b, RANGE), edge = Math.abs(b) === SPAN;
    L.svg("path", { d: `M${CX},${CY} L${x.toFixed(1)},${y.toFixed(1)}`, stroke: edge ? "var(--blue)" : "#1d3cc4", "stroke-width": edge ? 4 : 2,
      "stroke-dasharray": edge ? "none" : "3 9", fill: "none" }, g);
  }
  // range arcs every 4 light-years
  for (let r = 4; r <= RANGE; r += 4) {
    const [ax, ay] = pol(-SPAN, r), [bx, by] = pol(SPAN, r), outer = r === RANGE;
    L.svg("path", { d: `M${ax.toFixed(1)},${ay.toFixed(1)} A${r * K},${r * K} 0 0 1 ${bx.toFixed(1)},${by.toFixed(1)}`, fill: "none",
      stroke: outer ? "var(--sky)" : "#1d3cc4", "stroke-width": outer ? 4 : 2, "stroke-dasharray": outer ? "none" : r % 8 ? "6 8" : "none" }, g);
  }
  // ticks round the outside, every 5°
  for (let b = -SPAN; b <= SPAN; b += 5) {
    const [x0, y0] = pol(b, RANGE + 0.1), [x1, y1] = pol(b, RANGE + (b % 15 ? 0.36 : 0.6));
    L.svg("path", { d: `M${x0.toFixed(1)},${y0.toFixed(1)} L${x1.toFixed(1)},${y1.toFixed(1)}`, stroke: "var(--sky)", "stroke-width": 3 }, g);
  }
  // the ship at the apex
  L.svg("path", { d: `M${CX - 50},${CY} A50,50 0 0 1 ${CX + 50},${CY}`, fill: "none", stroke: "var(--sky)", "stroke-width": 3 }, g);
  L.svg("path", { d: `M${CX},${CY - 30} L${CX + 19},${CY + 14} L${CX},${CY + 5} L${CX - 19},${CY + 14} Z`, fill: "var(--white)" }, g);
}
// bearing figures round the rim, range figures down the port edge
for (let b = -SPAN; b <= SPAN; b += 15) {
  const [x, y] = pol(b, RANGE + 1.25);
  L.text({ x, base: y + 11, s: 30, c: "sky", txt: brg(b), align: "c", w: 80, legend: true });
}
for (let r = 4; r <= RANGE; r += 4) {
  const [x, y] = pol(-SPAN, r);                                // just inside each arc, above the port edge
  L.text({ x: x + 32, base: y - 8, s: 30, c: "sky", txt: r + " LY", legend: true });
}
// the corners of the panel: scan figures above, readings below
const nTL = L.numbers({ x: FX + 40, y: FY + 36, s: 36, rows: 3, cols: [{ w: 110, n: 4 }, { w: 90, n: 3 }, { w: 130, n: 5, c: "butter" }], c: "sky" });
const nTR = L.numbers({ x: FX + FW - 40 - 330, y: FY + 36, s: 36, rows: 3, cols: [{ w: 130, n: 5 }, { w: 90, n: 2, c: "butter" }, { w: 110, n: 6 }], c: "sky" });
const corner = (x, xr, base, label, c = "sky") => { L.text({ x, base, s: 36, c, txt: label }); return L.text({ x: xr, base, s: 40, c: "white", txt: "", align: "r" }); };
const sweepB = corner(FX + 40, FX + 420, FY + FH - 148, "Sweep Bearing");
const sweepDir = corner(FX + 40, FX + 420, FY + FH - 94, "Sweep");
const sweepRes = corner(FX + 40, FX + 420, FY + FH - 40, "Resolution");
const shipCourse = corner(FX + FW - 420, FX + FW - 40, FY + FH - 148, "Course");
const shipSpeed = corner(FX + FW - 420, FX + FW - 40, FY + FH - 94, "Speed");
const shipCont = corner(FX + FW - 420, FX + FW - 40, FY + FH - 40, "Contacts");
put(shipCourse, "047 mark 12"); put(shipSpeed, "Warp 6"); put(sweepRes, "0.04 LY");

// ---------------- the sweep: an arm crossing the fan and back, its afterglow behind it ----------------
const TW = Math.ceil(R * Math.sin(rad(20))) + 4;
const trailBg = (side) => side === "L"
  ? "conic-gradient(from 340deg at 100% 100%, rgba(92,157,255,0) 0deg, rgba(92,157,255,.08) 10deg, rgba(143,211,255,.32) 20deg, rgba(0,0,0,0) 20deg)"
  : "conic-gradient(from 0deg at 0% 100%, rgba(143,211,255,.32) 0deg, rgba(92,157,255,.08) 10deg, rgba(92,157,255,0) 20deg, rgba(0,0,0,0) 20deg)";
// the afterglow and the arm sit in a box clipped to the fan's two edges, so the glow never spills past them at the turns
const CB = { x: CX - R - 10, y: CY - R - 10, w: 2 * R + 20, h: R + 20 };
const fanClip = L.el("div", "lc", L.stage, { left: CB.x + "px", top: CB.y + "px", width: CB.w + "px", height: CB.h + "px" });
{
  const ax = CX - CB.x, ay = CY - CB.y, dx = 2 * R * Math.sin(rad(SPAN)), dy = 2 * R * Math.cos(rad(SPAN));
  fanClip.style.clipPath = `polygon(${ax}px ${ay}px, ${ax - dx}px ${ay - dy}px, ${ax - dx}px ${ay - 3 * R}px, ${ax + dx}px ${ay - 3 * R}px, ${ax + dx}px ${ay - dy}px)`;
}
const trails = ["L", "R"].map((side) => {
  const e = L.layer({ x: (side === "L" ? CX - TW : CX) - CB.x, y: CY - R - CB.y, w: TW, h: R, cls: "trail" + side }, fanClip);
  e.style.background = trailBg(side);
  const m = `radial-gradient(circle ${R}px at ${side === "L" ? "100%" : "0%"} 100%, #000 ${R - 2}px, transparent ${R}px)`;
  e.style.webkitMaskImage = m; e.style.maskImage = m;
  e.style.opacity = 0;
  return { e, op: 0 };
});
const arm = L.layer({ x: CX - 2 - CB.x, y: CY - R - CB.y, w: 4, h: R, cls: "arm" }, fanClip);
const PERIOD = 20, KS = 0.94;
const sweepAt = (t) => (SPAN * Math.asin(KS * Math.sin((2 * Math.PI * t) / PERIOD))) / Math.asin(KS);   // a triangle wave, rounded at the turns
const VMAX = (SPAN * KS * 2 * Math.PI) / PERIOD / Math.asin(KS);

// ---------------- what the sensors see ----------------
// b: bearing (port negative), r: light-years, sig: signature strength (0–1)
const OBJ = [
  { name: "Beta Kupsic", cls: "Star  ·  Class G8 V", kind: "star", b: -40, r: 14.0, sig: 0.88, ink: "#ffd77a", size: 11, peak: 0.42 },
  { name: "FGC-1182", cls: "Star  ·  Class M3 V", kind: "star", b: 18, r: 4.6, sig: 0.71, ink: "#ff8a5c", size: 8, peak: 0.64 },
  { name: "Kappa Taurin", cls: "Star  ·  Class B2 III", kind: "star", b: 44, r: 17.8, sig: 0.94, ink: "#b4ceff", size: 13, peak: 0.16 },
  { name: "Mar Oscura", cls: "Nebula  ·  Dark Matter", kind: "nebula", b: -10, r: 13.4, sig: 0.34 },
  { name: "Anomaly 4471", cls: "Subspace Anomaly  ·  Rift", kind: "anomaly", b: 15, r: 10.8, sig: 0.57 },
  { name: "PSR-2209", cls: "Neutron Star  ·  Pulsar", kind: "pulsar", b: 23, r: 18.6, sig: 0.62 },
  { name: "C-6012", cls: "Comet  ·  Interstellar", kind: "comet", b: -50, r: 6.0, sig: 0.22 },
  { name: "Ion Storm", cls: "Ion Storm Front  ·  Class 4", kind: "storm", b: -20, r: 17.4, sig: 0.76 },
  { name: "", cls: "", kind: "vessel", b: 58, r: 17.2, sig: 0.66 },
];
OBJ.forEach((o, i) => { o.i = i; o.hitT = -99; o.sigNow = o.sig; [o.x, o.y] = pol(o.b, o.r); });
const VESSEL = OBJ[8], STORM = OBJ[7], COMET = OBJ[6];

const svgIn = (parent, w, h) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.style.position = "absolute"; s.style.left = 0; s.style.top = 0; s.style.overflow = "visible";
  parent.appendChild(s);
  return s;
};
const radial = (svg, id, stops) => {
  const d = L.svg("defs", {}, svg), g = L.svg("radialGradient", { id }, d);
  stops.forEach(([o, c, a]) => L.svg("stop", { offset: o, "stop-color": c, "stop-opacity": a }, g));
};
const FLOOR = { star: 0.4, nebula: 0.45, anomaly: 0.35, pulsar: 0.35, comet: 0.35, storm: 0.3, vessel: 0.4 };
for (const o of OBJ) {
  let w = 80, h = 80;
  if (o.kind === "nebula") { w = 440; h = 300; }
  if (o.kind === "storm") { w = 440; h = 150; }
  if (o.kind === "comet") { w = 60; h = 60; }
  o.w = w; o.h = h;
  o.g = { e: L.layer({ x: 0, y: 0, w, h }), op: -1 };
  const s = svgIn(o.g.e, w, h), cx = w / 2, cy = h / 2;
  if (o.kind === "star") {
    radial(s, "st" + o.i, [[0, o.ink, 1], [0.35, o.ink, 0.45], [1, o.ink, 0]]);
    L.svg("circle", { cx, cy, r: o.size * 3.2, fill: `url(#st${o.i})` }, s);
    L.svg("circle", { cx, cy, r: o.size * 0.75, fill: o.ink }, s);
  } else if (o.kind === "nebula") {
    radial(s, "nb", [[0, "#6b56d8", 0.55], [0.5, "#3a6fff", 0.22], [1, "#3a6fff", 0]]);
    radial(s, "nb2", [[0, "#8fd3ff", 0.35], [0.6, "#5c9dff", 0.1], [1, "#5c9dff", 0]]);
    [[220, 150, 210, 130, -12], [160, 120, 120, 90, 20], [290, 180, 130, 90, -30], [240, 140, 90, 60, 0]].forEach(([x, y, rx, ry, a], k) =>
      L.svg("ellipse", { cx: x, cy: y, rx, ry, fill: `url(#${k === 3 ? "nb2" : "nb"})`, transform: `rotate(${a} ${x} ${y})` }, s));
  } else if (o.kind === "anomaly") {
    radial(s, "an", [[0, "#ffcc66", 0.7], [0.45, "#ffcc66", 0.18], [1, "#ffcc66", 0]]);
    L.svg("circle", { cx, cy, r: 38, fill: "url(#an)" }, s);
    o.spin = { e: L.layer({ x: 0, y: 0, w: 80, h: 80 }, o.g.e) };
    const sp = svgIn(o.spin.e, 80, 80);
    for (let k = 0; k < 3; k++) L.svg("path", { d: L.arc(40, 40, 24, 30, k * 120, k * 120 + 75), fill: "var(--butter)" }, sp);
  } else if (o.kind === "pulsar") {
    radial(s, "ps", [[0, "#ffffff", 1], [0.3, "#8fd3ff", 0.5], [1, "#8fd3ff", 0]]);
    L.svg("circle", { cx, cy, r: 24, fill: "url(#ps)" }, s);
    L.svg("path", { d: `M${cx - 30},${cy + 30} L${cx + 30},${cy - 30}`, stroke: "#8fd3ff", "stroke-width": 3, opacity: 0.7 }, s);
    L.svg("circle", { cx, cy, r: 6, fill: "#fff" }, s);
    o.ping = { e: L.layer({ x: 16, y: 16, w: 48, h: 48, cls: "ping" }, o.g.e), op: -1 };
  } else if (o.kind === "comet") {
    radial(s, "cm", [[0, "#ffffff", 1], [0.35, "#e6f6ff", 0.8], [0.6, "#8fd3ff", 0.4], [1, "#8fd3ff", 0]]);
    L.svg("circle", { cx, cy, r: 22, fill: "url(#cm)" }, s);
    o.tail = { e: L.layer({ x: 0, y: 0, w: 230, h: 16 }), op: -1 };
    o.tail.e.style.transformOrigin = "0 50%"; o.tail.e.style.borderRadius = "8px";
    o.tail.e.style.background = "linear-gradient(to right, rgba(230,246,255,.85), rgba(143,211,255,.4) 25%, rgba(143,211,255,.1) 70%, rgba(143,211,255,0))";
  } else if (o.kind === "storm") {
    // a front lying along the range arc it sits on: drawn in its own frame, turned with its bearing
    const rr = o.r * K, a = 13, d = L.svg("defs", {}, s), f = L.svg("filter", { id: "sb", x: "-20%", y: "-60%", width: "140%", height: "220%" }, d);
    L.svg("feGaussianBlur", { stdDeviation: 9 }, f);
    const arcD = (r, aa) => { const p = (q) => [cx + r * Math.sin(rad(q)), cy + rr - r * Math.cos(rad(q))]; const [x0, y0] = p(-aa), [x1, y1] = p(aa); return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`; };
    L.svg("path", { d: arcD(rr + 6, a), stroke: "#ff5a3c", "stroke-width": 60, fill: "none", opacity: 0.45, filter: "url(#sb)", "stroke-linecap": "round" }, s);
    L.svg("path", { d: arcD(rr - 4, a - 2), stroke: "#ffcc66", "stroke-width": 26, fill: "none", opacity: 0.35, filter: "url(#sb)", "stroke-linecap": "round" }, s);
    L.svg("path", { d: arcD(rr + 18, a - 1), stroke: "#ff5a3c", "stroke-width": 4, fill: "none", "stroke-dasharray": "18 10", opacity: 0.9 }, s);
    L.svg("path", { d: arcD(rr - 10, a - 4), stroke: "#ffcc66", "stroke-width": 3, fill: "none", "stroke-dasharray": "6 12", opacity: 0.8 }, s);
  } else if (o.kind === "vessel") {
    L.svg("path", { d: `M${cx},${cy - 20} L${cx + 18},${cy} L${cx},${cy + 20} L${cx - 18},${cy} Z`, fill: "var(--mars)" }, s);
    L.svg("circle", { cx, cy, r: 32, fill: "none", stroke: "var(--mars)", "stroke-width": 3, "stroke-dasharray": "8 7" }, s);
    o.proj = { e: L.layer({ x: 0, y: 0, w: 180, h: 4, cls: "proj" }), op: -1 };
  }
  // its name, beside it
  const LW = 330;
  o.lab = { e: L.layer({ x: 0, y: 0, w: LW, h: 46, cls: "ml" }), op: -1 };
  o.labT = L.text({ x: 0, cap: 8, s: 36, c: o.kind === "vessel" ? "mars" : o.kind === "storm" ? "butter" : "ice", txt: o.name }, o.lab.e);
  o.labT.style.width = LW + "px";
}
// where each name sits, from the glyph's centre: [dx, baseline dy, align]
const LABEL = { "Beta Kupsic": [44, 13], "FGC-1182": [34, 13], "Kappa Taurin": [-50, 13, "r"], "Mar Oscura": [0, 128, "c"], "Anomaly 4471": [48, 13],
  "PSR-2209": [42, 13], "C-6012": [30, -30], "Ion Storm": [0, 104, "c"], "": [50, 13] };
const placeLabel = (o) => {
  const [dx, dy, al] = LABEL[o.kind === "vessel" ? "" : o.name], LW = 330;
  const x = al === "c" ? o.x - LW / 2 : al === "r" ? o.x + dx - LW : o.x + dx;
  css(o.labT, "textAlign", al === "c" ? "center" : al === "r" ? "right" : "left");
  L.move(o.lab.e, x, o.y + dy - (8 + 0.72 * 36));          // the name's baseline at dy below the glyph's centre
};
// the focus reticle
const ret = L.layer({ x: 0, y: 0, w: 120, h: 120, cls: "ret" });
[["left", "top", "borderLeftWidth", "borderTopWidth"], ["right", "top", "borderRightWidth", "borderTopWidth"],
 ["left", "bottom", "borderLeftWidth", "borderBottomWidth"], ["right", "bottom", "borderRightWidth", "borderBottomWidth"]]

  const dop = o.kind === "vessel" ? -(o.turned ? -118 : 284) : { star: [-21, 14, 9][o.i] ?? 0, nebula: -4, anomaly: 0, pulsar: 31, comet: -46, storm: -212 }[o.kind];
  put(fVals[3], o.kind === "vessel" ? (o.turned ? "Receding" : "Closing") : (dop > 0 ? "+" : dop < 0 ? "-" : "") + Math.abs(dop) + " km/s");
};
// the readings: a few times a second at most
L.every(250, (t) => {
  const a = sweepAt(t), v = sweepAt(t + 0.05) - a;
  put(sweepB, brg(a)); put(sweepDir, v >= 0 ? "Port to Starboard" : "Starboard to Port");
  put(VESSEL.labT, VESSEL.name);
  put(shipCont, String(OBJ.filter((o) => o.kind !== "vessel" || o.seen).length));
  const fo = OBJ[showFocus.cur];
  if (fo) { if (fo.kind === "vessel" || fo.kind === "storm" || fo.kind === "comet") showFocusVals(fo); put(fName, fo.name); put(fCls, fo.cls); }
}, 0);
later(500, () => { nTL.tick(2); nTR.tick(2); }, 0.3);
});
