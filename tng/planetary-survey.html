const L = LCARS;

// ---------------- the planets: three surveys in turn ----------------

const PLANETS = [
  { name: "Mintaka III", sub: "Mintaka system  ·  Pre-warp civilization  ·  Prime Directive in force",

];
const CYCLE = 210;                                        // seconds on each planet
const START = (() => { const m = /p(\d)/.exec(location.hash); return m ? +m[1] % PLANETS.length : 0; })();   // dev: #p1 starts on the second

// ---------------- the frame: sidebar left, title top right ----------------
const BAR = 64;
L.title({ x: 3700, y: 40, h: BAR, c: "sand", txt: "Planetary Survey  •  " + PLANETS[START].name });
const titleEl = document.querySelector("[data-title]");
// every planet's title measured now, as the page draws it (before the stage is zoomed)
const titleW = PLANETS.map((p) => { titleEl.textContent = "Planetary Survey  •  " + p.name; return titleEl.offsetWidth; });
titleEl.textContent = "Planetary Survey  •  " + PLANETS[START].name;
L.box({ x: 3724, y: 40, w: 92, h: BAR, c: "olive", r: "r" });
L.elbow({ corner: "tl", x: 40, y: 40, w: 1360, h: 250, bw: 240, bh: BAR, R: 150, r: 60, c: "olive" });
L.rect({ x: 1400 + L.GAP, y: 40, w: 300, h: BAR, c: "sand" });
const topBar = L.rect({ x: 1724 + L.GAP, y: 40, w: 3700 - titleW[START] - L.GAP - (1724 + L.GAP), h: BAR, c: "olive" });
[[298, 140, "sand", "Surv 04"], [446, 70, "gold", "Orbit"], [524, 420, "olive", "Planetary"], [952, 70, "sky", "4417"],
 [1030, 300, "tan", "Sensors"], [1338, 70, "butter", "Geo"], [1416, 216, "olive", "Survey"]]
  .forEach(([y, h, c, label]) => L.box({ x: 40, y, w: 240, h, c, label }));
L.elbow({ corner: "bl", x: 40, y: 1640, w: 1500, h: 480, bw: 240, bh: BAR, R: 150, r: 60, c: "tan" });
L.text({ x: 258, base: 1712, s: 40, c: "#000", txt: "Cartography", align: "r", on: true });
[[1540 + L.GAP, 600, "olive"], [2164 + L.GAP, 900, "sand"], [3088 + L.GAP, 3700 - (3088 + L.GAP), "tan"]]
  .forEach(([x, w, c]) => L.rect({ x, y: 2056, w, h: BAR, c }));
L.box({ x: 3724, y: 2056, w: 92, h: BAR, c: "olive", r: "r" });

const header = (x, y, w, label, c1, c2, h = 56, fs = 32) => {
  const lw = Math.round((L.textWidth(label, fs) + 64) / 10) * 10;
  L.box({ x, y, w: lw, h, c: c1, label, fs, r: "l" });
  L.rect({ x: x + lw + L.GAP, y, w: w - lw - L.GAP, h, c: c2 });
};
const fill = (x, y, w, h, c) => {
  const f = L.layer({ x, y, w, h });
  f.style.background = c.startsWith("#") ? c : `var(--${c})`; f.style.transformOrigin = "0 0";
  return f;
};
const fmt = (n) => Math.round(n).toLocaleString("en");
const D = Math.PI / 180;
const wrapLon = (a) => { a = (a + Math.PI) % (2 * Math.PI); return (a < 0 ? a + 2 * Math.PI : a) - Math.PI; };
const fmtLat = (r) => `${Math.abs(r / D).toFixed(1)} ${r >= 0 ? "N" : "S"}`;
const fmtLon = (r) => `${Math.abs(r / D).toFixed(1)} ${r >= 0 ? "E" : "W"}`;
const gridRef = (lat, lon) => "ABCDEF"[L.clamp(Math.floor((90 - lat / D) / 30), 0, 5)] + "-" + String(L.clamp(Math.floor((lon / D + 180) / 30), 0, 11) + 1).padStart(2, "0");

// ---------------- column grid ----------------
const C1 = 330, C1R = 1230, VX = 640;                    // left column; values start at VX
const C2 = 1290, C2R = 2590;                             // the planet
const C3 = 2650, C3R = 3816, VX3 = C3 + (VX - C1);       // right column
const BARR = 170;                                        // bars end this far in from a column's right edge
const rowBase = (i) => 404 + i * 76;                     // upper tables
const lowBase = (i) => 1124 + i * 76;                    // lower tables

// ---------------- status line ----------------
const nameTxt = L.text({ x: C1, cap: 150, s: 100, c: "butter", txt: PLANETS[START].name });
const nameW = PLANETS.map((p) => L.textWidth(p.name, 100));
const subTxt = L.text({ x: 0, base: 222, s: 38, c: "sand", txt: "" });
const pill = L.box({ x: 3416, y: 150, w: 400, h: 72, c: "gold", label: "", r: "lr", fs: 36 });
pill.style.willChange = "opacity";
L.tick((t) => { pill.style.opacity = (0.82 + 0.18 * Math.sin(t * 1.3)).toFixed(3); });

// ---------------- planetary data ----------------
header(C1, 280, C1R - C1, "Planetary Data", "sand", "olive");
const dataRows = PLANETS[0].data.map((_, i) => ({
  k: L.text({ x: C1, base: rowBase(i), s: 40, c: "tan", txt: "" }),
  v: L.text({ x: VX, base: rowBase(i), s: 52, c: "white", txt: "" }),
  n: L.text({ x: C1R, base: rowBase(i), s: 36, c: "olive", txt: "", align: "r" }),
}));

// ---------------- atmosphere ----------------
header(C1, 1000, C1R - C1, "Atmosphere", "tan", "sand");
L.text({ x: C1, base: lowBase(0), s: 40, c: "tan", txt: "Surface Pressure" });
const presV = L.text({ x: VX, base: lowBase(0), s: 52, c: "white", txt: "" });
const presN = L.text({ x: C1R, base: lowBase(0), s: 36, c: "olive", txt: "", align: "r" });
const gasRows = [1, 2, 3, 4, 5].map((i) => {
  const base = lowBase(i), w = C1R - BARR - VX;
  L.rect({ x: VX, y: base - 26, w, h: 26, c: "#24200e" });
  return { k: L.text({ x: C1, base, s: 40, c: "tan", txt: "" }), f: fill(VX, base - 26, w, 26, i % 2 ? "gold" : "sand"),
           v: L.text({ x: C1R, base, s: 52, c: "white", txt: "", align: "r" }), u: 0, goal: 0 };
});
L.tick(() => gasRows.forEach((g) => {
  if (Math.abs(g.goal - g.u) < 0.0005 && g.drawn) return;
  g.u += (g.goal - g.u) * 0.05; g.drawn = true;
  g.f.style.transform = `scaleX(${g.u.toFixed(4)})`;
}));

// ---------------- the globe ----------------
// A WebGL disc: the surface texture is generated once per planet; each frame is a single draw of
// one quad, so the planet can turn smoothly as a real sphere (no strip, no seam) at no CPU cost.
const PX = 1940, PY = 880, PR = 440, PM = 26;            // centre, radius, margin for the atmosphere
const A_ORB = 1.36, BETA = 22 * D, NODE = 0.6;           // orbit radius (in planet radii), view latitude, node
const ROT_T = 160, CLOUD_T = 133, ORB_T = 70, FOOT = 11; // seconds per turn, per cloud turn, per orbit; sensor swath (deg)
const SUN = (() => { const v = [0.58, 0.30, 0.76], n = Math.hypot(...v); return v.map((x) => x / n); })();
header(C2, 280, C2R - C2, "Orbital Survey", "gold", "sand");

const VS = `#version 300 es
in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;
const NOISE = `
float h3(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
float vn(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p, int n) { float a = 0.5, s = 0.0; for (int k = 0; k < 8; k++) { if (k >= n) break; s += a * vn(p); p = p * 2.02 + vec3(3.1, 1.7, 5.3); a *= 0.5; } return s; }`;
// the surface, as an equirectangular map: rgb the ground, alpha the clouds
const GEN = `#version 300 es
precision highp float;
uniform vec2 uSize; uniform vec3 uSeed; uniform float uSea, uIce, uCloud, uDry;
uniform vec3 cDeep, cShelf, cLow, cDry, cMid, cHigh, cIce;
out vec4 o;` + NOISE + `
void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  float lon = uv.x * 6.2831853, lat = (uv.y - 0.5) * 3.1415927;
  vec3 P = vec3(cos(lat) * sin(lon), sin(lat), cos(lat) * cos(lon));
  vec3 q = P * 1.4 + uSeed;
  vec3 w = vec3(fbm(q, 4), fbm(q + 5.2, 4), fbm(q + 9.7, 4));
  float h = fbm(P * 2.0 + uSeed * 1.3 + 1.7 * w, 8);
  float m = fbm(P * 2.4 + uSeed + 11.0, 5) + 0.10 * exp(-pow((abs(lat) - 0.45) / 0.2, 2.0));
  float aa = fwidth(h) * 0.7 + 1e-5, am = fwidth(m) * 0.7 + 1e-5;
  vec3 low = mix(cLow, cDry, smoothstep(uDry - am, uDry + am, m));
  vec3 c = cDeep;
  c = mix(c, cShelf, smoothstep(uSea - 0.04 - aa, uSea - 0.04 + aa, h));
  c = mix(c, low, smoothstep(uSea - aa, uSea + aa, h));
  c = mix(c, cMid, smoothstep(uSea + 0.075 - aa, uSea + 0.075 + aa, h));
  c = mix(c, cHigh, smoothstep(uSea + 0.15 - aa, uSea + 0.15 + aa, h));
  float e = abs(lat) / 1.5707963 + (fbm(P * 4.0 + uSeed + 21.0, 4) - 0.5) * 0.16;
  float ae = fwidth(e) * 0.7 + 1e-5;
  c = mix(c, cIce, smoothstep(uIce - ae, uIce + ae, e));
  float cl = fbm(vec3(P.x * 2.2, P.y * 5.5, P.z * 2.2) + uSeed + 31.0 + 0.6 * w, 6);
  float ac = fwidth(cl) * 0.7 + 1e-5;
  o = vec4(c, smoothstep(uCloud - ac, uCloud + ac, cl));
}`;
const GLOBE = `#version 300 es
precision highp float;
uniform sampler2D uTex, uCov;
uniform vec2 uC; uniform float uR, uK, uRot, uCloudRot, uBeta, uScan, uScanDir, uFoot, uShipVis;
uniform vec3 uSun, uShip;
out vec4 o;
const float PI = 3.1415927;
float line(float d, float w) { return 1.0 - smoothstep(w - 0.5, w + 0.5, d); }    // d, w in device px
void main() {
  vec2 p = (gl_FragCoord.xy - uC) / uR;
  float r = length(p);
  float z = sqrt(max(0.0, 1.0 - r * r));
  vec3 n = vec3(p, z);
  vec3 np = vec3(n.x, n.y * cos(uBeta) + n.z * sin(uBeta), -n.y * sin(uBeta) + n.z * cos(uBeta));
  float lat = asin(clamp(np.y, -1.0, 1.0)), lon = atan(np.x, np.z) - uRot;
  float u = lon / (2.0 * PI), v = 0.5 + lat / PI;
  vec2 du = vec2(dFdx(u), dFdy(u)); du -= floor(du + 0.5);           // no seam where the longitude wraps
  vec2 dv = vec2(dFdx(v), dFdy(v));
  vec4 s = textureGrad(uTex, vec2(u, v), vec2(du.x, dv.x), vec2(du.y, dv.y));
  float cloud = textureGrad(uTex, vec2(u + uCloudRot, v), vec2(du.x, dv.x), vec2(du.y, dv.y)).a;
  float cov = texture(uCov, vec2(u, v)).r;
  vec3 col = s.rgb;
  float lum = dot(col, vec3(0.3, 0.5, 0.2));
  col = mix(mix(vec3(lum), col, 0.7) * 0.55, col, cov);             // not yet mapped: dimmer, a little gray
  col = mix(col, vec3(0.95, 0.96, 1.0), cloud * mix(0.35, 0.8, cov));
  float lit = smoothstep(-0.04, 0.10, dot(n, uSun));
  col = mix(col * vec3(0.16, 0.18, 0.30), col, lit);
  col = mix(col, vec3(0.56, 0.83, 1.0), pow(1.0 - z, 4.0) * 0.25 * (0.25 + 0.75 * lit));
  // graticule, every 30 degrees, turning with the planet
  float latD = lat / PI * 180.0, lonD = lon / PI * 180.0;
  float fwLat = max(fwidth(latD), 1e-4), fwLon = max((abs(du.x) + abs(du.y)) * 360.0, 1e-4);
  float gLat = abs(fract(latD / 30.0 + 0.5) - 0.5) * 30.0 / fwLat;
  float gLon = abs(fract(lonD / 30.0 + 0.5) - 0.5) * 30.0 / fwLon;
  float grid = max(line(gLat, 0.9 * uK), line(gLon, 0.9 * uK) * (1.0 - smoothstep(70.0, 80.0, abs(latD))));
  col = mix(col, vec3(0.02, 0.03, 0.10), grid * 0.5);
  // the pole-to-pole scan line, with a short afterglow behind it
  float sd = latD - uScan;
  float trail = sd * uScanDir < 0.0 ? exp(-abs(sd) / 4.0) * 0.28 : 0.0;
  col = mix(col, vec3(0.56, 0.83, 1.0), max(line(abs(sd) / fwLat, 1.3 * uK) * 0.9, trail));
  // the sensor footprint under the ship
  vec3 q = vec3(cos(lat) * sin(lon), sin(lat), cos(lat) * cos(lon));
  float ang = acos(clamp(dot(q, uShip), -1.0, 1.0)) / PI * 180.0;
  float fr = line(abs(ang - uFoot) / max(fwidth(ang), 1e-4), 1.3 * uK) * 0.95;
  col = mix(col, vec3(1.0, 0.8, 0.4), max(fr, step(ang, uFoot) * 0.16) * uShipVis);
  // the limb, and a thin ring of atmosphere just off it
  float disc = clamp((1.0 - r) * uR + 0.5, 0.0, 1.0);
  float ringA = clamp(1.6 * uK + 0.5 - abs(r - 1.0 - 12.0 * uK / uR) * uR, 0.0, 1.0) * 0.9;
  float glow = r > 1.0 ? 0.30 * exp(-(r - 1.0) * uR / (7.0 * uK)) : 0.0;
  vec3 halo = vec3(0.56, 0.83, 1.0);
  float ha = max(ringA, glow);
  o = vec4(col * disc + halo * ha * (1.0 - disc), disc + ha * (1.0 - disc));
}`;
const MAP = `#version 300 es
precision highp float;
uniform sampler2D uTex, uCov; uniform vec2 uSize; uniform float uLatMax, uK;
out vec4 o;
float line(float d, float w) { return 1.0 - smoothstep(w - 0.5, w + 0.5, d); }
void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  float lonD = -180.0 + 360.0 * uv.x, latD = mix(-uLatMax, uLatMax, uv.y);
  vec2 t = vec2(lonD / 360.0, 0.5 + latD / 180.0);
  vec3 col = texture(uTex, t).rgb;
  float cov = texture(uCov, t).r;
  float lum = dot(col, vec3(0.3, 0.5, 0.2));
  col = mix(mix(vec3(lum), col, 0.7) * 0.5, col, cov);
  float ppd = uSize.x / 360.0;                                        // device px per degree
  float gx = abs(fract(lonD / 30.0 + 0.5) - 0.5) * 30.0 * ppd, gy = abs(fract(latD / 30.0 + 0.5) - 0.5) * 30.0 * ppd;
  col = mix(col, vec3(0.02, 0.03, 0.10), max(line(gx, 0.9 * uK), line(gy, 0.9 * uK)) * 0.5);
  o = vec4(col, 1.0);
}`;

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
// One WebGL canvas: compile, a full-screen triangle, the generated surface, the coverage texture.
function glCanvas(x, y, w, h, fs) {
  const cv = L.el("canvas", "boot fade", L.stage, { position: "absolute", left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  const gl = cv.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl) return null;
  const prog = (src) => {
    const p = gl.createProgram();
    for (const [type, s] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, src]]) {
      const sh = gl.createShader(type); gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh);
    }
    gl.bindAttribLocation(p, 0, "a"); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }

// mark everything within the swath of the point (lat, lon): full inside, a soft edge of a degree
function mark(lat, lon) {

  const j0 = Math.max(0, Math.floor(((lat / D - F) / 180 + 0.5) * COVH)), j1 = Math.min(COVH - 1, Math.ceil(((lat / D + F) / 180 + 0.5) * COVH));
  for (let j = j0; j <= j1; j++) {
    const la = ((j + 0.5) / COVH - 0.5) * Math.PI, sa = Math.sin(la), ca = Math.cos(la);
    const cmax = (Math.cos(F * D) - sl * sa) / Math.max(1e-6, cl * ca);

    fadeOut = true;
    logLine("—", `Survey of ${P.name} transmitted to Starfleet`, "", "Survey", "Sent");
    for (const e of [globe && globe.cv, map && map.cv, over, mover]) if (e) e.style.opacity = "0";
  }
  const s = shipAt(tau);
  mark(s.lat, s.lon);
  if (globe) {
    globe.fit();
    if (dirty[1] >= dirty[0]) { globe.upload(dirty[0], dirty[1]); }
    mapDirty = [Math.min(mapDirty[0], dirty[0]), Math.max(mapDirty[1], dirty[1])];
    dirty = [COVH, -1];
    const u = globe.begin(), gl = globe.gl, k = globe.k;
    gl.uniform2f(u.uC, globe.cv.width / 2, globe.cv.height / 2); gl.uniform1f(u.uR, PR * k); gl.uniform1f(u.uK, k);
    gl.uniform1f(u.uRot, s.rot); gl.uniform1f(u.uCloudRot, -((tau / CLOUD_T - tau / ROT_T) % 1)); gl.uniform1f(u.uBeta, BETA);
    // the scan line: pole to pole and back, easing at each pole
    const sp = (tau / 24) % 2, k1 = L.ease(sp % 1);
    gl.uniform1f(u.uScan, sp < 1 ? L.mix(80, -80, k1) : L.mix(-80, 80, k1)); gl.uniform1f(u.uScanDir, sp < 1 ? -1 : 1);
    gl.uniform3fv(u.uSun, SUN); gl.uniform1f(u.uFoot, FOOT);
    gl.uniform3f(u.uShip, Math.cos(s.lat) * Math.sin(s.lon), Math.sin(s.lat), Math.cos(s.lat) * Math.cos(s.lon));
    gl.uniform1f(u.uShipVis, L.clamp(s.vz * 8 + 0.5));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // the ship: in front of the globe on the near side, behind it on the far side
  const [x, y] = scr(s);
  L.move(shipFront, x - 13, y - 13); L.move(shipBack, x - 13, y - 13);
  shipFront.style.opacity = s.vz >= 0 ? "1" : "0"; shipBack.style.opacity = s.vz >= 0 ? "0" : "1";
  const [mx, my] = mxy(s.lat, s.lon);
  L.move(mship, MX + mx - 11, MY + my - 11);
  mship.style.opacity = Math.abs(s.lat / D) < LATMAX ? "1" : "0";
});
});
