  const dt = tPrev === null ? 0 : Math.min(0.1, t - tPrev); tPrev = t;
  const n = Math.floor(t / PAGE), u = t - n * PAGE;
  const p = (page + n) % PAGES;
  if (p !== shownPage) { shownPage = p; loadPage(p); selRow = -1; }   // the turn: every row is out
  // rows: rise in at the start of a page (not the first), lift away at its end, top first
  rows.forEach((r, i) => {
    let k = 1, dy = 0;
    if (u >= OUT0) { const x = L.ease(L.clamp((u - OUT0 - i * STAG) / FADE)); k = 1 - x; dy = -10 * x; }
    else if (n > 0) { const x = L.ease(L.clamp((u - i * STAG) / FADE)); k = x; dy = 10 * (1 - x); }
    const op = k.toFixed(3), y = dy.toFixed(1);
    if (op !== r.op || y !== r.dy) { r.op = op; r.dy = y; r.e.style.opacity = op; L.move(r.e, 0, +y); }
  });
  // the two records of this page, in turn; none in the last moments before the turn
  const k = u >= OUT0 - 0.6 ? -1 : u >= PICK[1] ? 1 : u >= PICK[0] ? 0 : -1;
  if (k >= 0 && k !== sel) select(k, t);
  if (k < 0) sel = -1;
  if (recSwapAt > 0 && t >= recSwapAt) {
    recSwapAt = -1;
    showRecord(recNext);
    recEls.forEach((e) => e.classList.remove("out"));
    const start = pageStart(shownPage);
    paintIndex(letterOf(crew[start]), letterOf(crew[start + ROWS - 1]), letterOf(recNext));
  }
  // the band fades out, moves while unseen, and fades in on its row; the row's text turns black under it
  const want = sel >= 0 && selRow >= 0, there = want && bandRow === selRow;
  if (want && !there && bandOp === 0) { bandRow = selRow; L.move(band, 0, rowBase(bandRow) - 40); }
  const goal = want && bandRow === selRow ? 1 : 0, was = bandOp;
  bandOp = L.clamp(bandOp + Math.sign(goal - bandOp) * dt / 0.35);
  if (bandOp !== was) band.style.opacity = bandOp.toFixed(3);
  const paint = bandOp > 0.5 ? bandRow : -1;
  if (paint !== painted) { if (painted >= 0) paintRow(rows[painted], false); if (paint >= 0) paintRow(rows[paint], true); painted = paint; }
  // the current shift's cell breathes
  const nowCell = cells[NOW_SHIFT][TODAY];
  css(nowCell, "opacity", nowCell.look === "now" && t > 2 ? (0.8 + 0.2 * Math.cos(t * 1.6)).toFixed(2) : "");
});
L.every(6500, (t) => { if (t > 2) logLine(L.pick(EVENTS)()); }, 0.4);
});
