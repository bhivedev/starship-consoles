<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship Consoles</title>
<link rel="stylesheet" href="lcars-fonts.css">
<style>

:root { --orange:#ff9c1a; --lilac:#c896d8; --blue:#5c9dff; }
body { margin:0; background:#000; color:#ddd; font:17px/1.4 -apple-system, "Segoe UI", sans-serif; padding:32px 48px; }
h1 { font:100px/1 "LCARS", sans-serif; color:var(--orange); margin:0 0 8px; text-transform:uppercase; }
h2 { font:44px/1 "LCARS", sans-serif; color:var(--lilac); text-transform:uppercase; margin:36px 0 12px; }
ul { list-style:none; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; }
a { display:block; padding:12px 18px; border-radius:24px; background:#1a1a1f; color:#fff; text-decoration:none; }
a:hover { background:#2a2a33; } a b { font:28px/1.1 "LCARS", sans-serif; color:var(--orange); display:block; }
a span { color:#999; font-size:14px; }
.shuffle { display:inline-block; background:var(--orange); color:#000; font:30px/1 "LCARS"; padding:14px 30px; border-radius:30px; }
p.note { color:#888; max-width:70em; }
</style></head><body>
<h1>Starship Consoles</h1>
<p><a class="shuffle" href="shuffle.html">Shuffle all, full screen</a></p>
<div id="list"></div>
<script src="screens.js"></script>
<script>
// The list is built from screens.js (generated from the catalog), so it's always the current screens.
const depts = ["", "Bridge & Command", "Engineering", "Science", "Medical", "Operations & Crew", "Tactical & Security", "Navigation & Fleet"];
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("list").innerHTML = depts.slice(1).map((name, i) =>
  `<h2>${name}</h2><ul>` + SCREENS.filter((s) => s.dept === i + 1).map((s) =>
    `<li><a href="${s.path}"><b>${esc(s.title)}</b><span>${esc(s.subtitle)}</span></a></li>`).join("") + "</ul>").join("");
</script>
<p class="note">An unofficial fan project in the style of Star Trek's LCARS displays. Not affiliated with, endorsed or licensed by Paramount, CBS Studios or Skydance. Star Trek and LCARS belong to their owners.</p>
</body></html>
