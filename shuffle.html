<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Starship Consoles</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity 1.5s}iframe.on{opacity:1}
#catch{position:absolute;inset:0;z-index:10}</style>
</head><body>
<div id="catch"></div><!-- above the screens, so clicks and keys reach this page, not a screen -->
<audio id="hum" src="sound/ambience.m4a" loop preload="auto"></audio>
<script src="screens.js"></script>
<script>
// Every screen, shuffled, one every ?every= seconds (default 30), dissolving into the next.
// Arrow keys: previous / next. Click or F11 for full screen. The engine sound starts with the first
// click or key (browsers don't let a page play sound before that); S turns it on or off.
const pages = SCREENS.map(s => s.path);
const every = (+new URLSearchParams(location.search).get("every") || 30) * 1000;
let deck = [], history = [], pos = -1, timer, current;
const deal = () => { if (!deck.length) deck = pages.slice().sort(() => Math.random() - 0.5); return deck.pop(); };
function show(page) {
  const f = document.createElement("iframe"); f.src = page; f.tabIndex = -1; document.body.appendChild(f);
  f.onload = () => { requestAnimationFrame(() => f.classList.add("on"));
    const old = current; current = f; if (old) setTimeout(() => old.remove(), 1600); };
  clearTimeout(timer); timer = setTimeout(next, every);
}
function next() { if (pos + 1 >= history.length) history.push(deal()); show(history[++pos]); }
function prev() { if (pos > 0) show(history[--pos]); }
const hum = document.getElementById("hum"); hum.volume = 0.6;
let started = false;
const start = () => { if (!started) { started = true; hum.play().catch(() => {}); } };
addEventListener("keydown", e => { start(); if (e.key === "ArrowRight") next(); if (e.key === "ArrowLeft") prev();
  if (e.key === "s" || e.key === "S") hum.paused ? hum.play() : hum.pause(); });
addEventListener("click", () => { start(); document.documentElement.requestFullscreen?.(); });
next();
</script></body></html>
