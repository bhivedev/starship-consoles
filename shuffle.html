<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Starship Consoles</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity 1.5s}iframe.on{opacity:1}
#catch{position:absolute;inset:0;z-index:10}</style>
</head><body>
<div id="catch"></div><!-- above the screens, so clicks and keys reach this page, not a screen -->
<audio id="hum" src="sound/ambience.m4a" loop preload="auto"></audio>
<script>
// Every screen, shuffled, one every ?every= seconds (default 30), dissolving into the next.
// Arrow keys: previous / next. Click or F11 for full screen. The engine sound starts with the first
// click or key (browsers don't let a page play sound before that); S turns it on or off.
const pages = ["tng/navigation.html", "tng/engineering.html", "tng/sickbay.html", "tng/tactical.html", "tng/transporter.html", "tng/communications.html", "tng/astrometrics.html", "tng/library-computer.html", "tng/turbolift.html", "tng/ops.html", "tng/science.html", "tng/planetary-survey.html", "tng/stellar-system.html", "tng/security.html", "tng/holodeck.html", "tng/shuttlebay.html", "tng/environmental.html", "tng/warp-field.html", "tng/damage-control.html", "tng/neutral-zone.html", "tng/galactic-map.html", "tng/dilithium.html", "tng/diagnostic.html", "tng/cargo-bay.html", "tng/replicators.html", "tng/crew-manifest.html", "tng/long-range-sensors.html", "tng/mission-ops.html", "tng/deflector.html", "tng/computer-core.html", "tng/conn.html", "tng/saucer-separation.html", "tng/battle-bridge.html", "tng/alert-status.html", "tng/ready-room.html", "tng/main-viewer.html", "tng/briefing.html", "tng/starfleet-orders.html", "tng/first-contact.html", "tng/antimatter-containment.html", "tng/impulse-engines.html", "tng/command-codes.html", "tng/eps-grid.html", "tng/plasma-injectors.html", "tng/structural-integrity.html", "tng/bussard-collectors.html", "tng/inertial-dampers.html", "tng/tractor-beam.html", "tng/subspace-physics.html", "tng/jefferies-tubes.html", "tng/industrial-replicator.html", "tng/temporal-anomaly.html", "tng/gravimetric.html", "tng/nebula.html", "tng/stellar-observation.html", "tng/probe-telemetry.html", "tng/warp-signature.html", "tng/archaeology.html", "tng/exobiology.html", "tng/geology.html", "tng/genetics.html", "tng/quarantine.html", "tng/surgical-bay.html", "tng/medical-tricorder.html", "tng/microbiology.html", "tng/counselor.html", "tng/epidemiology.html", "tng/pharmacy.html", "tng/neurology.html", "tng/medical-records.html", "tng/arboretum.html", "tng/crew-locator.html", "tng/ten-forward.html", "tng/personal-logs.html", "tng/schoolroom.html", "tng/guest-quarters.html", "tng/ships-stores.html", "tng/duty-roster.html", "tng/escape-pods.html", "tng/music-archive.html", "tng/phaser-arrays.html", "tng/torpedo-magazine.html", "tng/shield-frequencies.html", "tng/brig.html", "tng/battle-drill.html", "tng/intruder-tracking.html", "tng/away-team-armoury.html", "tng/tactical-database.html", "tng/starbase-defence.html", "tng/pulsar-navigation.html", "tng/boarding-protocols.html", "tng/starbase-docking.html", "tng/standard-orbit.html", "tng/course-plotting.html", "tng/asteroid-field.html", "tng/fleet-deployment.html", "tng/wormhole-transit.html", "tng/ion-storm.html", "tng/utopia-planitia.html", "tng/search-rescue.html"];
const every = (+new URLSearchParams(location.search).get("every") || 30) * 1000;
let deck = [], history = [], pos = -1, timer, current;
const deal = () => { if (!deck.length) deck = pages.slice().sort(() => Math.random() - 0.5); return deck.pop(); };
function show(page) {
  const f = document.createElement("iframe"); f.src = page; f.tabIndex = -1; document.body.appendChild(f);
  f.onload = () => { requestAnimationFrame(() => f.classList.add("on"));
    const old = current; current = f; if (old) setTimeout(() => old.remove(), 1600); };
  clearTimeout(timer); timer = setTimeout(next, every);
}
function next() { if (pos + 1 >= history.length) history.push(deal()); show(history[++pos]); }
function prev() { if (pos > 0) show(history[--pos]); }
const hum = document.getElementById("hum"); hum.volume = 0.6;
let started = false;
const start = () => { if (!started) { started = true; hum.play().catch(() => {}); } };
addEventListener("keydown", e => { start(); if (e.key === "ArrowRight") next(); if (e.key === "ArrowLeft") prev();
  if (e.key === "s" || e.key === "S") hum.paused ? hum.play() : hum.pause(); });
addEventListener("click", () => { start(); document.documentElement.requestFullscreen?.(); });
next();
</script></body></html>
